name: native-client

on:
  pull_request:
    paths: ['apps/native/**', 'services/hub-rs/**', 'services/claudemon/**', 'vendor/portable-pty/**', 'vendor/gpui-component/**', 'vendor/gpui/**', '.github/workflows/native-client.yml']
  push:
    branches: [main]
    paths: ['apps/native/**', 'services/hub-rs/**', 'services/claudemon/**', 'vendor/portable-pty/**', 'vendor/gpui-component/**', 'vendor/gpui/**', '.github/workflows/native-client.yml']
  workflow_dispatch:

concurrency:
  group: native-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libssl-dev libasound2-dev libvulkan1 mesa-vulkan-drivers xvfb xauth xdotool fonts-dejavu-core
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features ui-tests -- -D warnings
      - name: Reducer, WebSocket and GPUI interaction tests
        run: cargo test --locked --no-fail-fast --features ui-tests -- --test-threads=1
      - name: Windows GPUI crash diagnostics
        # Evidence only: the suite above already failed the job.
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: ./scripts/windows-gpui-crash-diagnostics.ps1 -Out gpui-crash
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Windows'
        with:
          name: native-windows-gpui-crash
          path: apps/native/gpui-crash
          if-no-files-found: ignore
      - name: Verify all Windows updater handoff scenarios ran
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & cargo test --locked --features ui-tests --test windows_update_handoff 2>&1
          $exit = $LASTEXITCODE
          $output | Tee-Object -FilePath windows-update-handoff.log
          if ($exit -ne 0 -or ($output -join "`n") -notmatch 'windows_update_handoff: 6 passed, 0 failed, 0 filtered out') { throw 'Windows updater scenarios did not all pass' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: native-windows-update-handoff
          path: apps/native/windows-update-handoff.log
      - name: Link the native application
        run: cargo build --locked --bin wks-native --bin native-harness
      - name: Real Linux window, keyboard and pixel smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/smoke.py
      - name: Rich transcript real-window smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          target/debug/native-harness serve --bind 127.0.0.1:17996 --sessions 3 --turns 0 --rich-transcript &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          xvfb-run -a -s '-screen 0 1280x1000x24' python3 scripts/smoke.py --bus ws://127.0.0.1:17996/bus --no-input --height 900 --output native-transcript-smoke.png
          xvfb-run -a -s '-screen 0 1280x1000x24' python3 scripts/smoke.py --bus ws://127.0.0.1:17996/bus --no-input --height 900 --scroll-pages 10 --output native-attachment-smoke.png
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: native-linux-smoke
          path: apps/native/native-*smoke.png
      - name: Measure bounded transcript workload
        run: cargo run --locked --release --no-default-features --bin native-harness -- bench --events 20000
