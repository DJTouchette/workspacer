name: release

# Build Workspacer Native (Windows x64 installer, macOS .dmg for Apple Silicon
# and Intel, Linux archive for x64 and arm64) and
# the shared Rust backend/claudemon executables on all three desktop OSes. On a
# version tag (v*) everything is attached to a draft GitHub Release, along with
# a standalone headless-server bundle (workspacer-server-<os>-<arch>) and a
# claudemon-only bundle (workspacer-claudemon-<os>-<arch>) per platform; on
# PRs / manual runs it's a build smoke-test that just uploads the artifacts.
# v0.170.0 was the last release with an Electron app.
#
# The release version is the root VERSION file. apps/desktop/package.json
# carries a copy for the browser app; scripts/check-version.mjs keeps them equal.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Publish to the rolling nightly prerelease'
        type: boolean
        default: false
      migration_preview:
        description: 'Explicit testing nightly during Rust migration (manual default branch, green CI required)'
        type: boolean
        default: false
  # Rolling nightly: rebuild main and republish the `nightly` prerelease
  # (skipped by the gate job when nothing changed since the last one).
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC, overnight for NA

# A newer push to the same ref cancels the older in-progress run (saves minutes
# on PRs). Tag builds use the tag as the group, so they never cancel each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether this run is a nightly (schedule, or dispatch with the
  # nightly input) and whether to build at all — a scheduled run with no new
  # commits since the last nightly is skipped, saving ~3 runner-hours/night.
  # Also stamps the nightly version ONCE so all three legs agree (legs stamping
  # their own dates could straddle midnight UTC) and the stamp stays semver-
  # monotonic across same-day rebuilds (a trailing sha compares lexically and
  # can go backwards; a datetime cannot). The stamp is ONE joined numeric
  # identifier — a dotted .HHMM piece would have leading zeros at the 08:00
  # cron, which strict semver forbids and npm silently rewrites (.0800 → .800),
  # leaving the stamp disagreeing with the shipped version. The old release is
  # NOT deleted here — publish-nightly rolls it after every leg has built, so
  # a failed build leaves yesterday's nightly in place instead of nothing.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      nightly: ${{ steps.decide.outputs.nightly }}
      build: ${{ steps.decide.outputs.build }}
      stamp: ${{ steps.decide.outputs.stamp }}
      migration_preview: ${{ steps.decide.outputs.migration_preview }}
    steps:
      - uses: actions/checkout@v5
      - name: VERSION and the browser app's version agree
        run: node scripts/check-version.mjs
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUEST_MIGRATION_PREVIEW: ${{ inputs.migration_preview }}
        run: |
          set -euo pipefail
          nightly=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.nightly }}" = "true" ]; then
            nightly=true
          fi
          build=true
          migration_preview=false
          if [ "$REQUEST_MIGRATION_PREVIEW" = "true" ] && [ "$nightly" != "true" ]; then
            echo "::error::migration_preview requires nightly=true"
            exit 1
          fi
          if [ "$nightly" = "true" ]; then
            if [ -f services/hub-rs/migration.json ] && ! python3 scripts/hub-migration.py ready; then
              if [ "$REQUEST_MIGRATION_PREVIEW" = "true" ]; then
                python3 scripts/check-nightly-preview.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
                  --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --default-branch "$RELEASE_DEFAULT_BRANCH"
                migration_preview=true
                echo "::notice::Publishing an explicitly requested Rust migration testing nightly; audit remains incomplete."
              else
                echo "::notice::Rust migration completion checks are pending; deferring the nightly."
                build=false
              fi
            fi
            last=$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" -q .object.sha 2>/dev/null || echo none)
            if [ "$last" = "${{ github.sha }}" ]; then
              echo "nightly already built for ${{ github.sha }} — skipping"
              build=false
            fi
          fi
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          echo "migration_preview=$migration_preview" >> "$GITHUB_OUTPUT"

  # Shared Rust backend + browser app per OS: the headless-server and
  # claudemon-only bundles, and (Windows) the backend the native installer
  # embeds. The native client builds in its own jobs below.
  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            server: windows-x64
          # Apple Silicon only: GitHub is retiring the Intel macOS runners and
          # the daemons build natively per arch.
          - os: macos-15
            server: darwin-arm64
          # Oldest supported Ubuntu, so the binaries link an old glibc.
          - os: ubuntu-22.04
            server: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/src/renderer/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache release Rust backends
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/claudemon
            services/hub-rs
          cache-on-failure: true
          cache-bin: false
          shared-key: release-backends-${{ matrix.server }}

      # Build tooling only: no Electron app is packaged, so skip the
      # postinstall that rebuilds better-sqlite3 against Electron's ABI.
      - name: Install desktop build tools
        run: npm ci --ignore-scripts

      - name: Install renderer deps
        working-directory: apps/desktop/src/renderer
        run: npm ci

      - name: Stamp nightly version
        if: needs.gate.outputs.nightly == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base=$(tr -d '[:space:]' < ../../VERSION)
          v="$base-nightly.${{ needs.gate.outputs.stamp }}"
          printf '%s\n' "$v" > ../../VERSION
          # The browser app reports package.json's version; keep it in step.
          npm version --no-git-tag-version "$v"
          node ../../scripts/check-version.mjs

      # The browser app `workspacer serve` hosts at /app, and the Rust hub and
      # claudemon executables.
      - name: Build browser app and Rust backends
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gen-desktop-services.mjs
          node scripts/gen-agent-skill-plugins.mjs
          node scripts/gen-config-defaults.mjs
          node scripts/gen-changelog.mjs
          npm run build:renderer:web
          npm run build:hub
          npm run build:claudemon

      # Shared Rust backend: one standalone executable, plus the separately
      # usable claudemon executable and browser/plugin assets.
      - name: Bundle standalone server
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ext=""
          tmp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ext=".exe"
            tmp=$(cygpath -u "$tmp") # git-bash coreutils choke on C:\-style paths
          fi
          dir="$tmp/workspacer-server"
          rm -rf "$dir"
          mkdir -p "$dir"
          cp "services/hub-rs/target/release/workspacer-rust$ext" \
             "services/claudemon/target/release/claudemon$ext" "$dir/"
          cp "$dir/workspacer-rust$ext" "$dir/workspacer$ext"
          # The built web app: `workspacer serve` auto-serves a sibling web/
          # at /app (the full renderer), no flag needed.
          cp -r "apps/desktop/dist/web" "$dir/web"
          cp -r "plugins/examples" "$dir/examples"
          # Shared stamp writer gives artifact consumers the exact source revision.
          stamp_tag=""
          if [ "${{ needs.gate.outputs.nightly }}" = "true" ]; then
            stamp_tag="nightly"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            stamp_tag="$GITHUB_REF_NAME"
          fi
          WKS_STAMP_COMPONENT=server \
          WKS_STAMP_INSTALL=release \
          WKS_STAMP_VERSION="$(tr -d '[:space:]' < VERSION)" \
          WKS_STAMP_TAG="$stamp_tag" \
          WKS_STAMP_COMMIT="${{ github.sha }}" \
          WKS_STAMP_PLATFORM="${{ matrix.server }}" \
          WKS_STAMP_RUN="${{ github.run_id }}" \
            bash deploy/fly/write-build-stamp.sh "$dir/build-stamp"
          cat > "$dir/README.md" <<'EOF'
          # workspacer headless server

          Run workspacer's agent fleet on a machine with no desktop app:

          1. Extract this directory anywhere.
          2. Run `./workspacer serve`.

          The Rust executable owns the session engine, hub, desktop services,
          and MCP facade in one process. The bundled web/ directory serves the
          browser app; examples/ contains optional plugins. External provider
          CLIs and plugin sidecars may need their own runtimes, including Node.

              ./workspacer status
              ./workspacer install-cli
              ./workspacer --host 0.0.0.0 serve

          The build-stamp file records the source commit and release tag.

          Docs: https://github.com/DJTouchette/workspacer
          EOF
          out="$PWD/apps/desktop/release"
          mkdir -p "$out"
          name="workspacer-server-${{ matrix.server }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd "$tmp" && 7z a "$out/$name.zip" workspacer-server)
          else
            tar -C "$tmp" -czf "$out/$name.tar.gz" workspacer-server
          fi

      - name: Packaged server smoke regressions
        working-directory: ${{ github.workspace }}
        run: python -B -m unittest discover -s scripts -p 'test_smoke_server_bundle.py' -v

      - name: Smoke extracted standalone server without Node
        working-directory: ${{ github.workspace }}
        run: python scripts/smoke-server-bundle.py --release-dir apps/desktop/release --platform ${{ matrix.server }} --commit ${{ github.sha }}

      # Internal transfer only: its name intentionally does not match the
      # publisher's workspacer-* artifact selector.
      - name: Stage verified Windows backend input for native packaging
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputDir = Join-Path $env:RUNNER_TEMP 'rust-windows-backend-input'
          New-Item -ItemType Directory -Force $inputDir | Out-Null
          Copy-Item services/hub-rs/target/release/workspacer-rust.exe $inputDir
          $binary = Join-Path $inputDir 'workspacer-rust.exe'
          @{
            kind = 'rust-windows-backend'; commit = $env:GITHUB_SHA
            version = (Get-Content VERSION -Raw).Trim()
            platform = 'windows-x64'; run = $env:GITHUB_RUN_ID
            files = @(@{ path = 'workspacer-rust.exe'; sha256 = (Get-FileHash $binary -Algorithm SHA256).Hash })
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $inputDir 'provenance.json')

      - name: Upload Windows backend input
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rust-windows-backend-input
          path: ${{ runner.temp }}/rust-windows-backend-input/
          if-no-files-found: error
          retention-days: 3

      # Standalone claudemon-only bundle, for people building their own client
      # against the session API documented on landing/build-client.html — they
      # don't need workspacer/hub/brain at all, just the daemon. Same binary
      # the server bundle above ships, packaged alone.
      - name: Bundle standalone claudemon
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ext=""
          tmp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ext=".exe"
            tmp=$(cygpath -u "$tmp")
          fi
          dir="$tmp/workspacer-claudemon"
          rm -rf "$dir"
          mkdir -p "$dir"
          cp "services/claudemon/target/release/claudemon$ext" "$dir/"
          cat > "$dir/README.md" <<'EOF'
          # claudemon

          The session daemon, standalone — no workspacer/hub/brain, just the
          HTTP + SSE API that owns Claude Code (and Codex/OpenCode/Pi) sessions.

              ./claudemon serve --host 127.0.0.1 --hook-port 7890 --api-port 7891

          Loopback-only, unauthenticated by design — see the API reference and
          security notes before exposing it beyond localhost:
          https://github.com/DJTouchette/workspacer/blob/main/landing/build-client.html

          Want the full fleet (bus, plugins, remote clients, MCP) instead? Grab
          workspacer-server-* from the same release.
          EOF
          out="$PWD/apps/desktop/release"
          mkdir -p "$out"
          name="workspacer-claudemon-${{ matrix.server }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd "$tmp" && 7z a "$out/$name.zip" workspacer-claudemon)
          else
            tar -C "$tmp" -czf "$out/$name.tar.gz" workspacer-claudemon
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workspacer-server-${{ matrix.server }}
          # Archives are already compressed; avoid recompressing them.
          compression-level: 0
          path: |
            apps/desktop/release/workspacer-server-*
            apps/desktop/release/workspacer-claudemon-*
          if-no-files-found: error

      # The release body comes from CHANGELOG.md, cut by scripts/changelog-section.mjs.
      # That script EXITS NONZERO when the tagged version has no section, so tagging a
      # release nobody wrote notes for fails the build rather than publishing an empty
      # release page. The app renders the same markdown in Settings → Updates (via
      # changelog.generated.ts), so the two cannot drift.
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        shell: bash
        # The job builds from apps/desktop, but the script and the CHANGELOG.md
        # it reads are at the repo root. This step only fires on a v* tag, so it
        # had never actually run — it shipped broken with the feature and failed
        # the first release that tried to use it.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          body="$(node scripts/changelog-section.mjs "$version")"
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$body"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      # Only on a version tag: attach this OS's installers to the GitHub Release
      # for the tag (each matrix leg appends its own files to the same release).
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          # The standalone headless-server + claudemon-only bundles; the native
          # downloads come from attach-native-release.
          files: |
            apps/desktop/release/workspacer-server-*
            apps/desktop/release/workspacer-claudemon-*
          draft: true
          fail_on_unmatched_files: false

    permissions:
      contents: write

  # Independent runner: native compilation overlaps the backend build. Cargo target locks and the two Cargo.lock graphs stay separate.
  native-windows-build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache native release dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native
          cache-on-failure: true
          cache-bin: false
          shared-key: release-native-windows
      - name: Build native Windows application and probe
        working-directory: apps/native
        run: cargo build --locked --release --bin wks-native --bin native-harness
      - name: Capture native binaries and compiler-runner CRT provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputDir = Join-Path $env:RUNNER_TEMP 'native-windows-build-input'
          New-Item -ItemType Directory -Force "$inputDir/bin", "$inputDir/crt" | Out-Null
          Copy-Item apps/native/target/release/wks-native.exe "$inputDir/bin/"
          Copy-Item apps/native/target/release/native-harness.exe "$inputDir/bin/"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools not found on native compiler runner' }
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'Native compiler-runner x64 CRT not found' }
          Copy-Item "$($crt.FullName)/*.dll" "$inputDir/crt/"
          foreach ($required in @('vcruntime140.dll', 'msvcp140.dll')) {
            if (!(Test-Path "$inputDir/crt/$required" -PathType Leaf)) { throw "Missing compiler CRT: $required" }
          }
          $version = (Get-Content VERSION -Raw).Trim()
          if ('${{ needs.gate.outputs.nightly }}' -eq 'true') { $version += '-nightly.${{ needs.gate.outputs.stamp }}' }
          $files = @(Get-ChildItem $inputDir -File -Recurse | ForEach-Object {
            @{ path = [System.IO.Path]::GetRelativePath($inputDir, $_.FullName).Replace('\', '/')
               sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          })
          @{
            kind = 'native-windows-build'; commit = $env:GITHUB_SHA; version = $version
            platform = 'windows-x64'; run = $env:GITHUB_RUN_ID
            rustc = (& rustc --version | Out-String).Trim()
            image = $env:ImageVersion; crtSource = $crt.FullName; files = $files
          } | ConvertTo-Json -Depth 5 | Set-Content "$inputDir/provenance.json"
      - name: Upload native compiler outputs
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-build-input
          path: ${{ runner.temp }}/native-windows-build-input/
          if-no-files-found: error
          retention-days: 3

  native-windows-package:
    needs: [gate, build, native-windows-build]
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write # Native installer remains an attachment to stable-tag drafts.
      id-token: write # Azure OIDC federated login for Windows Trusted Signing
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      # The packaging scripts are plain Node with no dependencies: no npm
      # install, and nothing from apps/desktop.
      - name: Set up packaging Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # package-windows.mjs and the build stamp read VERSION.
      - name: Stamp nightly version
        if: needs.gate.outputs.nightly == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base=$(tr -d '[:space:]' < VERSION)
          printf '%s\n' "$base-nightly.${{ needs.gate.outputs.stamp }}" > VERSION
          cat VERSION
      - name: Download native compiler inputs
        uses: actions/download-artifact@v4
        with:
          name: native-windows-build-input
          path: ${{ runner.temp }}/native-windows-build-input
      - name: Download the build leg's Windows backend
        uses: actions/download-artifact@v4
        with:
          name: rust-windows-backend-input
          path: ${{ runner.temp }}/rust-windows-backend-input
      - name: Verify and restore exact build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          function Verify-Inputs([string]$directory, [string]$kind) {
            $receiptPath = Join-Path $directory 'provenance.json'
            $receipt = Get-Content $receiptPath -Raw | ConvertFrom-Json
            if ($receipt.kind -ne $kind -or $receipt.commit -ne $env:GITHUB_SHA -or
                $receipt.version -ne $version -or $receipt.platform -ne 'windows-x64' -or
                $receipt.run -ne $env:GITHUB_RUN_ID) { throw "Build input provenance mismatch: $kind" }
            if (!$receipt.files -or $receipt.files.Count -eq 0) { throw "Missing file hashes: $kind" }
            $seen = @{}
            foreach ($file in $receipt.files) {
              if ($file.path -notmatch '^(bin/[^/]+[.]exe|crt/[^/]+[.]dll|workspacer-rust[.]exe)$' -or
                  $file.path.Contains('..') -or $file.path.Contains('\') -or $file.path.Contains(':') -or
                  $seen.ContainsKey($file.path)) { throw "Invalid build input path: $kind" }
              $seen[$file.path] = $true
              $path = Join-Path $directory $file.path
              if (!(Test-Path $path -PathType Leaf) -or
                  (Get-FileHash $path -Algorithm SHA256).Hash -ne $file.sha256) { throw "Build input hash mismatch: $kind" }
            }
            $actual = @(Get-ChildItem $directory -File -Recurse | Where-Object { $_.FullName -ne $receiptPath })
            if ($actual.Count -ne $receipt.files.Count) { throw "Unrecorded build inputs: $kind" }
            return $receipt
          }
          $nativeDir = Join-Path $env:RUNNER_TEMP 'native-windows-build-input'
          $backendDir = Join-Path $env:RUNNER_TEMP 'rust-windows-backend-input'
          $native = Verify-Inputs $nativeDir 'native-windows-build'
          $backend = Verify-Inputs $backendDir 'rust-windows-backend'
          foreach ($path in @('bin/wks-native.exe', 'bin/native-harness.exe', 'crt/vcruntime140.dll', 'crt/msvcp140.dll')) {
            if ($path -notin $native.files.path) { throw "Missing native build input: $path" }
          }
          if ($backend.files.Count -ne 1 -or $backend.files[0].path -ne 'workspacer-rust.exe') { throw 'Unexpected backend input set' }
          if (!$native.crtSource -or !$native.rustc) { throw 'Missing native compiler provenance' }
          New-Item -ItemType Directory -Force apps/native/target/release, services/hub-rs/target/release | Out-Null
          Copy-Item "$nativeDir/bin/*.exe" apps/native/target/release/
          # Carry the same CRT beside the harness too, avoiding runner-global DLL resolution.
          Copy-Item "$nativeDir/crt/*.dll" apps/native/target/release/
          Copy-Item "$backendDir/workspacer-rust.exe" services/hub-rs/target/release/
          "NATIVE_CRT_DIR=$nativeDir/crt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Windows code signing (Azure Trusted Signing), the same account, endpoint
      # and condition the Electron installer was signed with through v0.170.0:
      # real v* tags only, once the AZURE_CODESIGN_PROFILE repo variable exists.
      # PRs, nightlies and the pre-signing-setup period skip all three signing
      # steps and ship exactly the unsigned installer they did before.
      - name: Azure login (Windows signing)
        if: startsWith(github.ref, 'refs/tags/v') && vars.AZURE_CODESIGN_PROFILE != '' && needs.gate.outputs.nightly != 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Before packaging, so the installer carries signed executables. The CRT
      # DLLs are already signed by Microsoft; native-harness.exe is not shipped.
      - name: Sign the shipped executables
        if: startsWith(github.ref, 'refs/tags/v') && vars.AZURE_CODESIGN_PROFILE != '' && needs.gate.outputs.nightly != 'true'
        shell: pwsh
        env:
          CODESIGN_PROFILE: ${{ vars.AZURE_CODESIGN_PROFILE }}
          CODESIGN_PUBLISHER: ${{ vars.AZURE_CODESIGN_PUBLISHER }}
        run: |
          ./apps/native/scripts/sign-windows.ps1 -Files @(
            'apps/native/target/release/wks-native.exe',
            'services/hub-rs/target/release/workspacer-rust.exe')
      # GitHub's Windows image ships NSIS; the pinned Chocolatey install only
      # covers an image without it. No node_modules are involved.
      - name: Ensure NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (!(Test-Path $makensis -PathType Leaf)) {
            Write-Host '::warning::NSIS is not preinstalled on this runner image; installing NSIS 3.10 with Chocolatey.'
            choco install nsis --version=3.10 --no-progress -y
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $makensis -PathType Leaf)) { throw 'NSIS installation failed' }
          }
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'makensis is not runnable' }
      - name: Resolve native installer compiler
        run: node apps/native/scripts/resolve-nsis.mjs
      - name: Package native Windows installer
        shell: pwsh
        run: |
          node --test apps/native/scripts/windows-payload.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native payload tests failed' }
          node apps/native/scripts/package-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native packaging failed' }
      - name: Sign the installer
        if: startsWith(github.ref, 'refs/tags/v') && vars.AZURE_CODESIGN_PROFILE != '' && needs.gate.outputs.nightly != 'true'
        shell: pwsh
        env:
          CODESIGN_PROFILE: ${{ vars.AZURE_CODESIGN_PROFILE }}
          CODESIGN_PUBLISHER: ${{ vars.AZURE_CODESIGN_PUBLISHER }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          ./apps/native/scripts/sign-windows.ps1 -Files @("apps/native/target/package/Workspacer-Setup-$version-x64.exe")
      # After signing: the checksum is of the file people download. Same
      # `<hash>  <name>` line sha256sum writes for the .dmg and .tar.gz.
      - name: Checksum the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = Get-Item "apps/native/target/package/Workspacer-Setup-$version-x64.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$($installer.FullName).sha256", "$hash  $($installer.Name)`n")
          Get-Content "$($installer.FullName).sha256"
      - name: Smoke test native Windows install, preview upgrade, local backend and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          ./apps/native/scripts/test-windows-installer.ps1 -Installer "apps/native/target/package/Workspacer-Setup-$version-x64.exe"
      - name: Upload native installer
        uses: actions/upload-artifact@v4
        with:
          name: workspacer-native-windows
          compression-level: 0
          path: |
            apps/native/target/package/Workspacer-Setup-*-x64.exe
            apps/native/target/package/Workspacer-Setup-*-x64.exe.sha256
          if-no-files-found: error

  # Native macOS: Workspacer.app (ad-hoc signed, not notarized) in a .dmg, built
  # natively per architecture. The binary embeds the Rust hub and claudemon, so
  # there is no separate backend input to carry over. The Apple Silicon leg
  # keeps the job's original check name.
  native-macos:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native-macos
            runner: macos-15
            arch: arm64
          - name: native-macos-x64
            runner: macos-15-intel
            arch: x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # Attach to the stable-tag draft.
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache native release dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native
          cache-on-failure: true
          cache-bin: false
          shared-key: release-native-macos-${{ matrix.arch }}
      - name: Package Workspacer.app and .dmg
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          if [ "${{ needs.gate.outputs.nightly }}" = "true" ]; then version="$version-nightly.${{ needs.gate.outputs.stamp }}"; fi
          apps/native/scripts/package-macos.sh --version "$version"
      - name: Smoke the .dmg (mount, signature, stamp, launch)
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls apps/native/target/package/Workspacer-*-macos-${{ matrix.arch }}.dmg)
          (cd apps/native/target/package && shasum -a 256 -c "$(basename "$dmg").sha256")
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -force || true' EXIT
          app="$mnt/Workspacer.app"
          test -L "$mnt/Applications"
          codesign --verify --strict --verbose=2 "$app"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['platform']=='darwin-${{ matrix.arch }}', d; print(d)" "$app/Contents/Resources/build-stamp.json"
          "$app/Contents/MacOS/wks-native" --help >/dev/null
      - name: Upload native macOS .dmg
        uses: actions/upload-artifact@v4
        with:
          name: workspacer-native-macos-${{ matrix.arch }}
          compression-level: 0
          path: |
            apps/native/target/package/Workspacer-*-macos-${{ matrix.arch }}.dmg
            apps/native/target/package/Workspacer-*-macos-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error

  # Native Linux: relocatable tar.gz with a per-user install.sh. x64 is built on
  # the oldest supported Ubuntu, so the binary links an old, widely compatible
  # glibc; arm64 on GitHub's hosted arm runner. The x64 leg keeps the job's
  # original check name.
  native-linux:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native-linux
            runner: ubuntu-22.04
            arch: x64
          - name: native-linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # Attach to the stable-tag draft.
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache native release dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native
          cache-on-failure: true
          cache-bin: false
          shared-key: release-native-linux-${{ matrix.arch }}
      - name: Linux native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libssl-dev libasound2-dev
      - name: Package the Linux archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          if [ "${{ needs.gate.outputs.nightly }}" = "true" ]; then version="$version-nightly.${{ needs.gate.outputs.stamp }}"; fi
          apps/native/scripts/package-linux.sh --version "$version"
      - name: Smoke install, launch and uninstall from a clean prefix
        shell: bash
        run: |
          set -euo pipefail
          cd apps/native/target/package
          archive=$(ls workspacer-*-linux-${{ matrix.arch }}.tar.gz)
          sha256sum -c "$archive.sha256"
          work=$(mktemp -d)
          tar -xzf "$archive" -C "$work"
          (cd "$work"/workspacer-*-linux-${{ matrix.arch }} && PREFIX="$work/prefix" ./install.sh)
          "$work/prefix/lib/workspacer-native/wks-native" --help >/dev/null
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['platform']=='linux-${{ matrix.arch }}', d; print(d)" "$work/prefix/lib/workspacer-native/build-stamp.json"
          "$work/prefix/bin/wks-native-uninstall"
          test ! -e "$work/prefix/lib/workspacer-native"
      - name: Upload native Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: workspacer-native-linux-${{ matrix.arch }}
          compression-level: 0
          path: |
            apps/native/target/package/workspacer-*-linux-${{ matrix.arch }}.tar.gz
            apps/native/target/package/workspacer-*-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  # One job attaches every native download to the stable-tag draft, after the
  # build legs have created it with the release notes: concurrent softprops
  # calls on a tag with no release yet can each create their own draft.
  attach-native-release:
    needs: [gate, build, native-windows-package, native-macos, native-linux]
    if: startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.nightly != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: workspacer-native-*
          merge-multiple: true
          path: native
      - name: Attach native downloads to stable-tag draft
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/Workspacer-Setup-*-x64.exe
            native/Workspacer-Setup-*-x64.exe.sha256
            native/Workspacer-*-macos-arm64.dmg
            native/Workspacer-*-macos-arm64.dmg.sha256
            native/Workspacer-*-macos-x64.dmg
            native/Workspacer-*-macos-x64.dmg.sha256
            native/workspacer-*-linux-x64.tar.gz
            native/workspacer-*-linux-x64.tar.gz.sha256
            native/workspacer-*-linux-arm64.tar.gz
            native/workspacer-*-linux-arm64.tar.gz.sha256
          draft: true
          fail_on_unmatched_files: true

      # Installed Electron 0.170.0 (the last Electron release, Windows and
      # Linux) still asks /releases/latest for latest.yml / latest-linux.yml
      # every few hours, and reports an error when the newest release has
      # none. Carry v0.170.0's files forward UNCHANGED: they say "version
      # 0.170.0", which that app already is, so it reports up to date and
      # downloads nothing. Best effort: without them the only cost is that
      # error, so a missing v0.170.0 feed warns instead of failing the release.
      - name: Fetch the final Electron release's update feed
        id: electron-feed
        if: github.ref_name != 'v0.170.0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p electron-feed
          if ! gh release download v0.170.0 --repo "$REPO" --pattern 'latest*.yml' --dir electron-feed; then
            echo "::warning::v0.170.0 has no latest*.yml to carry forward; installed Electron 0.170.0 will report an update error."
          fi
          found=false
          if compgen -G 'electron-feed/latest*.yml' > /dev/null; then found=true; ls -l electron-feed; fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - name: Attach the Electron update feed to stable-tag draft
        if: steps.electron-feed.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: electron-feed/latest*.yml
          draft: true
          fail_on_unmatched_files: false

  # Roll the nightly only after every platform and native installer smoke passed
  # (a matrix job in `needs` succeeds only when all of its legs did).
  # Build failure leaves the previous release intact; the publish-last rollout
  # below still has a non-atomic boundary after deleting the previous release.
  # Every expected asset is verified present BEFORE the old release is
  # touched, so a leg that "succeeded" but produced no installer can't ship a
  # release the native updater can't read. Nightly installs follow the
  # `nightly` tag; stable ones resolve /releases/latest, which excludes
  # prereleases (and the `nightly` tag sits outside the landing page's v*).
  publish-nightly:
    needs: [gate, build, native-windows-package, native-macos, native-linux]
    if: needs.gate.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    # One lock across ALL refs: a dispatch-nightly from another branch would
    # otherwise land in a different release-${ref} group and interleave its
    # delete/create with the cron's on the single shared `nightly` tag.
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      # Only for CHANGELOG.md + scripts/changelog-section.mjs: the notes below
      # are cut from the same file the app's Settings → Updates and every tagged
      # release page read, so a nightly cannot describe itself differently from
      # the release it becomes.
      - uses: actions/checkout@v5

      - name: Publication request and readback regressions (fake gh)
        run: python3 -B -m unittest discover -s scripts -p 'test_finalize_nightly.py' -v

      - name: Electron nightly feed bridge regressions
        run: python3 -B -m unittest discover -s scripts -p 'test_electron_feed_bridge.py' -v

      - name: Recheck testing-nightly CI before changing the live release
        if: needs.gate.outputs.migration_preview == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 scripts/check-nightly-preview.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --default-branch "$RELEASE_DEFAULT_BRANCH"

      - uses: actions/download-artifact@v4
        with:
          pattern: workspacer-*
          merge-multiple: true
          path: dist

      # An installed Electron NIGHTLY polls .../releases/download/nightly/
      # latest*.yml. Publish v0.170.0's feed files there with each url/path
      # made an absolute link to the v0.170.0 asset, so the last Electron
      # nightly updates itself to the final Electron release (whose own feed is
      # /releases/latest, handled on stable tags). Best effort: any failure
      # here warns and the nightly ships without the bridge.
      - name: Bridge the Electron nightly feed to v0.170.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/electron-feed"
          mkdir -p "$feed"
          if gh release download v0.170.0 --repo "$REPO" --pattern 'latest*.yml' --dir "$feed" \
             && gh release view v0.170.0 --repo "$REPO" --json assets > "$RUNNER_TEMP/electron-assets.json" \
             && compgen -G "$feed/latest*.yml" > /dev/null; then
            python3 scripts/electron-feed-bridge.py --repo "$REPO" --tag v0.170.0 \
              --assets "$RUNNER_TEMP/electron-assets.json" --out dist "$feed"/latest*.yml \
              || { echo "::warning::Could not rewrite the Electron nightly feed; publishing without it."; rm -f dist/latest*.yml; }
          else
            echo "::warning::v0.170.0 has no latest*.yml; Electron nightlies will not be bridged to it."
          fi

      - name: Verify assets and roll the nightly release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUST_MIGRATION_PREVIEW: ${{ needs.gate.outputs.migration_preview }}
        run: |
          set -euo pipefail
          # Expected assets, per platform — every glob the create below uses
          # must match BEFORE we touch the live release.
          for pat in 'Workspacer-Setup-*-x64.exe' 'Workspacer-Setup-*-x64.exe.sha256' \
                     'Workspacer-*-macos-arm64.dmg' 'Workspacer-*-macos-arm64.dmg.sha256' \
                     'Workspacer-*-macos-x64.dmg' 'Workspacer-*-macos-x64.dmg.sha256' \
                     'workspacer-[0-9]*-linux-x64.tar.gz' 'workspacer-[0-9]*-linux-x64.tar.gz.sha256' \
                     'workspacer-[0-9]*-linux-arm64.tar.gz' 'workspacer-[0-9]*-linux-arm64.tar.gz.sha256' \
                     'workspacer-server-windows-x64.zip' \
                     'workspacer-server-linux-x64.tar.gz' \
                     'workspacer-server-darwin-arm64.tar.gz' \
                     'workspacer-claudemon-windows-x64.zip' \
                     'workspacer-claudemon-linux-x64.tar.gz' \
                     'workspacer-claudemon-darwin-arm64.tar.gz'; do
            compgen -G "$pat" > /dev/null || { echo "missing expected asset: $pat"; exit 1; }
          done

          # Roll the release PUBLISH-LAST so a failure at any point leaves
          # yesterday's nightly live instead of nothing:
          #   1. drop stray drafts from earlier failed rolls
          #   2. upload today's build as a DRAFT (drafts create no tag, so it
          #      coexists with the live release)
          #   3. retire the old live release + tag — by id, since gh's
          #      name-based lookup could resolve to our fresh draft
          #   4. publish the draft (GitHub creates the tag at --target now)

          for id in $(gh api "repos/$REPO/releases" --paginate \
                        -q '.[] | select(.draft and .tag_name=="nightly") | .id'); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done

          # The body is the [Unreleased] section — which is exactly what a
          # nightly IS: main since the last tagged release. Same file, same
          # cutter as a tagged release page and the app's Settings → Updates, so
          # the three cannot drift. An empty section is NOT fatal here (unlike
          # tagging a release with no notes): a nightly must still ship the day
          # someone lands a change nobody wrote a line for.
          notes_file="$RUNNER_TEMP/nightly-notes.md"
          native_installers=( Workspacer-Setup-*-x64.exe )
          native_dmgs=( Workspacer-*-macos-arm64.dmg )
          native_dmgs_x64=( Workspacer-*-macos-x64.dmg )
          native_linux=( workspacer-[0-9]*-linux-x64.tar.gz )
          native_linux_arm64=( workspacer-[0-9]*-linux-arm64.tar.gz )
          {
            printf 'Rolling nightly build of main (%s). Unsigned.\n\n' "${{ github.sha }}"
            if [ "$RUST_MIGRATION_PREVIEW" = "true" ]; then
              printf '**Rust migration testing nightly.** Workspacer Native embeds the shared Rust backend. The compatibility audit and legacy-code retirement are still in progress. This release is for testing and does not certify complete migration parity.\n\n'
            fi
            printf 'Workspacer Native is unsigned. Windows installs update in place from Settings → About; macOS and Linux show when an update exists and install by replacing the app. To return to stable, install a release build from the releases page.\n\n'
            printf -- '- [Windows x64 installer](https://github.com/%s/releases/download/nightly/%s)\n' "$REPO" "${native_installers[0]}"
            printf -- '- [macOS Apple Silicon .dmg](https://github.com/%s/releases/download/nightly/%s) (run `xattr -cr /Applications/Workspacer.app` once after copying)\n' "$REPO" "${native_dmgs[0]}"
            printf -- '- [macOS Intel .dmg](https://github.com/%s/releases/download/nightly/%s) (same `xattr` step)\n' "$REPO" "${native_dmgs_x64[0]}"
            printf -- '- [Linux x64 archive](https://github.com/%s/releases/download/nightly/%s) (unpack, then `./install.sh`)\n' "$REPO" "${native_linux[0]}"
            printf -- '- [Linux arm64 archive](https://github.com/%s/releases/download/nightly/%s) (unpack, then `./install.sh`)\n\n' "$REPO" "${native_linux_arm64[0]}"
            printf 'Each download has a `.sha256` beside it.\n\n'
            printf -- '---\n\n'
            printf '## Unreleased — what has landed since the last stable release\n\n'
            node "$GITHUB_WORKSPACE/scripts/changelog-section.mjs" Unreleased \
              || printf '_Nothing recorded in CHANGELOG.md yet._\n'
          } > "$notes_file"
          shopt -s nullglob
          # latest*.yml: the Electron nightly feed bridge, when the step above wrote it.
          assets=( *.exe *.dmg *.sha256 workspacer-server-* workspacer-claudemon-* workspacer-[0-9]*-linux-*.tar.gz latest*.yml )
          shopt -u nullglob
          gh release create nightly \
            --repo "$REPO" \
            --title Nightly \
            --prerelease \
            --draft \
            --target "${{ github.sha }}" \
            --notes-file "$notes_file" \
            "${assets[@]}"
          draft_id=$(gh api "repos/$REPO/releases" --paginate \
                       -q '[.[] | select(.draft and .tag_name=="nightly")][0].id')

          live_id=$(gh api "repos/$REPO/releases" --paginate \
                      -q '[.[] | select((.draft | not) and .tag_name=="nightly")][0].id')
          if [ -n "$live_id" ] && [ "$live_id" != "null" ]; then
            gh api -X DELETE "repos/$REPO/releases/$live_id"
          fi
          # The tag can outlive the release (UI deletion, partial cleanup);
          # publishing over a stale tag would pin the release to the wrong
          # commit, so assert it's really gone. Ref deletion is eventually
          # consistent, though — an immediate re-read can still see the ref we
          # just deleted. A single-shot check therefore false-aborts on a
          # propagation lag, and by this point the old release is ALREADY
          # retired, so aborting leaves NO live nightly. Poll instead: re-issue
          # the delete (harmless once gone) and wait for the ref to actually
          # disappear before giving up.
          gone=false
          for attempt in 1 2 3 4 5 6; do
            gh api -X DELETE "repos/$REPO/git/refs/tags/nightly" 2>/dev/null || true
            if ! gh api "repos/$REPO/git/ref/tags/nightly" >/dev/null 2>&1; then
              gone=true
              break
            fi
            echo "nightly tag still present (attempt $attempt/6) — waiting for deletion to propagate…"
            sleep 5
          done
          if [ "$gone" != "true" ]; then
            echo "nightly tag still exists after retries — aborting before publishing a mistargeted release"
            exit 1
          fi

          python3 "$GITHUB_WORKSPACE/scripts/finalize-nightly.py" \
            --repo "$REPO" --release-id "$draft_id" --sha "${{ github.sha }}" \
            "${assets[@]}"
