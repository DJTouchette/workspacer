name: workspace-handoff
on:
  push:
    branches: [wks/workspacer-automate-git-and-report-hando]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-handoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-hub:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - name: macOS test prerequisites and canonical temporary root
        if: runner.os == 'macOS'
        run: |
          brew install ripgrep
          mkdir -p "$RUNNER_TEMP/handoff-tests"
          cd "$RUNNER_TEMP/handoff-tests"
          echo "TMPDIR=$(pwd -P)" >> "$GITHUB_ENV"
      - name: Windows test prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ripgrep -y --no-progress
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -Type DWord
      - name: Full portable hub suites and private Git handoff fixtures
        working-directory: services/hub
        run: go test -count=1 ./...
  desktop-and-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install hosted dependencies
        run: |
          cd apps/desktop
          npm ci --ignore-scripts
          cd src/renderer
          npm ci --ignore-scripts
      - name: Produce formatting patch
        working-directory: apps/desktop
        run: |
          git diff --name-only 10b7ebe2 HEAD -- '*.ts' '*.tsx' | sed 's#^apps/desktop/##' | xargs -r npx prettier --write
          git diff --binary > ../../handoff-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-format
          path: handoff-format.patch
      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Full desktop regression suites
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: npm test
      - name: Full hub regression suites
        if: ${{ !cancelled() }}
        working-directory: services/hub
        run: go test -race -count=1 ./...
      - name: Real MCP and paired workspace fixtures
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: npm run test:dispatch-chain
