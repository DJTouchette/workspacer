name: workspace-handoff
on:
  push:
    branches: [wks/workspacer-automate-git-and-report-hando]
  workflow_dispatch:
    inputs:
      format_only:
        description: Produce the formatting patch without duplicating active test runs
        type: boolean
        default: false
      integration_only:
        description: Run the real MCP paired fixture without repeating full regression suites
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-custody:
    if: ${{ !inputs.format_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - name: Native handoff custody and filesystem fixtures
        working-directory: services/hub
        run: go test -count=1 ./internal/taskartifacts ./cmd/brain -run 'Test(Handoff|TaskHandoff|Windows|Chunk|Portable|Manifest|Checkpoint)'
  desktop-and-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install hosted dependencies
        run: |
          cd apps/desktop
          npm ci --ignore-scripts
          cd src/renderer
          npm ci --ignore-scripts
      - name: Produce formatting patch
        working-directory: apps/desktop
        run: |
          git diff --name-only 10b7ebe2 HEAD -- '*.ts' '*.tsx' | sed 's#^apps/desktop/##' | xargs -r npx prettier --write
          git diff --binary > ../../handoff-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-format
          path: handoff-format.patch
      - name: Typecheck
        if: ${{ !inputs.format_only }}
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Full desktop regression suites
        if: ${{ !cancelled() && !inputs.format_only && !inputs.integration_only }}
        working-directory: apps/desktop
        run: npm test
      - name: Full hub regression suites
        if: ${{ !cancelled() && !inputs.format_only && !inputs.integration_only }}
        working-directory: services/hub
        run: go test -race -count=1 ./...
      - name: Real MCP and paired workspace fixtures
        if: ${{ !cancelled() && !inputs.format_only }}
        working-directory: apps/desktop
        run: npm run test:dispatch-chain
