name: Rust backend and native preview

# Diagnostic branch only: macOS local_spawn RCA; do not merge workflow changes.
# Validation artifacts only. This workflow never updates a release, tag,
# Electron feed or rolling nightly. Node is build tooling, not runtime payload.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust-native-preview.yml'
      - 'apps/native/**'
      - 'services/hub-rs/**'
      - 'services/claudemon/**'
      - 'vendor/portable-pty/**'
      - 'contracts/**'
      - 'tools/windows-contract-check/**'
      - 'tools/macos-contract-check/**'
  pull_request:
    paths:
      - '.github/workflows/rust-native-preview.yml'
      - 'apps/native/**'
      - 'services/hub-rs/**'
      - 'services/claudemon/**'
      - 'vendor/portable-pty/**'
      - 'contracts/**'
      - 'tools/windows-contract-check/**'
      - 'tools/macos-contract-check/**'

permissions:
  contents: read

# Only the newest automatic preview for a ref needs an installer. Explicit
# manual validations keep a unique group so pushes cannot cancel their receipt.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  rust-service:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/hub-rs
          key: rust-service-preview
      - name: Install search engine (macOS)
        run: command -v rg || brew install ripgrep
      - name: Diagnostic local_spawn attempt 1
        run: cargo test --locked --manifest-path services/hub-rs/Cargo.toml --test local_spawn -- --nocapture
      - name: Diagnostic local_spawn attempt 2
        run: cargo test --locked --manifest-path services/hub-rs/Cargo.toml --test local_spawn -- --nocapture
      - name: Diagnostic local_spawn attempt 3
        run: cargo test --locked --manifest-path services/hub-rs/Cargo.toml --test local_spawn -- --nocapture
