name: ci

# Test + typecheck/lint on every PR and every push to main. Complements
# release.yml (which only smoke-BUILDS the installers). Toolchain setup/versions
# here mirror release.yml exactly (Node 22, Rust stable, the two
# `npm ci`s, and the same caches).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref cancels the older in-progress run on PRs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-check-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release runner regressions (fake systemd, no services or builds)
        run: python3 -B -m unittest discover -s scripts -p 'test_release_check.py' -v
      - name: Migration review evidence regressions
        run: python3 -B -m unittest discover -s scripts -p 'test_hub_migration.py' -v

  # ---------------------------------------------------------------------------
  # Repo-root guard: unresolved git conflict markers. Every other job in this
  # file is directory-scoped (working-directory: apps/desktop, services/*) —
  # landing/docs.html shipped conflict markers to master in 31fde022 because
  # landing/ sits inside no job's blast radius. This job has no
  # working-directory override and no toolchain setup, so it stays cheap and
  # actually covers the whole tree via `git grep` (tracked files only, skips
  # node_modules for free).
  #
  # Pattern is just the two start/end markers, not the `=======` separator:
  # a bare line of seven equals signs is also valid setext-heading underline
  # and legitimate table/ASCII-art separator syntax, so it's not unambiguous
  # the way `<<<<<<< ` and `>>>>>>> ` are (git always emits a ref/branch name
  # after them). Repo currently has zero legitimate `^=======$` lines, but the
  # narrower pattern is the one that can't false-positive as the repo grows.
  # ---------------------------------------------------------------------------
  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No unresolved conflict markers
        run: |
          if git grep -InE '^(<<<<<<< |>>>>>>> )' -- .; then
            echo "::error::Unresolved git conflict markers found in the files listed above (see file:line)."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Desktop: TypeScript typecheck (main + renderer) and the vitest suites.
  # apps/desktop and apps/desktop/src/renderer each have their own
  # package-lock.json, so both need their own `npm ci` (same as release.yml).
  # ---------------------------------------------------------------------------
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/src/renderer/package-lock.json

      # apps/desktop's postinstall runs electron-rebuild (better-sqlite3 against
      # Electron's ABI). It needs Electron's prebuilt binaries; on a headless
      # Linux runner that's fine for the rebuild step.
      - name: Install desktop deps
        run: npm ci

      - name: Install renderer deps
        working-directory: apps/desktop/src/renderer
        run: npm ci

      # Codegen freshness. The two configDefaults.generated.ts files are
      # generated from the Go-side source of truth
      # (services/hub-rs/assets/config-defaults.json) by `gen:config-defaults`.
      # Regenerate and fail if the tree moved — this catches both "edited a
      # default / the JSON but forgot to regenerate" (value drift) and any
      # formatting divergence, in one deterministic check. The generic
      # format:check below only catches the latter, and only by accident.
      - name: Config defaults are freshly generated
        run: |
          npm run gen:config-defaults
          git diff --exit-code -- \
            src/main/services/configDefaults.generated.ts \
            src/renderer/src/hooks/configDefaults.generated.ts \
          || { echo "::error::configDefaults.generated.ts is stale — run 'npm run gen:config-defaults' and commit the result"; exit 1; }

      # The same freshness rule for the release notes: changelog.generated.ts is
      # what the app renders (a packaged build has no CHANGELOG.md to read), so a
      # commit that edits the markdown without regenerating ships stale notes.
      # changelog.test.ts also compares the two, so this is belt-and-braces for a
      # checkout nobody rebuilt.
      - name: Changelog is freshly generated
        run: |
          npm run gen:changelog
          git diff --exit-code -- src/renderer/src/lib/changelog.generated.ts \
          || { echo "::error::changelog.generated.ts is stale — run 'npm run gen:changelog' and commit the result"; exit 1; }

      # Prettier gate. `.prettierrc` pins the codebase style (singleQuote, semi,
      # printWidth 100); --check fails if any tracked TS/TSX is unformatted.
      - name: Format check
        run: npm run format:check

      # `npm run typecheck` => typecheck:main (tsc -p tsconfig.main.json
      # --noEmit; the main config emits by default, so --noEmit forces a pure
      # typecheck) + typecheck:renderer (tsc in src/renderer, whose tsconfig
      # already has noEmit:true).
      - name: Typecheck
        run: npm run typecheck

      # `npm test` => test:main (vitest run) + test:renderer (vitest run in
      # src/renderer). Both already use `run`, so vitest does not watch.
      - name: Test
        env:
          CI: 'true'
        run: npm test

      # Playwright e2e. `npm test` above is vitest only, and test:e2e used to be
      # "build everything, then run every spec", so nothing here could ride a PR
      # — mobileClient.test.ts sat red for two days for exactly that reason.
      # playwright.config.ts now splits the specs into projects by what they
      # NEED, and the three cheap ones run here:
      #
      #   app       /app (the full React renderer in a browser) against a real
      #             hub binary on an ephemeral port with a scratch state dir.
      #   mobile    the /m PWA, same shape.
      #   renderer  the chat tail-pin, on its own Vite server.
      #
      # Browser and dispatch fixtures compile the real Rust backend in an
      # isolated test-support process; no provider credentials are required.
      - name: Set up Rust for backend fixtures
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/hub-rs

      - name: MCP to desktop dispatch provenance integration
        run: npm run test:dispatch-chain

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Web + mobile client e2e (Playwright)
        run: npm run test:e2e:ci

  # ---------------------------------------------------------------------------
  # claudemon (Rust): cargo test + clippy. Same Swatinem cache as release.yml.
  # ---------------------------------------------------------------------------
  claudemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/claudemon
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build (claudemon)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/claudemon

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked --no-fail-fast

      # The tree is clippy-clean, so warnings are hard errors.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # tui (Rust): cargo fmt --check + test + clippy.
  # ---------------------------------------------------------------------------
  tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tui
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build (tui)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tui

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked --no-fail-fast

      # The tree is clippy-clean, so warnings are hard errors.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Shared Rust backend, standalone CLI, and captured compatibility fixtures.
  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/hub-rs
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/hub-rs
      - name: Install search engine
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Rust backend format check
        run: cargo fmt -- --check
      - name: Test shared backend and standalone CLI
        run: cargo test --locked --no-fail-fast

  # Exercise actual Windows filesystem/process branches, plus the same
  # TypeScript boundary corpus used by the Electron client.
  containment-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/hub-rs
            tools/windows-contract-check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Give symlink tests the required OS capability rather than skipping them.
      - name: Enable Developer Mode (unprivileged symlink creation)
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
        shell: cmd

      # Same reason as the hub job: search.project shells out to ripgrep, and the
      # guard case that proves it searches the path the guard RETURNED has to run
      # the search to see where it looked. The Windows runner has no rg either.
      - name: Install ripgrep (search.project's engine)
        shell: pwsh
        run: |
          # Pin the upstream archive: Chocolatey feed outages can report success
          # without installing rg, making the later containment test misleading.
          $rgArchive = Join-Path $env:RUNNER_TEMP 'ripgrep.zip'
          $rgRoot = Join-Path $env:RUNNER_TEMP 'ripgrep'
          Invoke-WebRequest -Uri 'https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-pc-windows-msvc.zip' -OutFile $rgArchive -MaximumRetryCount 3
          if ((Get-FileHash $rgArchive -Algorithm SHA256).Hash -ne '124510b94b6baa3380d051fdf4650eaa80a302c876d611e9dba0b2e18d87493a') {
            throw 'ripgrep archive checksum mismatch'
          }
          Expand-Archive -Path $rgArchive -DestinationPath $rgRoot
          $rgBin = Join-Path $rgRoot 'ripgrep-15.1.0-x86_64-pc-windows-msvc'
          Add-Content -Path $env:GITHUB_PATH -Value $rgBin
          & (Join-Path $rgBin 'rg.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'ripgrep is not runnable' }

      - name: Shared Rust backend tests
        working-directory: services/hub-rs
        run: cargo test --locked --no-fail-fast
      - name: Windows process and path contracts
        working-directory: tools/windows-contract-check
        run: cargo test --locked --no-fail-fast

      # --ignore-scripts skips apps/desktop's postinstall (electron-rebuild
      # against better-sqlite3), which needs an Electron download and a native
      # toolchain and is not on the path to pathConfinement.ts.
      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - name: Path confinement + guard sweeps (TypeScript)
        working-directory: apps/desktop
        run: npx vitest run src/main/lib/pathConfinement.test.ts src/main/services/contractsVocabulary.test.ts src/main/services/hubCapabilities.test.ts

      - name: Manager handoff artifact paths and byte contract
        working-directory: apps/desktop
        run: npx vitest run --no-file-parallelism src/main/services/managerReplacementArtifact.test.ts src/main/services/managerReplacementArtifact.windows.test.ts
