name: ci

# Test + typecheck/lint on every PR and every push to master. Complements
# release.yml (which only smoke-BUILDS the installers). Toolchain setup/versions
# here mirror release.yml exactly (Node 22, Go 1.25.4, Rust stable, the two
# `npm ci`s, and the same caches).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same ref cancels the older in-progress run on PRs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Repo-root guard: unresolved git conflict markers. Every other job in this
  # file is directory-scoped (working-directory: apps/desktop, services/*) —
  # landing/docs.html shipped conflict markers to master in 31fde022 because
  # landing/ sits inside no job's blast radius. This job has no
  # working-directory override and no toolchain setup, so it stays cheap and
  # actually covers the whole tree via `git grep` (tracked files only, skips
  # node_modules for free).
  #
  # Pattern is just the two start/end markers, not the `=======` separator:
  # a bare line of seven equals signs is also valid setext-heading underline
  # and legitimate table/ASCII-art separator syntax, so it's not unambiguous
  # the way `<<<<<<< ` and `>>>>>>> ` are (git always emits a ref/branch name
  # after them). Repo currently has zero legitimate `^=======$` lines, but the
  # narrower pattern is the one that can't false-positive as the repo grows.
  # ---------------------------------------------------------------------------
  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No unresolved conflict markers
        run: |
          if git grep -InE '^(<<<<<<< |>>>>>>> )' -- .; then
            echo "::error::Unresolved git conflict markers found in the files listed above (see file:line)."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Desktop: TypeScript typecheck (main + renderer) and the vitest suites.
  # apps/desktop and apps/desktop/src/renderer each have their own
  # package-lock.json, so both need their own `npm ci` (same as release.yml).
  # ---------------------------------------------------------------------------
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/src/renderer/package-lock.json

      # apps/desktop's postinstall runs electron-rebuild (better-sqlite3 against
      # Electron's ABI). It needs Electron's prebuilt binaries; on a headless
      # Linux runner that's fine for the rebuild step.
      - name: Install desktop deps
        run: npm ci

      - name: Install renderer deps
        working-directory: apps/desktop/src/renderer
        run: npm ci

      # Codegen freshness. The two configDefaults.generated.ts files are
      # generated from the Go-side source of truth
      # (services/hub/cmd/brain/config_defaults.json) by `gen:config-defaults`.
      # Regenerate and fail if the tree moved — this catches both "edited a
      # default / the JSON but forgot to regenerate" (value drift) and any
      # formatting divergence, in one deterministic check. The generic
      # format:check below only catches the latter, and only by accident.
      - name: Config defaults are freshly generated
        run: |
          npm run gen:config-defaults
          git diff --exit-code -- \
            src/main/services/configDefaults.generated.ts \
            src/renderer/src/hooks/configDefaults.generated.ts \
          || { echo "::error::configDefaults.generated.ts is stale — run 'npm run gen:config-defaults' and commit the result"; exit 1; }

      # The same freshness rule for the release notes: changelog.generated.ts is
      # what the app renders (a packaged build has no CHANGELOG.md to read), so a
      # commit that edits the markdown without regenerating ships stale notes.
      # changelog.test.ts also compares the two, so this is belt-and-braces for a
      # checkout nobody rebuilt.
      - name: Changelog is freshly generated
        run: |
          npm run gen:changelog
          git diff --exit-code -- src/renderer/src/lib/changelog.generated.ts \
          || { echo "::error::changelog.generated.ts is stale — run 'npm run gen:changelog' and commit the result"; exit 1; }

      # Prettier gate. `.prettierrc` pins the codebase style (singleQuote, semi,
      # printWidth 100); --check fails if any tracked TS/TSX is unformatted.
      - name: Format check
        run: npm run format:check

      # `npm run typecheck` => typecheck:main (tsc -p tsconfig.main.json
      # --noEmit; the main config emits by default, so --noEmit forces a pure
      # typecheck) + typecheck:renderer (tsc in src/renderer, whose tsconfig
      # already has noEmit:true).
      - name: Typecheck
        run: npm run typecheck

      # `npm test` => test:main (vitest run) + test:renderer (vitest run in
      # src/renderer). Both already use `run`, so vitest does not watch.
      - name: Test
        env:
          CI: 'true'
        run: npm test

      # Playwright e2e. `npm test` above is vitest only, and test:e2e used to be
      # "build everything, then run every spec", so nothing here could ride a PR
      # — mobileClient.test.ts sat red for two days for exactly that reason.
      # playwright.config.ts now splits the specs into projects by what they
      # NEED, and the three cheap ones run here:
      #
      #   app       /app (the full React renderer in a browser) against a real
      #             hub binary on an ephemeral port with a scratch state dir.
      #   mobile    the /m PWA, same shape.
      #   renderer  the chat tail-pin, on its own Vite server.
      #
      # All three need a Go toolchain (app + mobile build and run the real hub)
      # and Chromium. None needs claudemon, a built Electron app, or xvfb — the
      # `electron` project (libraryPane.test.ts) does, and stays opt-in.
      - name: Set up Go (the e2e fixtures build and run the real hub)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache-dependency-path: services/hub/go.sum

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Web + mobile client e2e (Playwright)
        run: npm run test:e2e:ci

  # ---------------------------------------------------------------------------
  # claudemon (Rust): cargo test + clippy. Same Swatinem cache as release.yml.
  # ---------------------------------------------------------------------------
  claudemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/claudemon
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build (claudemon)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/claudemon

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test

      # The tree is clippy-clean, so warnings are hard errors.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # tui (Rust): cargo fmt --check + test + clippy.
  # ---------------------------------------------------------------------------
  tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tui
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build (tui)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tui

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test

      # The tree is clippy-clean, so warnings are hard errors.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # hub (Go): go vet + go test. Go version pinned to match release.yml.
  # ---------------------------------------------------------------------------
  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/hub
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache-dependency-path: services/hub/go.sum

      # gofmt is not enforced by `go build`, so guard it explicitly: fail if any
      # file would be reformatted (gofmt -l prints such files; non-empty = fail).
      - name: Format check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # search.project shells out to ripgrep, and the guard test that proves it
      # searches the path the guard RETURNED (rather than re-deriving one) has to
      # actually run the search to see where it looked. Without rg on PATH that
      # case fails on the runner while passing on every developer machine that
      # has ripgrep installed — which is what happened: it was invisible for as
      # long as this job stopped at the format check. Installing it is the fix;
      # skipping the case when rg is absent would leave a containment test
      # silently not running, which is the one thing this suite exists to stop.
      - name: Install ripgrep (search.project's engine)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # -race -count=1 matches the Makefile's `make test-hub` target, and the
      # -count=1 is load-bearing HERE in particular: actions/setup-go restores
      # ~/.cache/go-build, which is where the test result cache lives, so a run
      # on a tree whose cross-repo inputs changed can otherwise be served from a
      # previous run's results. cmd/go drops out-of-module inputs from the test
      # cache key, and every TS<->Go drift guard in this suite reads one
      # (apps/desktop/src/main/services/hubCapabilities.ts, contracts/*.json,
      # this file). internal/extinput makes those inputs visible again; this
      # flag is the belt that does not depend on cmd/go internals staying put.
      # The whole module runs uncached in ~7s.
      - name: Test
        run: go test -race -count=1 ./...

  # ---------------------------------------------------------------------------
  # WINDOWS. Every job above is ubuntu-latest, and only release.yml touches
  # windows-latest — where it BUILDS and signs an installer rather than running
  # a test. So every Windows-only branch of the three path-containment copies
  # was dead code at test time, on every machine anyone runs:
  #
  #   pathConfinement.ts splitAbsolute  — a hand-written drive/UNC regex pair
  #   fsguard.go         splitPath      — filepath.VolumeName + the drive-relative reject
  #   bus/policy.go      splitVolume    — a hand-rolled UNC/drive scanner
  #
  # Three different volume parsers, and the fixture spends much of its header and
  # its whole case-flag vocabulary (posixOnly, needsSymlinks "Windows without
  # developer mode", needsUnreadableDir) on their semantics. All three could be
  # broken so that a DRIVE-RELATIVE path ("C:foo", which resolves against
  # whatever directory the process is on ON DRIVE C) is accepted as absolute —
  # the exact check-path/opened-path split BINDING DECISION 2 exists to close —
  # with both full suites completely green on Linux.
  #
  # This leg runs the two suites that own those branches. It is deliberately not
  # a full matrix: the Rust crates and the Electron rebuild are a different
  # (much slower) problem, and nothing about them is what went untested.
  # contracts_test.go's TestCorpusRunsOnWindowsInCI asserts this job keeps
  # existing and keeps running both, so deleting it fails the Go suite.
  # ---------------------------------------------------------------------------
  containment-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache-dependency-path: services/hub/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The containment corpus and its loaders are plain Go — no cgo, no
      # sidecars — so the hub suite runs as-is. -count=1 for the same reason as
      # the linux `hub` job: the cached go-build directory plus a cache key that
      # ignores out-of-module inputs is how a cross-repo guard reports green on
      # a tree it never read.
      # internal/bus's symlink-gated tests are the ONLY oracle for what they
      # cover, and sweepguard.Gate deliberately makes a host that cannot run them
      # RED rather than green-with-a-skip-count. An unelevated process on Windows
      # cannot create a symlink unless Developer Mode is on, so turn it on —
      # same call as installing ripgrep below: give the runner the capability the
      # test needs instead of teaching the test to skip.
      - name: Enable Developer Mode (unprivileged symlink creation)
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
        shell: cmd

      # Same reason as the hub job: search.project shells out to ripgrep, and the
      # guard case that proves it searches the path the guard RETURNED has to run
      # the search to see where it looked. The Windows runner has no rg either.
      - name: Install ripgrep (search.project's engine)
        run: choco install ripgrep -y --no-progress

      - name: hub (Go) test
        working-directory: services/hub
        run: go test -count=1 ./...

      # --ignore-scripts skips apps/desktop's postinstall (electron-rebuild
      # against better-sqlite3), which needs an Electron download and a native
      # toolchain and is not on the path to pathConfinement.ts.
      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - name: Path confinement + guard sweeps (TypeScript)
        working-directory: apps/desktop
        run: npx vitest run src/main/lib/pathConfinement.test.ts src/main/services/hubCapabilitiesGuards.test.ts src/main/services/hubCapabilitiesKillSwitch.test.ts
