name: manager-request-inbox
on:
  push:
    branches: [wks/workspacer-request-toast-and-pasted-pr-c]
  workflow_dispatch:
concurrency:
  group: manager-request-inbox
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  feature:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - name: Install fixture search dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Private dependency installations
        run: |
          cd apps/desktop
          npm ci --ignore-scripts
          cd src/renderer
          npm ci --ignore-scripts
      - name: Produce formatter patch for OOM-constrained author
        working-directory: apps/desktop
        run: |
          git diff --name-only 3a16f4bb HEAD -- '*.ts' '*.tsx' | sed 's#^apps/desktop/##' | xargs -r npx prettier --write
          cd ../..
          gofmt -w services/hub/cmd/mcp/manager_requests*.go
          git diff --binary > manager-request-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: request-format
          path: manager-request-format.patch
      - name: Typecheck desktop and renderer
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Main request, delivery, ownership and workflow regressions
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: npx vitest run --no-file-parallelism src/main/services/managerRequestService.test.ts src/main/services/managerRequestTransport.test.ts src/main/services/dispatchHistoryStore.test.ts src/main/services/fleetWorkflowService.test.ts src/main/services/fleetWorkflowRuntime.test.ts src/main/services/managerReplacementService.test.ts src/main/services/managerReplacementMessage.test.ts src/main/services/managerReplacement.integration.test.ts src/main/services/managerTaskReferencesService.test.ts src/main/services/hubCapabilities.test.ts src/main/ipc.test.ts src/main/preload.test.ts
      - name: Renderer capture, Inspector and chat regressions
        if: ${{ !cancelled() }}
        working-directory: apps/desktop/src/renderer
        run: npx vitest run tests/components/TaskInspector.test.tsx tests/components/ClaudePane.test.tsx tests/components/ClaudePaneAttachmentRestore.test.tsx tests/components/ClaudePaneOptimisticLoading.test.tsx tests/fleetManager.test.tsx tests/firstUseSpawn.test.tsx tests/reconcileRespawn.test.tsx tests/backend/backendParity.test.ts
      - name: Full desktop main suite
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: npx vitest run --no-file-parallelism
      - name: Full renderer suite
        if: ${{ !cancelled() }}
        working-directory: apps/desktop/src/renderer
        run: npx vitest run --no-file-parallelism
      - name: MCP tool and headless compatibility tests
        if: ${{ !cancelled() }}
        working-directory: services/hub
        run: go test ./cmd/mcp ./cmd/brain
      - name: Real authenticated MCP to desktop integration
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: npm run test:dispatch-chain
      - name: Install hosted browser
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium
      - name: Scoped real-browser integration regressions
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: npx playwright test --project=renderer --workers=1 firstUse.test.ts fleetContextMenu.test.ts managerHandoff.test.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-evidence
          path: apps/desktop/test-results
      - name: Exact committed formatting
        if: ${{ !cancelled() }}
        run: git diff --exit-code
