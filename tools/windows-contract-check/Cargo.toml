[package]
name = "workspacer-windows-contract-check"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
junction = "=2.0.0"
anyhow = "1"
tempfile = "3"
tokio = {version="1",features=["time","process","io-util","macros","rt"]}
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Memory"] }

serde_json = "1"
portable-pty = "0.8"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
regex = "1"
uuid = {version="1",features=["v4"]}

[profile.dev]
debug = 0
incremental = false
