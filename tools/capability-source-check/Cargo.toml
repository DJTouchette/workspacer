[package]
name = "workspacer-capability-source-check"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
debug = 0
incremental = false
