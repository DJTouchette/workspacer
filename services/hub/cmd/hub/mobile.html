  }

  let spawnPrompts = [];
  async function loadSpawnExtras() {
    if (can('providers.checkAll')) {
      try { providerProbe = await call('providers.checkAll', {}); } catch { providerProbe = null; }
    }
    if (can('library.list')) {
      try {
        const list = await call('library.list', {});
        spawnPrompts = (list || []).filter((i) => !i.kind || i.kind === 'prompt').slice(0, 8);
      } catch { spawnPrompts = []; }
    }
    if (S.screen === 'new') render();
  }

  async function doSpawn() {
    const cwd = (S.spawn.cwd || '').trim();
    if (!cwd) { toast('Pick a working directory'); return; }
    const btn = $('spawnGo'); btn.disabled = true; btn.textContent = 'Spawning…';
    const opts = { cwd, provider: S.spawn.provider, transport: 'stream' };
    if (S.spawn.permissionMode) opts.permissionMode = S.spawn.permissionMode;
    try {
      const r = await call('agents.spawn', opts);
      const id = r && r.sessionId;
      toast('Spawned');
      // Send the chosen library prompt as the session's first message, once the
      // daemon has a session to accept it.
      const first = spawnPrompts.find((p) => p.id === S.spawn.prompt);
      S.spawn.prompt = '';
      await seed();
      if (id && sessions.get(id)) {
        openChat(id);
        if (first) {
          try { await call('agents.sendMessage', { sessionId: id, text: first.body || first.title }); }
          catch (e) { toast('Prompt not sent: ' + errText(e)); }
        }
      } else go('fleet');
    } catch (e) {
      toast('Spawn failed: ' + errText(e));
      btn.disabled = false; btn.textContent = 'Spawn agent';
    }
  }

  async function resume(sessionId) {
    if (sessions.get(sessionId)) { openChat(sessionId); return; }
    const r = (recents || []).find((x) => x.sessionId === sessionId);
    if (!r) return;
    if (!can('agents.spawn')) { toast('Resuming needs an operator token'); return; }
    toast('Resuming…');
    try {
      const out = await call('agents.spawn', {
        cwd: r.cwd, provider: r.provider || 'claude', transport: 'stream', resumeSessionId: sessionId,
      });
      await seed();
      const id = (out && out.sessionId) || sessionId;
      if (sessions.get(id)) openChat(id); else go('fleet');
    } catch (e) { toast('Resume failed: ' + errText(e)); }
  }

  // ══ actions ═══════════════════════════════════════════════════════════════
  function approve(id, decision) {
    if (hubGone(id)) { toast('Hub offline'); return; }
    call(qualify(id, 'claude.approve'), { sessionId: id, decision })
      .then(() => toast(decision === 'no' ? 'Denied' : decision === 'always' ? 'Always allowed' : 'Approved'))
      .catch((e) => toast('Failed: ' + errText(e)));
  }
  function submitAnswers(id) {
    if (hubGone(id)) { toast('Hub offline'); return; }
    const s = sessions.get(id);
    const questions = (s && s.pendingQuestions) || [];
    const answers = [];
    for (let qi = 0; qi < questions.length; qi++) {
      const pick = S.picks.get(pickKey(id, qi));
      if (!pick) { toast('Pick an option for every question'); return; }
      answers.push(String(pick));   // the daemon maps 1-indexed picks → labels
    }
    if (!answers.length) return;
    // Capture the question set + anchor now: the snapshot may clear
    // pendingQuestions before the call resolves.
    const anchorLen = s ? convTurns(s).length : 0;
    call(qualify(id, 'claude.answer'), { sessionId: id, answers })
      .then(() => {
        recordResolved(id, false, describeAnswers(questions, answers), questions, anchorLen);
        for (let qi = 0; qi < questions.length; qi++) S.picks.delete(pickKey(id, qi));
        toast('Answered');
        afterData();
      })
      .catch((e) => toast('Failed: ' + errText(e)));
  }
  function declineQuestion(id) {
    if (hubGone(id)) { toast('Hub offline'); return; }
    const s = sessions.get(id);
    const questions = (s && s.pendingQuestions) || [];
    const anchorLen = s ? convTurns(s).length : 0;
    recordResolved(id, true, null, questions, anchorLen);
    call(qualify(id, 'claude.signal'), { sessionId: id, signal: 'SIGINT' })
      .then(() => toast('Declined')).catch((e) => toast('Failed: ' + errText(e)));
    afterData();
  }
  function interrupt(id) {
    if (hubGone(id)) { toast('Hub offline'); return; }
    call(qualify(id, 'claude.signal'), { sessionId: id, signal: 'SIGINT' })
      .then(() => toast('Interrupted')).catch((e) => toast('Failed: ' + errText(e)));
  }
  function setPermissionMode(id, mode) {
    call(qualify(id, 'claude.setPermissionMode'), { sessionId: id, mode })
      .then((r) => toast(r && r.ok === false ? (r.error || 'Could not switch mode') : 'Mode: ' + mode))
      .catch((e) => toast('Failed: ' + noteSwitchFailure(e)));
  }
  function setModel(id, model, effort) {
    const params = { sessionId: id };
    if (model) params.model = model;
    if (effort) params.effort = effort;
    call(qualify(id, 'claude.setModel'), params)
      .then((r) => toast(r && r.ok === false ? (r.error || 'Could not switch') : (model ? 'Model: ' + shortModel(model) : 'Effort: ' + effort)))
      .catch((e) => toast('Failed: ' + noteSwitchFailure(e)));
  }

  function recordResolved(id, declined, answers, questions, anchorLen) {
    if (!questions || !questions.length) return;
    const sig = questions.map((q) => q.question).join('\u0000');
    const list = resolvedQs.get(id) || [];
    if (list.some((r) => r.sig === sig && r.anchorLen === anchorLen)) return;
    list.push({ sig, anchorLen, questions, answers, declined });
    resolvedQs.set(id, list);
  }
  function describeAnswers(questions, raw) {
    return (raw || []).map((a, i) => {
      const n = Number(a), q = questions[i];
      if (Number.isInteger(n) && String(n) === a && q && q.options && q.options[n - 1]) return q.options[n - 1].label;
      return a;
    });
  }

  // ══ image attachments ═══════════════════════════════════════════════════
  // The phone's photo becomes a file on the machine RUNNING the agent: bytes go
  // up as base64 over the bus (files.upload — hub-local, so `hub:<peer>/`
  // qualification lands them on a federated peer's disk too), and the message
  // carries only the returned path as a `[Image: /path]` prefix — the exact
  // model the desktop composer uses (fileAttachment.ts buildPromptPrefix).
  const UPLOAD_MAX_EDGE = 2048;    // photos re-encode to JPEG under this edge
  const PASSTHRU_BYTES = 2 * 1024 * 1024; // small png/jpeg upload untouched
  let attachSeq = 0;

  function renderAttach() {
    attachEl.innerHTML = S.attach.map((a) => `
      <span class="att${a.uploading ? ' up' : ''}">
        ${a.thumb ? `<img src="${a.thumb}" alt="">` : ''}
        <span class="nm">${esc(a.uploading ? 'uploading…' : a.name)}</span>
        <button class="x" data-att="${a.id}" aria-label="Remove attachment">✕</button>
      </span>`).join('');
    for (const b of attachEl.querySelectorAll('[data-att]')) {
      b.onclick = () => { S.attach = S.attach.filter((a) => a.id !== b.dataset.att); renderAttach(); };
    }
  }

  /** Decode via <img> (Safari decodes iPhone HEIC), bound the long edge, and
   *  re-encode as JPEG. Small PNG/JPEG files pass through untouched so
   *  screenshots keep their crisp text. Returns {name, dataUrl, thumb}. */
  function normalizeImage(file) {
    return new Promise((resolve, reject) => {
      const passthru = (file.type === 'image/png' || file.type === 'image/jpeg') && file.size <= PASSTHRU_BYTES;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const draw = (edge, type, q) => {
          const k = Math.min(1, edge / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.naturalWidth * k));
          c.height = Math.max(1, Math.round(img.naturalHeight * k));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          return c.toDataURL(type, q);
        };
        const thumb = draw(44, 'image/jpeg', 0.7);
        if (passthru) {
          const r = new FileReader();
          r.onload = () => { URL.revokeObjectURL(url); resolve({ name: file.name, dataUrl: r.result, thumb }); };
          r.onerror = () => { URL.revokeObjectURL(url); reject(new Error('read failed')); };
          r.readAsDataURL(file);
          return;
        }
        const dataUrl = draw(UPLOAD_MAX_EDGE, 'image/jpeg', 0.85);
        URL.revokeObjectURL(url);
        const base = (file.name || 'photo').replace(/\.[^.]*$/, '') || 'photo';
        resolve({ name: base + '.jpg', dataUrl, thumb });
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("couldn't decode " + (file.name || 'image'))); };
      img.src = url;
    });
  }

  async function attachFiles(files) {
    for (const file of files) {
      if (!file || !/^image\//.test(file.type || '')) continue;
      const id = 'a' + (++attachSeq);
      const entry = { id, name: file.name || 'photo', path: '', thumb: '', uploading: true };
      S.attach.push(entry); renderAttach();
      try {
        const { name, dataUrl, thumb } = await normalizeImage(file);
        entry.thumb = thumb; renderAttach();
        const b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
        const res = await call(qualify(S.sessionId, 'files.upload'), { name, dataBase64: b64 }, 90000);
        if (!res || !res.path) throw new Error('no path returned');
        entry.path = res.path; entry.name = name; entry.uploading = false;
        if (S.attach.includes(entry)) renderAttach();   // may have been removed mid-upload
      } catch (e) {
        S.attach = S.attach.filter((a) => a.id !== id); renderAttach();
        toast('Attach failed: ' + errText(e));
      }
    }
  }

  function sendMessage() {
    if (S.screen !== 'chat') return;
    const typed = (msgEl.value || '').trim();
    if (S.attach.some((a) => a.uploading)) { toast('Still uploading…'); return; }
    const ready = S.attach.filter((a) => a.path);
    // Desktop parity: attachments ride as [Image: /abs/path] prefixes and the
    // agent opens the files itself. An image with no words is a valid message.
    const prefix = ready.map((a) => `[Image: ${a.path}]`).join(' ');
    const text = prefix ? prefix + (typed ? ' ' + typed : '') : typed;
    if (!text) return;
    if (hubGone(S.sessionId)) { toast('Hub offline'); return; }
    sendBtn.disabled = true;
    call(qualify(S.sessionId, 'agents.sendMessage'), { sessionId: S.sessionId, text })
      .then(() => { msgEl.value = ''; S.attach = []; renderAttach(); autosize(); })
      .catch((e) => toast('Send failed: ' + errText(e)))
      .finally(() => { sendBtn.disabled = false; });
  }
  function autosize() { msgEl.style.height = 'auto'; msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + 'px'; }

  // ══ sheet ═════════════════════════════════════════════════════════════════
  // Bumped every time the sheet is opened or dismissed, so an async loader
  // (openChipSheet awaits an RPC before showing its rows) can tell whether the
  // sheet it was filling is still the one on screen — otherwise dismissing
  // mid-flight, which is the norm over a slow tailnet, pops it back open.
  let sheetGen = 0;
  function showSheet(title, rows) {
    sheetGen++;
    sheet.innerHTML = `<div class="grip"></div><div class="st">${esc(title)}</div><div class="rows">${
      rows.map((r, i) => `<button class="opt${r.on ? ' on' : ''}" data-row="${i}"${r.disabled ? ' disabled style="opacity:.65"' : ''}>
        <span class="l">${esc(r.label)}</span></button>`).join('')}</div>`;
    for (const b of sheet.querySelectorAll('[data-row]')) {
      const r = rows[Number(b.dataset.row)];
      if (r.disabled) continue;
      b.onclick = () => { hideSheet(); if (r.run) r.run(); };
    }
    sheet.classList.add('show'); scrim.classList.add('show');
  }
  function hideSheet() { sheetGen++; sheet.classList.remove('show'); scrim.classList.remove('show'); }

  // ══ misc ══════════════════════════════════════════════════════════════════
  function emptyHtml(ic, color, big, small) {
    return `<div class="empty"><span class="ic" style="border:1.5px solid ${color};color:${color}">${ic}</span>
      <div class="big">${esc(big)}</div><div class="small">${esc(small)}</div></div>`;
  }
  function renderGate() {
    filtersEl.hidden = true; segmentsEl.hidden = true; composer.classList.remove('show');
    hdr.classList.remove('has-back');
    titleEl.textContent = 'Workspacer'; titleMetaEl.textContent = ''; subEl.textContent = '';
    main.innerHTML = `<div class="body"><div class="gate">
      <h2>Connect</h2>
      <p>Paste your workspacer remote token.</p>
      <input id="tok" placeholder="token" autocomplete="off" />
      <button id="tokGo">Connect</button>
    </div></div>`;
    $('tokGo').onclick = () => {
      const v = ($('tok').value || '').trim();
      if (!v) return;
      token = v; localStorage.setItem('hubToken', v); connect();
    };
    $('tok').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('tokGo').click(); });
  }

  // ══ Web Push ══════════════════════════════════════════════════════════════
  // A PWA can't hold a socket open in the background, so we register for Web
  // Push: the hub sends one when an agent is blocked, the service worker wakes
  // to show a lock-screen notification, and tapping it deep-links here.
  const pushOk = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  let swReg = null;
  function urlB64ToUint8(b64) {
    const pad = '='.repeat((4 - (b64.length % 4)) % 4);
    const s = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(s), arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }
  async function registerSW() {
    if (!pushOk) return null;
    if (swReg) return swReg;
    try { swReg = await navigator.serviceWorker.register('/sw.js'); return swReg; } catch { return null; }
  }
  // ── notification settings ────────────────────────────────────────────────
  // The DEVICE owns these; the hub only stores them to filter delivery. They
  // ride on push.subscribe, which the client already sends on every connect —
  // no second bus method to add, classify and keep in sync. Absent fields mean
  // "default", so a hub or client that predates a kind keeps notifying rather
  // than silently going quiet.
  const PUSH_PREF_KEY = 'pushPrefs';
  const FINISHED_CHOICES = [
    { sec: 0, label: 'Any length' },
    { sec: 60, label: 'Over 1 min' },
    { sec: 300, label: 'Over 5 min' },
    { sec: 900, label: 'Over 15 min' },
  ];
  function loadPushPrefs() {
    try { return JSON.parse(localStorage.getItem(PUSH_PREF_KEY)) || {}; } catch { return {}; }
  }
  let pushPrefs = loadPushPrefs();
  function savePushPrefs(next) {
    pushPrefs = next;
    try { localStorage.setItem(PUSH_PREF_KEY, JSON.stringify(next)); } catch {}
    // Re-send immediately so a toggle takes effect now rather than on the next
    // reconnect — the whole point is turning off a notification that is
    // annoying you at this moment.
    if (Notification.permission === 'granted') ensurePush(true);
  }
  const prefOn = (k) => pushPrefs[k] !== false;
  // Checkpoints are the one kind that defaults OFF (see the hub's Prefs.wants):
  // absent must read as off here too, or the client would show a switch that
  // disagrees with what the hub actually does.
  const checkpointsOn = () => pushPrefs.checkpoints === true;
  const finishedAfter = () =>
    typeof pushPrefs.finishedAfterSec === 'number' ? pushPrefs.finishedAfterSec : 60;

  function openNotifySheet() {
    if (!pushOk) {
      showSheet('NOTIFICATIONS', [{ label: 'Add to Home Screen first', disabled: true }]);
      return;
    }
    const check = (on) => (on ? '✓ ' : '   ');
    const after = FINISHED_CHOICES.find((c) => c.sec === finishedAfter()) || FINISHED_CHOICES[1];
    const rows = [
      {
        label: 'Send me a test notification',
        run: async () => {
          try {
            const r = (await call('push.test', {})) || {};
            const d = r.delivered || 0, gone = r.gone || 0, failed = r.failed || 0;
            // Report what HAPPENED. "Sent to 4 devices" was the count of stored
            // rows, printed before a single delivery had completed — four dead
            // endpoints read as success.
            if (!r.devices) toast('No devices subscribed yet');
            else if (d) toast(`Delivered to ${d}${gone ? ` · ${gone} stale removed` : ''}${failed ? ` · ${failed} failed` : ''}`);
            else if (gone) toast(`All ${gone} subscriptions were stale — removed. Re-enable notifications.`);
            else toast(`Push service refused all ${failed} — see the hub log`);
          } catch (e) { toast('Test failed: ' + errText(e)); }
        },
      },
      {
        label: check(prefOn('needs')) + 'An agent needs you',
        run: () => { savePushPrefs({ ...pushPrefs, needs: !prefOn('needs') }); openNotifySheet(); },
      },
      {
        label: check(prefOn('finished')) + 'A run finishes',
        run: () => { savePushPrefs({ ...pushPrefs, finished: !prefOn('finished') }); openNotifySheet(); },
      },
      {
        label: '     …only when it ran: ' + after.label,
        disabled: !prefOn('finished'),
        run: () => {
          const i = FINISHED_CHOICES.findIndex((c) => c.sec === after.sec);
          const next = FINISHED_CHOICES[(i + 1) % FINISHED_CHOICES.length];
          savePushPrefs({ ...pushPrefs, finishedAfterSec: next.sec });
          openNotifySheet();
        },
      },
      {
        label: check(prefOn('preview')) + 'Show message contents',
        run: () => { savePushPrefs({ ...pushPrefs, preview: !prefOn('preview') }); openNotifySheet(); },
      },
      {
        label: check(checkpointsOn()) + 'Ping while still running (10m, 30m)',
        run: () => { savePushPrefs({ ...pushPrefs, checkpoints: !checkpointsOn() }); openNotifySheet(); },
      },
      {
        label: check(prefOn('ended')) + 'A session ends',
        run: () => { savePushPrefs({ ...pushPrefs, ended: !prefOn('ended') }); openNotifySheet(); },
      },
    ];
    if (Notification.permission !== 'granted') {
      rows.unshift({ label: 'Enable notifications first', run: () => ensurePush(false) });
    }
    showSheet('NOTIFICATIONS', rows);
  }

  async function ensurePush(silent) {
    if (!pushOk) { if (!silent) toast('Push not supported here'); return; }
    if (Notification.permission === 'denied') { if (!silent) toast('Notifications are blocked in settings'); return; }
    if (Notification.permission !== 'granted') {
      if (silent) return;
      if ((await Notification.requestPermission()) !== 'granted') { render(); return; }
    }
    const reg = await registerSW(); if (!reg) return;
    try {
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        const r = await call('push.key', {});
        if (!r || !r.publicKey) return;
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(r.publicKey) });
      }
      // Prefs ride along: same call, no extra bus surface. The hub treats
      // absent fields as defaults, so an older hub simply ignores them.
      await call('push.subscribe', Object.assign(sub.toJSON(), {
        prefs: {
          needs: prefOn('needs'),
          finished: prefOn('finished'),
          ended: prefOn('ended'),
          finishedAfterSec: finishedAfter(),
          preview: prefOn('preview'),
          checkpoints: checkpointsOn(),
        },
      }));
      if (!silent) toast('Notifications on');
      render();
    } catch (e) { if (!silent) toast("Couldn't enable: " + errText(e)); }
  }

  // ══ connection ════════════════════════════════════════════════════════════
  function killSocket(sock) {
    if (!sock) return;
    try { sock.onopen = sock.onmessage = sock.onerror = sock.onclose = null; sock.close(); } catch {}
  }
  function connect() {
    if (!token) { connected = false; renderChrome(); render(); return; }
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    clearTimeout(watchdog);
    connected = false; renderChrome();
    let sock;
    try { sock = new WebSocket(wsURL()); } catch { return scheduleReconnect(); }
    ws = sock;
    // Phones routinely hand us a socket whose handshake hangs — the host or the
    // tailnet link was asleep, so it neither opens nor errors and the OS won't
    // give up for 30–75s. Abandon it early and retry.
    //
    // But the budget has to GROW. It used to be a flat 4.5s on every attempt,
    // with the retry backoff capped at 5s — so a cold path was killed at 4.5s,
    // forever, and could only connect if it happened to come up inside that
    // window. That is the same wake the comment above describes taking 30–75s:
    // the client was aborting the very case it was written for, over and over,
    // and only recovered because the repeated attempts eventually warmed the
    // route. Stay impatient for the first couple (a real blip reconnects in
    // milliseconds), then give a genuinely cold tailnet leg room to finish.
    const budget = HANDSHAKE_BUDGETS_MS[Math.min(attempt, HANDSHAKE_BUDGETS_MS.length - 1)];
    attempt++;
    watchdog = setTimeout(() => {
      if (sock.readyState !== WebSocket.OPEN) { killSocket(sock); if (ws === sock) ws = null; scheduleReconnect(); }
    }, budget);
    sock.onopen = () => {
      clearTimeout(watchdog);
      backoff = 500; attempt = 0; lastActivity = Date.now(); connected = true;
      sock.send(JSON.stringify({ op: 'subscribe', topics: ['agent.snapshot', 'workflow.*', 'hub.peer.*'] }));
      // Everything else waits for `hello` — see onDiscover. Firing the optional
      // lookups here would run their can() guards before we know our scope,
      // when can() answers true for everything, so a view/triage token would
      // issue calls the bus is certain to deny.
      seed().then(maybeOpenPending);
      if (pushOk && Notification.permission === 'granted') ensurePush(true);
      // Reconcile every 25s so the fleet self-heals if an event was missed while
      // the socket blipped; doubles as the heartbeat wake() checks.
      clearInterval(reconcileTimer);
      reconcileTimer = setInterval(() => { if (ws && ws.readyState === WebSocket.OPEN) seed(); }, 25000);
      renderChrome(); render();
    };
    // The optional, scope-dependent lookups, run once the tier is known.
    const onDiscover = () => {
      // Config feeds the spawn screen's defaults AND every project mark, which
      // is on the screen you land on — so its arrival re-renders whatever is
      // showing, not just the spawn tab. Failure is survivable: resolveProject
      // falls back to the derived mark, so an older hub or a tier without
      // config.get costs labels and custom colours, never legibility.
      if (!cfg && can('config.get')) call('config.get', {}).then((c) => { cfg = c; render(); }).catch(() => {});
      if (can('sessions.recent')) call('sessions.recent', {}).then((r) => { recents = r || []; render(); }).catch(() => { recents = []; });
      loadSpawnExtras();
    };
    sock.onmessage = (ev) => {
      lastActivity = Date.now();
      let f; try { f = JSON.parse(ev.data); } catch { return; }
      if (f.op === 'hello') {
        scope = { name: f.scope || '', methods: Array.isArray(f.methods) ? f.methods : [] };
        switchUnsupported = false;   // a new connection may have a new provider
        onDiscover();
        renderChrome();
      } else if (f.op === 'result') { const c = calls.get(f.id); if (c) { calls.delete(f.id); c.resolve(f.result); } }
      else if (f.op === 'error' && f.id) { const c = calls.get(f.id); if (c) { calls.delete(f.id); c.reject(new Error(f.error || 'error')); } }
      else if (f.op === 'event' && f.event) {
        const t = f.event.type || '';
        // Federation: the peer's name rides the ENVELOPE — stamp it onto the
        // snapshot (and remember it) so this session renders with its hub chip
        // and every later call for it goes hub-qualified. Unstamped = local.
        const peer = f.event.hub || '';
        if (t === 'agent.snapshot' && f.event.data && f.event.data.sessionId) {
          const snap = f.event.data;
          if (peer) {
            snap.hub = peer;
            sessionHub.set(snap.sessionId, peer);
            // A stamped push can only have crossed a live link — clear a
            // tombstone the lifecycle event hasn't cleared yet.
            if (offlineHubs.delete(peer)) renderChrome();
          }
          upsert(snap);
        }
        // Peer link down → tombstone that hub's sessions (cards stay, actions
        // go); back up → clear and reseed its fleet wholesale.
        else if (t === 'hub.peer.disconnected') {
          const d = f.event.data || {};
          if (d.peer) { offlineHubs.set(d.peer, Date.parse(d.lastSeen || '') || Date.now()); afterData(); }
        }
        else if (t === 'hub.peer.connected') {
          const d = f.event.data || {};
          if (d.peer) { offlineHubs.delete(d.peer); reseedPeer(d.peer); }
        }
        // Workflow lifecycle rides its own topic on the desktop provider; the
        // snapshot catches up on the next tick, but re-rendering now keeps a
        // watched flow honest between snapshots. Peers' flow events re-render
        // the same way — their state arrives in the stamped snapshots.
        else if (t.indexOf('workflow.') === 0) afterData();
      }
    };
    sock.onclose = (ev) => {
      clearTimeout(watchdog);
      if (ws === sock) ws = null;
      connected = false; renderChrome();
      if (ev.code === 1008 || ev.code === 4401) {
        token = ''; localStorage.removeItem('hubToken');
        scope = { name: '', methods: [] };
        render(); return;
      }
      scheduleReconnect();
    };
    sock.onerror = () => { try { sock.close(); } catch {} };
  }
  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, backoff);
    backoff = Math.min(backoff * 2, 5000);
  }
  // Mobile browsers suspend a backgrounded tab's socket (often without firing
  // close), so on return we'd sit on a dead one. Reconnect on every signal that
  // we're foreground again, unless the socket is provably still live.
  function wake() {
    if (!token || document.visibilityState === 'hidden') return;
    const live = ws && ws.readyState === WebSocket.OPEN && Date.now() - lastActivity < STALE_MS;
    if (live) return;
    // Coming back to the foreground is a fresh start, not attempt N of a losing
    // streak: reset the handshake budget with the backoff.
    backoff = 500; attempt = 0; clearTimeout(watchdog);
    killSocket(ws); ws = null; connect();
  }
  document.addEventListener('visibilitychange', wake);
  window.addEventListener('online', wake);
  window.addEventListener('focus', wake);
  window.addEventListener('pageshow', wake);   // iOS Safari bfcache restore

  /** Tapping the lamp while it reads "Offline" retries NOW rather than waiting
   *  out the backoff — if the delay is the tailnet or the host waking, the
   *  person holding the phone knows before any timer does. Connected, it keeps
   *  its existing job: the pill is the inbox affordance. */
  function pillTap() {
    if (connected) return go('inbox');
    backoff = 500; attempt = 0;
    killSocket(ws); ws = null;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    toast('Reconnecting…');
    connect();
  }

  // ══ wiring ════════════════════════════════════════════════════════════════
  for (const b of nav.querySelectorAll('button')) {
    b.onclick = () => {
      const tab = b.dataset.tab;
      if (tab === 'flows' && !sessions.get(S.sessionId)) {
        // The inspector is always *some agent's* inspector; without one picked,
        // fall back to whatever is most worth watching.
        const pick = fleetList().find((s) => agentState(s) === 'working') || fleetList()[0];
        if (!pick) { toast('No agent to inspect yet'); return; }
        S.sessionId = pick.sessionId;
      }
      go(tab);
    };
  }
  backBtn.onclick = () => go(S.screen === 'flows' ? 'chat' : 'fleet');
  statusPill.onclick = pillTap;
  gearBtn.onclick = openNotifySheet;
  sendBtn.onclick = sendMessage;
  moreBtn.onclick = openMoreSheet;
  scrim.onclick = hideSheet;
  msgEl.addEventListener('input', autosize);
  msgEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  fileEl.addEventListener('change', () => {
    if (fileEl.files && fileEl.files.length) void attachFiles([...fileEl.files]);
    fileEl.value = '';   // same file re-attachable
  });
  // A pasted image (screenshot share → paste) attaches like a picked one.
  msgEl.addEventListener('paste', (e) => {
    const items = [...((e.clipboardData && e.clipboardData.items) || [])];
    const imgs = items.filter((i) => i.kind === 'file' && /^image\//.test(i.type)).map((i) => i.getAsFile()).filter(Boolean);
    if (imgs.length) { e.preventDefault(); void attachFiles(imgs); }
  });

  // The approval buttons advertise `y` / `n`, and the question options are
  // numbered — so those keys have to actually work. Phones have no keyboard,
  // but this client is just as usable from a tablet or a desktop browser, and a
  // hint that does nothing is worse than no hint. Targets whatever is asking:
  // the open chat's session, else the top item in the attention feed.
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (sheet.classList.contains('show')) return;
    const s = S.screen === 'chat' ? sessions.get(S.sessionId) : sessions.get((attentionItems()[0] || {}).agentId);
    if (!s) return;
    if (s.pendingApproval) {
      if (e.key === 'y') { e.preventDefault(); approve(s.sessionId, 'yes'); }
      else if (e.key === 'n') { e.preventDefault(); approve(s.sessionId, 'no'); }
      return;
    }
    const qs2 = s.pendingQuestions || [];
    if (qs2.length === 1 && /^[1-9]$/.test(e.key)) {
      const n = Number(e.key);
      if (n <= (qs2[0].options || []).length) {
        e.preventDefault();
        S.picks.set(pickKey(s.sessionId, 0), n);
        submitAnswers(s.sessionId);
      }
    }
  });

  if (pushOk) {
    registerSW();
    navigator.serviceWorker.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'open-agent' && e.data.sessionId) { pendingAgent = e.data.sessionId; maybeOpenPending(); }
    });
  }

  // Elapsed times, snooze expiry and the stuck threshold are all clock-driven —
  // re-render on a slow tick so they don't freeze on a quiet fleet. Visible tabs
  // only; a backgrounded PWA has nothing to repaint.
  setInterval(() => { if (document.visibilityState === 'visible' && token) afterData(); }, 10000);

  // Viewport plumbing. --vh is the VISUAL viewport height — the pixels the
  // user can actually see. That one number covers all three failure modes this
  // shell has met: standalone's stale 100dvh reserving browser-chrome space
  // (bottom gap), the software keyboard (which shrinks vv.height, so the
  // composer lands right on top of it), and iOS scrolling the window to reveal
  // a focused input in standalone mode — we FOLLOW that scroll by translating
  // #app down by vv.offsetTop rather than sizing to the layout viewport and
  // leaving a keyboard-shaped void. Sub-80px innerHeight deltas are chrome
  // jitter, not a keyboard, so only real keyboards toggle body.kb.
  // The deepest layer of the standalone-viewport onion: WebKit can leave EVERY
  // metric — dvh, innerHeight, visualViewport.height — stuck at the browser-
  // chrome size, ~80pt short of the screen the installed app actually fills.
  // In standalone there IS no browser chrome, so the screen is the truth: learn
  // the shortfall while no keyboard is up (a keyboard makes the raw gap huge,
  // which is how we tell them apart) and add it back to every measurement.
  const standalone = navigator.standalone === true ||
    (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  let chromeGap = 0, staleVp = false;
  const applyViewport = () => {
    const vv = window.visualViewport;
    maxVH = Math.max(maxVH, window.innerHeight);
    let h = Math.round(vv ? vv.height : window.innerHeight);
    const off = vv ? Math.max(0, Math.round(vv.offsetTop)) : 0;
    if (standalone && window.screen && screen.height) {
      // iOS screen.width/height are display-native (don't rotate) — pick the
      // edge matching the current orientation.
      const land = matchMedia('(orientation: landscape)').matches;
      const sh = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
      const gap = sh - (h + off);
      // The paintable surface stops ~48pt short of the screen edge (the OS
      // keeps the home-indicator zone outside it), so claim the shortfall only
      // up to that line — claiming the full screen clipped the composer's
      // bottom off at the paint boundary.
      if (gap >= 0 && gap <= 140) {
        chromeGap = Math.max(0, gap - 48);
        staleVp = gap > 20;
      }
      h += chromeGap;
      // In stale mode #app already ends above the home indicator, so the
      // safe-area inset would be padding against a zone we never enter.
      document.body.classList.toggle('stale-vp', staleVp);
    }
    document.documentElement.style.setProperty('--vh', h + 'px');
    document.getElementById('app').style.transform = off ? `translateY(${off}px)` : '';
    document.body.classList.toggle('kb', window.innerHeight - Math.round(vv ? vv.height : window.innerHeight) > 80);
    if (S.screen === 'chat') main.scrollTop = main.scrollHeight;
  };
  // THE ACTUAL WEBKIT BUG (iOS 17/18, standalone only): the first software
  // keyboard permanently shrinks the viewport — innerHeight and
  // visualViewport.height stay ~80pt short after it closes, until force-quit.
  // No meta tag fixes it (interactive-widget is ignored in standalone). The
  // known heal: hide the full-height shell for one SYNCHRONOUS reflow, which
  // makes WebKit re-measure the viewport on restore. maxVH remembers the
  // honest launch height so we only heal when something was actually lost.
  let maxVH = window.innerHeight;
  function healViewport() {
    if (!standalone) return;
    const vv = window.visualViewport;
    if (vv && window.innerHeight - vv.height > 80) return;   // keyboard still up
    if (maxVH - window.innerHeight <= 4) return;             // nothing to heal
    const app = document.getElementById('app');
    const st = main.scrollTop;                               // display:none drops scroll state
    app.style.display = 'none';
    void app.offsetHeight;                                   // force the reflow WebKit needs
    app.style.display = '';
    main.scrollTop = st;
    applyViewport();
  }
  // The keyboard closes on focusout; WebKit needs a beat before the heal takes.
  document.addEventListener('focusout', () => setTimeout(healViewport, 140));

  // ── viewport diagnostics ──────────────────────────────────────────────────
  // The bottom-gap saga has burned enough guesses: this dumps every metric the
  // shell can see so the phone can SEND the numbers instead of a screenshot.
  // "Insert into composer" drops the JSON into the chat box — paste-to-agent.
  function measureProbe(style) {
    const p = document.createElement('div');
    p.style.cssText = 'position:fixed;left:-9999px;top:0;width:10px;visibility:hidden;' + style;
    document.body.appendChild(p);
    const v = { h: p.offsetHeight, pad: getComputedStyle(p).paddingBottom };
    p.remove();
    return v;
  }
  function viewportDiag() {
    const vv = window.visualViewport;
    const app = document.getElementById('app').getBoundingClientRect();
    return {
      standalone: navigator.standalone === true,
      displayModeStandalone: !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches),
      screen: `${screen.width}x${screen.height}`,
      innerHW: `${window.innerWidth}x${window.innerHeight}`,
      outerH: window.outerHeight,
      clientH: document.documentElement.clientHeight,
      vv: vv ? `${Math.round(vv.width)}x${Math.round(vv.height)} off=${Math.round(vv.offsetTop)} scale=${vv.scale}` : 'none',
      dvh: measureProbe('height:100dvh').h,
      svh: measureProbe('height:100svh').h,
      lvh: measureProbe('height:100lvh').h,
      safeB: measureProbe('padding-bottom:env(safe-area-inset-bottom,0px)').pad,
      safeT: measureProbe('padding-bottom:env(safe-area-inset-top,0px)').pad,
      maxVH, chromeGap, staleVp,
      cssVh: getComputedStyle(document.documentElement).getPropertyValue('--vh').trim(),
      appRect: `top=${Math.round(app.top)} bottom=${Math.round(app.bottom)} h=${Math.round(app.height)}`,
      ua: navigator.userAgent.replace(/Mozilla\/5\.0 \([^)]*\)\s*/, ''),
    };
  }
  function openDiagSheet() {
    const d = viewportDiag();
    const rows = [{
      label: 'Insert into composer (send it to your agent)',
      run: () => {
        msgEl.value = 'Viewport diagnostics: ' + JSON.stringify(d);
        if (S.screen === 'chat') { autosize(); msgEl.focus(); }
        else toast('Dropped in the composer — open an agent chat to send it');
      },
    }];
    for (const [k, v] of Object.entries(d)) rows.push({ label: `${k}: ${v}`, disabled: true });
    showSheet('VIEWPORT', rows);
  }
  window.addEventListener('resize', applyViewport);
  window.addEventListener('orientationchange', applyViewport);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', applyViewport);
    window.visualViewport.addEventListener('scroll', applyViewport);
  }
  // An installed PWA RESUMES rather than reloads: iOS can un-suspend it with
  // stale viewport numbers and never fire resize, so re-measure on every wake
  // (visibility, bfcache restore) — and once more a beat later, because the
  // standalone viewport can settle a frame after the wake event.
  const remeasure = () => { applyViewport(); setTimeout(applyViewport, 350); setTimeout(healViewport, 400); };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') remeasure();
  });
  window.addEventListener('pageshow', remeasure);
  applyViewport();

  renderChrome();
  render();
  connect();
})();
</script>
</body>
</html>
