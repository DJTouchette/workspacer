    statusLabel.textContent = label; statusLabel.style.color = color;

    tabBadge.textContent = String(needs);
    tabBadge.classList.toggle('show', needs > 0);
    const tabFor = S.screen === 'chat' ? 'fleet' : S.screen;
    for (const b of nav.querySelectorAll('button')) b.classList.toggle('on', b.dataset.tab === tabFor);

    // Fleet filters
    if (S.screen === 'fleet') {
      const count = (f) => all.filter((s) => matchesFilter(s, f)).length;
      filtersEl.hidden = false;
      filtersEl.innerHTML = [['all', 'All'], ['needs', 'Needs you'], ['working', 'Working'], ['idle', 'Idle']]
        .map(([k, l]) => `<button data-f="${k}" class="${S.filter === k ? 'on' : ''}">${l}<span class="n">${count(k)}</span></button>`).join('');
      for (const b of filtersEl.querySelectorAll('button')) {
        b.onclick = () => { S.filter = b.dataset.f; render(); renderChrome(); };
      }
    } else filtersEl.hidden = true;

    // Inspector segments
    if (S.screen === 'flows') {
      const runs = (active && active.workflows) || [], subs = (active && active.subagents) || [];
      segmentsEl.hidden = false;
      segmentsEl.innerHTML = [['flows', 'Flows', runs.length], ['agents', 'Agents', subs.length], ['usage', 'Usage', '']]
        .map(([k, l, n]) => `<button data-s="${k}" class="${S.seg === k ? 'on' : ''}">${l}${n === '' ? '' : `<span class="n">${n}</span>`}</button>`).join('');
      for (const b of segmentsEl.querySelectorAll('button')) {
        b.onclick = () => { S.seg = b.dataset.s; render(); renderChrome(); };
      }
    } else segmentsEl.hidden = true;

    composer.classList.toggle('show', S.screen === 'chat');
    nav.hidden = S.screen === 'chat';
  }

  function matchesFilter(s, f) {
    const st = agentState(s);
    if (f === 'all') return true;
    if (f === 'needs') return st === 'approval' || st === 'question' || st === 'review';
    if (f === 'working') return st === 'working';
    return st === 'idle' || st === 'stopped';
  }
  const RANK = { approval: 0, question: 0, review: 1, working: 2, idle: 3, stopped: 4 };
  function fleetList() {
    return [...sessions.values()].sort((a, b) =>
      (RANK[agentState(a)] - RANK[agentState(b)]) || ((b.lastActivity || 0) - (a.lastActivity || 0)));
  }

  // ══ render router ═════════════════════════════════════════════════════════
  const scrollMemo = new Map();
  let lastScreenKey = '';
  function render() {
    const key = S.screen + ':' + (S.screen === 'chat' || S.screen === 'flows' ? S.sessionId : '') + ':' + S.seg;
    const chat = S.screen === 'chat';
    const atBottom = chat && (main.scrollHeight - main.scrollTop - main.clientHeight < 80);
    const prevTop = main.scrollTop;
    if (lastScreenKey && lastScreenKey !== key) scrollMemo.set(lastScreenKey, prevTop);

    if (!token) { renderGate(); lastScreenKey = ''; return; }
    // Chat and the inspector bail to the fleet when their session is gone, and
    // that bail re-enters render(). Returning here leaves the nested render's
    // bookkeeping intact instead of stamping this (now abandoned) screen's key
    // over it, which would fake a screen change on the next tick and jump the
    // scroll.
    if (S.screen === 'fleet') renderFleet();
    else if (S.screen === 'inbox') renderInbox();
    else if (S.screen === 'chat') { if (renderChat() === false) return; }
    else if (S.screen === 'flows') { if (renderInspector() === false) return; }
    else if (S.screen === 'new') renderSpawn();

    if (lastScreenKey !== key) {
      main.scrollTop = chat ? main.scrollHeight : (scrollMemo.get(key) || 0);
    } else if (chat && atBottom) {
      main.scrollTop = main.scrollHeight;
    } else {
      // Replacing innerHTML drops the scroll offset. Snapshot events and the
      // 10s clock tick both re-render, so without this, reading back through a
      // transcript would yank you to the top every few seconds.
      main.scrollTop = prevTop;
    }
    lastScreenKey = key;
  }
  function go(screen) {
    S.screen = screen;
    renderChrome(); render();
  }
  function openChat(id) {
    if (!sessions.get(id)) return;
    // Pending attachments are per-session: their uploaded paths live on THAT
    // session's machine (possibly a federated peer), so they must not leak
    // into another agent's composer.
    if (S.sessionId !== id) { S.attach = []; renderAttach(); }
    S.screen = 'chat'; S.sessionId = id;
    renderChrome(); render();
  }

  // ══ fleet ═════════════════════════════════════════════════════════════════
  function renderFleet() {
    const list = fleetList().filter((s) => matchesFilter(s, S.filter));
    // Fleet is where the app LANDS, and the push banner used to live only on
    // Needs You — so the one affordance for turning notifications on sat on a
    // tab you had no reason to open until you already had a notification.
    const parts = [pushBannerHtml()];
    if (!list.length) {
      parts.push(emptyHtml('▦', C.dim, sessions.size ? 'Nothing here' : 'No agents yet',
        sessions.size ? 'Try another filter.' : 'Spawn one from the New tab, or from the desktop.'));
    } else {
      parts.push(list.map(agentCard).join(''));
    }
    const rec = resumableList();
    if (rec.length) {
      parts.push(`<div class="rule"><span class="l"></span><span class="t">RECENT · RESUMABLE</span><span class="l"></span></div>`);
      parts.push(rec.map((r) => `
        <button class="recent" data-resume="${esc(r.sessionId)}">
          <span class="dot" style="${dotStyle(r.color)}"></span>
          ${projectMarkHtml(r.cwd, 'sm')}
          <span class="t">${esc(r.title)}</span><span class="grow"></span>
          <span class="ago">${esc(relTime(r.updatedAt))}</span>
        </button>`).join(''));
    }
    main.innerHTML = `<div class="body">${parts.join('')}</div>`;
    bindAgentCards(main);
    for (const b of main.querySelectorAll('[data-resume]')) b.onclick = () => resume(b.dataset.resume);
  }

  function agentCard(s) {
    // A tombstoned card keeps rendering (muted, chip greyed, no inline
    // actions) — the fleet you can't currently reach is still your fleet.
    const down = hubDown(s);
    const st = agentState(s), meta = down ? STATES.stopped : STATES[st];
    const sid = esc(s.sessionId);
    const t = stats(s);
    const ask = down ? null : askFor(s);
    const flow = (s.workflows || []).find((w) => w.status === 'running');
    const doing = down ? hubOfflineLine(s) : doingLine(s);
    const tele = [];
    if (t.model) tele.push(`<span class="m">${esc(t.model)}</span>`);
    if (t.ctxPct !== undefined) {
      tele.push(`<span style="display:flex;align-items:center;gap:6px">${barHtml(t.ctxPct, ctxColor(t.ctxPct), 34)}<span style="color:${ctxColor(t.ctxPct)}">${t.ctxPct}%</span></span>`);
    }
    if (t.costUSD) tele.push(`<span>${esc(fmtUSD(t.costUSD))}</span>`);
    const flowLbl = flow ? `<span style="color:${C.blue}">flow: ${esc(flow.name || 'workflow')}</span>` : '';

    return `<div class="agent" data-agent="${sid}" style="border-color:${ask ? meta.edge : '#1f2427'}${st === 'stopped' || down ? ';opacity:.62' : ''}">
      <button class="top" data-open="${sid}">
        <div class="hd">
          <span class="dot${!down && meta.pulse ? ' pulse' : ''}" style="${dotStyle(meta.color)}"></span>
          ${projectMarkHtml(agentPath(s))}
          <span class="nm">${esc(agentName(s))}</span>
          <span class="prov">${esc(providerOf(s))}</span>
          ${hubChipHtml(s)}
          <span class="grow"></span>
          <span class="pill" style="color:${meta.color};background:${meta.bg};border:1px solid ${meta.line}">${down ? 'Hub offline' : meta.label}</span>
        </div>
        <div class="path rtl">${esc(lrm(agentPath(s)))}</div>
        ${doing ? `<div class="doing">${st === 'working'
            ? '<span class="spin"></span>'
            : `<span class="mark" style="background:${st === 'review' ? C.green : C.dim}"></span>`
          }<span class="txt">${esc(doing)}</span></div>` : ''}
        ${tele.length || flowLbl ? `<div class="tele">${tele.join('')}<span class="grow"></span>${flowLbl}</div>` : ''}
      </button>
      ${ask ? askStripHtml(s, ask) : ''}
    </div>`;
  }

  /** The one-line "what it wants" for the inline card strip. */
  function askFor(s) {
    if (s.pendingApproval) {
      const a = s.pendingApproval;
      return { kind: 'approval', text: `Allow ${a.toolName} — ${oneLine(summarizeInput(a.toolInput), 70)}`, detail: summarizeInput(a.toolInput) };
    }
    if (s.pendingQuestions && s.pendingQuestions.length) {
      const q = s.pendingQuestions[0];
      return { kind: 'question', text: q.question, questions: s.pendingQuestions };
    }
    return null;
  }
  function askStripHtml(s, ask) {
    const sid = esc(s.sessionId);
    if (ask.kind === 'approval') {
      return `<div class="strip">
        <div class="ask">${esc(ask.text)}</div>
        ${ask.detail ? `<div class="code">${esc(ask.detail)}</div>` : ''}
        <div class="acts">
          <button class="allow" data-approve="${sid}" data-d="yes">Allow<span class="key">y</span></button>
          <button class="deny" data-approve="${sid}" data-d="no">Deny<span class="key">n</span></button>
          <button class="neutral" data-open="${sid}">›</button>
        </div>
      </div>`;
    }
    // A question has no yes/no — offering Allow/Deny here would post an answer
    // the agent never asked for. Its options are the affordance.
    const single = ask.questions.length === 1;
    // `options` is normalized by claudemon and the desktop store, but the brain
    // passes questions through untouched — and a throw here would escape the
    // list.map that builds the whole fleet, freezing the screen on stale markup.
    const opts = single
      ? (ask.questions[0].options || []).map((o, i) => optionRow(s.sessionId, 0, i, o, false)).join('')
      : '';
    return `<div class="strip">
      <div class="ask">${esc(ask.text)}</div>
      ${single ? `<div class="opts">${opts}</div>` : ''}
      <div class="acts">
        ${single ? '' : `<button class="deny" data-open="${sid}">Answer ${ask.questions.length} questions</button>`}
        ${single ? `<button class="deny" data-decline="${sid}">Decline</button>` : ''}
        <button class="neutral" data-open="${sid}">›</button>
      </div>
    </div>`;
  }
  /** A pick belongs to the question SET it was made against, not just to the
   *  session — otherwise a pick stranded by a declined or withdrawn question
   *  can satisfy a later set's Submit and post an answer you never chose. */
  function pickKey(sessionId, qi) {
    const s = sessions.get(sessionId);
    const qs2 = (s && s.pendingQuestions) || [];
    return sessionId + ':' + hash(qs2.map((q) => q.question).join('\u0000')) + ':' + qi;
  }
  function optionRow(sessionId, qi, oi, o, amber) {
    const picked = S.picks.get(pickKey(sessionId, qi)) === oi + 1;
    return `<button class="opt${amber ? ' amber' : ''}${picked ? ' on' : ''}" data-pick="${esc(sessionId)}" data-q="${qi}" data-opt="${oi + 1}">
      <span class="n">${oi + 1}</span>
      <span><span class="l">${esc(o.label)}</span>${o.description ? `<span class="d">${esc(o.description)}</span>` : ''}</span>
    </button>`;
  }

  function bindAgentCards(root) {
    // The push banner renders on Fleet AND Needs You, so its button is wired
    // here rather than in either screen's own binder — a banner with a dead
    // Enable button is worse than no banner.
    const pb = root.querySelector('[data-push]');
    if (pb) pb.onclick = () => ensurePush(false);
    for (const b of root.querySelectorAll('[data-open]')) b.onclick = (e) => { e.stopPropagation(); openChat(b.dataset.open); };
    for (const b of root.querySelectorAll('[data-approve]')) b.onclick = (e) => { e.stopPropagation(); approve(b.dataset.approve, b.dataset.d); };
    for (const b of root.querySelectorAll('[data-decline]')) b.onclick = (e) => { e.stopPropagation(); declineQuestion(b.dataset.decline); };
    for (const b of root.querySelectorAll('[data-pick]')) {
      b.onclick = (e) => {
        e.stopPropagation();
        const id = b.dataset.pick, qi = Number(b.dataset.q), s = sessions.get(id);
        S.picks.set(pickKey(id, qi), Number(b.dataset.opt));
        const n = (s && s.pendingQuestions && s.pendingQuestions.length) || 1;
        if (n === 1) submitAnswers(id); else render();
      };
    }
  }

  /** Recently-worked sessions that aren't on screen as live agents. */
  function resumableList() {
    return (recents || [])
      .filter((r) => r && r.sessionId && !sessions.has(r.sessionId))
      .slice(0, 6)
      .map((r) => ({
        sessionId: r.sessionId,
        title: r.title || r.name || basename(r.cwd) || String(r.sessionId).slice(0, 8),
        updatedAt: r.updatedAt || r.startedAt || 0,
        cwd: r.cwd, provider: r.provider,
        color: r.provider === 'codex' ? C.green : r.provider === 'opencode' ? C.amber : C.blue,
      }));
  }

  // ══ needs you ═════════════════════════════════════════════════════════════
  function renderInbox() {
    const items = attentionItems();
    const working = fleetList().filter((s) => agentState(s) === 'working').length;
    const parts = [pushBannerHtml()];
    if (!items.length) {
      parts.push(`<div class="empty">
        <span class="ic" style="border:1.5px solid ${C.green};color:${C.green}">✓</span>
        <div class="big">Inbox zero</div>
        <div class="small">Nothing is blocked on you.${working ? ` ${working} agent${working === 1 ? ' is' : 's are'} still working — you'll get a push when one stops.` : ''}</div>
      </div>`);
    } else {
      parts.push(items.map(inboxCard).join(''));
      parts.push(`<div class="foot">${esc(scope.name || 'operator')} token · ${items.length} open<br />snooze hides an item for 30 minutes</div>`);
    }
    main.innerHTML = `<div class="body gap12">${parts.join('')}</div>`;
    bindInbox(main);
  }

  function inboxCard(it) {
    const s = sessions.get(it.agentId);
    const k = KIND_META[it.kind];
    const sig = esc(it.sig), sid = esc(it.agentId);
    let body = '';
    if (it.kind === 'approval') {
      body = `<div class="txt">Approve <b style="font-family:var(--mono)">${esc(it.title)}</b>?</div>
        ${it.detail ? `<div class="code">${esc(it.detail)}</div>` : ''}
        <div class="acts">
          <button class="allow" data-approve="${sid}" data-d="yes">Allow</button>
          <button class="deny" data-approve="${sid}" data-d="no">Deny</button>
        </div>
        <div class="acts"><button class="deny" data-approve="${sid}" data-d="always" style="height:40px;font-size:13px">Always allow ${esc(it.title)}</button></div>`;
    } else if (it.kind === 'question' || it.kind === 'stuck') {
      const qs2 = it.questions || [];
      const groups = qs2.map((q, qi) => `
        <div class="txt">${esc(q.question)}</div>
        <div class="opts">${(q.options || []).map((o, oi) => optionRow(it.agentId, qi, oi, o, false)).join('')}</div>`).join('');
      body = groups + (qs2.length > 1
        ? `<div class="acts"><button class="review" data-submit="${sid}">Submit ${qs2.length} answers</button></div>` : '')
        + `<div class="acts"><button class="deny" data-decline="${sid}" style="height:40px;font-size:13px">Decline &amp; stop</button></div>`;
    } else if (it.kind === 'error') {
      body = `<div class="txt">${esc(it.title)}</div>
        ${it.detail ? `<div class="code">${esc(it.detail)}</div>` : ''}
        <div class="acts">
          <button class="review" data-open="${sid}">Open agent</button>
          <button class="sq" data-dismiss="${sig}">×</button>
        </div>`;
    } else {
      body = `<div class="txt">${esc(it.detail || it.title)}</div>
        ${it.kind === 'bigdiff' ? '' : diffLineHtml(s)}
        <div class="acts">
          <button class="review" data-open="${sid}">Review diff</button>
          <button class="sq" data-snooze="${sig}">◷</button>
          <button class="sq" data-dismiss="${sig}">×</button>
        </div>`;
    }
    return `<div class="item" style="border-color:${k.edge}">
      <div class="ihd">
        <span class="glyph" style="color:${k.color};background:${k.bg};border:1px solid ${k.edge}">${k.mark}</span>
        ${s ? projectMarkHtml(agentPath(s), 'sm') : ''}
        <span class="who">${esc(s ? agentName(s) : 'agent')}</span>
        ${s ? hubChipHtml(s) : ''}
        <span class="grow"></span>
        <span class="ago">${esc(relTime(it.createdAt))}</span>
      </div>
      <div class="ibd">${body}</div>
    </div>`;
  }
  function diffLineHtml(s) {
    if (!s) return '';
    const d = diffSize(s);
    if (!d.files) return '';
    return `<div class="code">${d.files} file${d.files === 1 ? '' : 's'} · <span style="color:${C.green}">+${d.added}</span> <span style="color:${C.red}">−${d.removed}</span></div>`;
  }
  function bindInbox(root) {
    bindAgentCards(root);
    for (const b of root.querySelectorAll('[data-submit]')) b.onclick = () => submitAnswers(b.dataset.submit);
    for (const b of root.querySelectorAll('[data-dismiss]')) b.onclick = () => { dismissed.add(b.dataset.dismiss); afterData(); toast('Dismissed'); };
    for (const b of root.querySelectorAll('[data-snooze]')) b.onclick = () => { snoozed.set(b.dataset.snooze, Date.now() + SNOOZE_MS); afterData(); toast('Snoozed 30m'); };
  }
  function pushBannerHtml() {
    if (window.Notification && Notification.permission === 'granted') return '';
    // When push isn't AVAILABLE this used to render nothing at all — no banner,
    // no button, no reason. On an iPhone that is the whole experience of trying
    // to turn notifications on: iOS only exposes PushManager to a PWA launched
    // from the Home Screen, so in a Safari tab the feature simply appears not to
    // exist. Say which of the two things is missing instead.
    if (!pushOk) {
      const insecure = !window.isSecureContext;
      const why = insecure
        ? 'Notifications need an HTTPS address — open this over your tailnet HTTPS URL, not a raw IP.'
        : 'Notifications need the app installed: Share → Add to Home Screen, then open it from the icon.';
      return `<div class="pushrow"><span class="t">${why}</span></div>`;
    }
    const denied = Notification.permission === 'denied';
    return `<div class="pushrow">
      <span class="t">${denied ? 'Notifications are blocked for this site — turn them back on in browser settings.' : 'Get a push when an agent needs you, even with the app closed.'}</span>
      ${denied ? '' : '<button data-push>Enable</button>'}
    </div>`;
  }

  // ══ chat ══════════════════════════════════════════════════════════════════
  function renderChat() {
    const s = sessions.get(S.sessionId);
    if (!s) { go('fleet'); return false; }
    if (needsConvFetch(s) && !hubDown(s)) scheduleConvRefresh(s.sessionId);

    const parts = [chatPillsHtml(s), transcriptHtml(s)];
    if (isWorking(s)) parts.push(streamingHtml(s));
    main.innerHTML = `<div class="body gap14">${parts.filter(Boolean).join('')}</div>`;
    bindChat(main);
    renderComposer(s);
  }

  function chatPillsHtml(s) {
    const t = stats(s);
    const running = (s.workflows || []).filter((w) => w.status === 'running').length;
    const subs = (s.subagents || []).filter((g) => g.status === 'running').length;
    const d = diffSize(s);
    const pills = [];
    if (running) pills.push(`<button data-seg="flows"><span class="live"></span>${running} flow${running === 1 ? '' : 's'} running</button>`);
    if (subs) pills.push(`<button data-seg="agents"><span class="live"></span>${subs} subagent${subs === 1 ? '' : 's'}</button>`);
    if (d.files) pills.push(`<button data-files>${d.files} file${d.files === 1 ? '' : 's'} touched</button>`);
    const bits = [];
    if (t.costUSD) bits.push(fmtUSD(t.costUSD));
    if (t.ctxPct !== undefined) bits.push(`${t.ctxPct}% ctx`);
    pills.push(`<button data-seg="usage">${bits.length ? esc(bits.join(' · ')) : 'Usage'}</button>`);
    // The chat header can only fit a name and a path, so this is where the
    // project gets to say its name in full — the pills rail scrolls, so a long
    // label costs nothing that was already on screen.
    const proj = resolveProject(agentPath(s));
    const chip = proj
      ? `<span class="proj">${projectMarkHtml(agentPath(s), 'sm')}${esc(proj.label)}</span>`
      : '';
    // Remote sessions carry their hub on the same label rail as the project.
    const hubchip = hubOf(s)
      ? `<span class="proj" style="color:${hubDown(s) ? 'var(--dim)' : 'var(--blue-soft)'};padding-left:12px">⇄ ${esc(hubOf(s))}${hubDown(s) ? ' · offline' : ''}</span>`
      : '';
    return `<div class="pills">${hubchip}${chip}${pills.join('')}</div>`;
  }

  function streamingHtml(s) {
    const act = recentActivity(s, 1);
    const label = act.length ? act[0].text : 'Working…';
    return `<div class="streaming"><span class="ring"></span><span class="lbl">${esc(label)}</span>
      <span class="grow"></span><button data-cancel>Cancel</button></div>`;
  }

  /**
   * Fold the turn list into the design's chat blocks: user bubbles, assistant
   * prose, collapsible work cards (a run of tool calls), the flow cards for any
   * workflow launched in that stretch, and a changed-files card closing each
   * turn group.
   */
  function transcriptHtml(s) {
    const turns = convTurns(s);
    if (!turns.length) {
      return emptyHtml('◇', C.dim, 'No messages yet', 'Say something to get things moving.');
    }
    const traces = resolvedQs.get(s.sessionId) || [];
    const byAnchor = new Map();
    for (const r of traces) {
      const a = clamp(r.anchorLen, 0, turns.length);
      if (!byAnchor.has(a)) byAnchor.set(a, []);
      byAnchor.get(a).push(r);
    }
    const runs = [...(s.workflows || [])].sort((a, b) => (a.startedAt || 0) - (b.startedAt || 0));
    let runIdx = 0;

    const out = [];
    let work = [];        // pending tool calls for the open work card
    let groupEdits = [];  // every tool call since the last user message
    let workSeq = 0, groupSeq = 0;
    let lastAt = 0;

    const flushWork = () => {
      if (!work.length) return;
      // Key on the first tool call's id, not the card's position: positional
      // keys renumber as the transcript grows, so an expanded card would
      // collapse (or a different one would pop open) mid-turn.
      const key = work[0].id ? `${s.sessionId}:${work[0].id}` : `${s.sessionId}:w${groupSeq}:${workSeq}`;
      workSeq++;
      out.push(workCardHtml(s, work, key));
      // Any workflow that started during this stretch belongs right after it.
      while (runIdx < runs.length && (runs[runIdx].startedAt || 0) <= lastAt) {
        out.push(flowCardHtml(runs[runIdx++]));
      }
      work = [];
    };
    const flushGroup = () => {
      flushWork();
      if (groupEdits.length) {
        const edited = collectEditedFiles(groupEdits);
        if (edited.size) out.push(filesCardHtml(edited, s.liveCwd || s.cwd));
      }
      groupEdits = []; groupSeq++; workSeq = 0;
    };

    for (let i = 0; i < turns.length; i++) {
      for (const r of (byAnchor.get(i) || [])) { flushWork(); out.push(traceHtml(r)); }
      const t = turns[i];
      if (t.role === 'user') {
        flushGroup();
        out.push(userTurnHtml(t));
        continue;
      }
      const content = String(t.content || '').trim();
      if (content) { flushWork(); out.push(`<div class="say">${renderMarkdown(t.content)}</div>`); }
      for (const tc of (t.toolCalls || [])) {
        work.push(tc); groupEdits.push(tc);
        lastAt = Math.max(lastAt, tc.completedAt ?? tc.startedAt ?? 0);
      }
    }
    flushGroup();
    for (const r of (byAnchor.get(turns.length) || [])) out.push(traceHtml(r));
    // Workflows we never found an anchor for (e.g. the transcript is sparse)
    // still belong on screen — trailing is honest about the ordering.
    while (runIdx < runs.length) out.push(flowCardHtml(runs[runIdx++]));
    return out.join('');
  }

  function userTurnHtml(t) {
    if (t.command) {
      const c = t.command;
      return `<div class="msg user"><div class="b" style="font-family:var(--mono);font-size:13px">/${esc(c.name)}${c.args ? ' ' + esc(c.args) : ''}</div></div>`
        + (c.output ? `<div class="work"><div class="steps"><div class="step"><span class="a${c.outputIsError ? ' fail' : ''}" style="white-space:pre-wrap">${esc(oneLine(c.output, 300))}</span></div></div></div>` : '');
    }
    // Attachment markers ([Image: /path] et al.) render as chips, not raw
    // bracket noise — mirrors the desktop's messageImages.ts stripping.
    const raw = String(t.content || '');
    const tags = [];
    const stripped = raw.replace(/\[(Image|PDF|File):\s*([^\]]+)\]\s*/g, (_, kind, p) => {
      tags.push(`<span style="display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.14);font-family:var(--mono);font-size:11px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.8" fill="currentColor" stroke="none"/><path d="M21 15.5 16 10.5 6 20.5"/></svg>${esc(p.split('/').pop())}</span>`);
      return '';
    }).trim();
    const tagRow = tags.length
      ? `<div style="display:flex;flex-wrap:wrap;gap:5px;${stripped ? 'margin-bottom:6px' : ''}">${tags.join('')}</div>` : '';
    return `<div class="msg user"><div class="b">${tagRow}${esc(stripped)}</div></div>`;
  }

  function workCardHtml(s, calls, key) {
    const open = S.openWork.has(key);
    const edited = collectEditedFiles(calls);
    let added = 0, removed = 0;
    for (const e of edited.values()) { added += e.added; removed += e.removed; }
    const steps = calls.map((tc) => {
      const { verb, arg } = toolSummary(tc);
      return `<div class="step"><span class="t">${esc(verb)}</span><span class="a${tc.status === 'failed' ? ' fail' : ''}">${esc(arg || '')}</span></div>`;
    }).join('');
    return `<div class="work">
      <button class="wh" data-work="${esc(key)}">
        <span class="chev${open ? ' open' : ''}">›</span>
        <span class="n">${calls.length} step${calls.length === 1 ? '' : 's'}</span>
        <span class="grow"></span>
        ${added ? `<span class="plus">+${added}</span>` : ''}
        ${removed ? `<span class="minus">−${removed}</span>` : ''}
      </button>
      ${open ? `<div class="steps">${steps}</div>` : ''}
    </div>`;
  }

  function flowCardHtml(w) {
    const agents = w.agents || [];
    const done = agents.filter((a) => a.status === 'done' || a.status === 'failed').length;
    const total = agents.length || 0;
    const pct = w.status === 'completed' ? 100 : total ? Math.round((done / total) * 100) : 0;
    const failed = w.status === 'failed' || agents.some((a) => a.status === 'failed');
    const color = w.status === 'running' ? C.blue : failed ? C.red : C.green;
    const elapsed = w.durationMs ?? (w.startedAt ? Date.now() - w.startedAt : 0);
    return `<button class="flowcard" data-run="${esc(w.runId)}" style="border-color:${w.status === 'running' ? '#2c5a86' : failed ? '#3a2422' : '#22392b'}">
      <div class="fh">
        ${w.status === 'running' ? '<span class="ring"></span>' : `<span class="dot" style="${dotStyle(color)}"></span>`}
        <span class="nm">${esc(w.name || 'workflow')}</span>
        <span class="grow"></span>
        <span class="pr">${total ? `${done}/${total} agents` : esc(w.status)}</span>
      </div>
      <div class="track"><span style="display:block;height:100%;width:${pct}%;background:${color};border-radius:2px"></span></div>
      <div class="meta"><span>${esc(fmtTokens(w.totalTokens || 0))} tok</span><span>${esc(fmtDuration(elapsed))}</span><span style="color:${C.blue}">watch ›</span></div>
    </button>`;
  }

  function filesCardHtml(edited, cwd) {
    const rows = [...edited.entries()].slice(0, 40).map(([path, e]) => {
      const created = e.removed === 0;
      return `<div class="f">
        <span class="k" style="color:${created ? C.green : C.blue};background:${created ? '#18251d' : '#16232f'}">${created ? '+' : '~'}</span>
        <span class="p rtl">${esc(lrm(stripCwd(path, cwd)))}</span>
        <span class="grow"></span>
        <span class="plus" style="font-size:11px">+${e.added}</span>
        <span class="minus" style="font-size:11px">−${e.removed}</span>
      </div>`;
    }).join('');
    return `<div class="files" data-fileshere><div class="fh">CHANGED FILES · ${edited.size}</div>${rows}</div>`;
  }

  function traceHtml(r) {
    if (r.declined) {
      return `<div class="trace no"><div class="h">⊘ DECLINED</div>
        <div class="q">${esc(r.questions.length > 1 ? `You declined ${r.questions.length} questions — the turn was cancelled.` : 'You declined to answer — the turn was cancelled.')}</div></div>`;
    }
    const rows = r.questions.map((q, i) =>
      `<div><div class="q">${esc(q.question)}</div><div class="a">↳ ${esc((r.answers && r.answers[i]) || '—')}</div></div>`).join('');
    return `<div class="trace"><div class="h">✓ YOU ANSWERED</div>${rows}</div>`;
  }

  function bindChat(root) {
    for (const b of root.querySelectorAll('[data-work]')) {
      b.onclick = () => { const k = b.dataset.work; S.openWork.has(k) ? S.openWork.delete(k) : S.openWork.add(k); render(); };
    }
    for (const b of root.querySelectorAll('[data-run]')) {
      b.onclick = () => { S.seg = 'flows'; S.openRuns.add(b.dataset.run); go('flows'); };
    }
    for (const b of root.querySelectorAll('[data-seg]')) {
      b.onclick = () => { S.seg = b.dataset.seg; go('flows'); };
    }
    const fb = root.querySelector('[data-files]');
    if (fb) fb.onclick = () => { const el = [...root.querySelectorAll('[data-fileshere]')].pop(); if (el) el.scrollIntoView({ block: 'center' }); };
    const cb = root.querySelector('[data-cancel]');
    if (cb) cb.onclick = () => interrupt(S.sessionId);
  }

  // ══ composer ══════════════════════════════════════════════════════════════
  function renderComposer(s) {
    // A tombstoned session's composer is read-only: the ask dock and the
    // launch-setting chips vanish with the send button, because every one of
    // them is a call over a link that is down.
    if (hubDown(s)) {
      askDock.innerHTML = '';
      chipsEl.innerHTML = '';
      sendBtn.disabled = true;
      msgEl.placeholder = hubOfflineLine(s);
      return;
    }
    // Pending questions dock above the composer — the thing blocking the turn.
    if (s.pendingQuestions && s.pendingQuestions.length) {
      const qs2 = s.pendingQuestions;
      const multi = qs2.length > 1;
      askDock.innerHTML = `
        <div class="hd"><span class="g">?</span><span class="cap">NEEDS YOU · QUESTION${multi ? ` · ${qs2.length}` : ''}</span></div>
        ${qs2.map((q, qi) => `<div class="q">${esc(q.question)}</div>
          <div class="opts">${(q.options || []).map((o, oi) => optionRow(s.sessionId, qi, oi, o, true)).join('')}</div>`).join('')}
        <div class="acts" style="display:flex;gap:8px">
          ${multi ? `<button class="allow" data-submit="${esc(s.sessionId)}" style="height:42px">Submit answers</button>` : ''}
          <button class="deny" data-decline="${esc(s.sessionId)}" style="height:42px">Decline &amp; stop</button>
        </div>`;
    } else if (s.pendingApproval) {
      const a = s.pendingApproval;
      askDock.innerHTML = `
        <div class="hd"><span class="g">!</span><span class="cap">NEEDS YOU · APPROVAL</span></div>
        <div class="q">Approve <b style="font-family:var(--mono)">${esc(a.toolName)}</b>?</div>
        <div class="code" style="font-family:var(--mono);font-size:11.5px;color:var(--amber-mono);background:var(--amber-code);border:1px solid var(--amber-code-line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto">${esc(summarizeInput(a.toolInput))}</div>
        <div class="acts" style="display:flex;gap:8px">
          <button class="allow" data-approve="${esc(s.sessionId)}" data-d="yes" style="height:42px">Allow</button>
          <button class="deny" data-approve="${esc(s.sessionId)}" data-d="no" style="height:42px">Deny</button>
        </div>`;
    } else askDock.innerHTML = '';
    bindAgentCards(askDock);
    for (const b of askDock.querySelectorAll('[data-submit]')) b.onclick = () => submitAnswers(b.dataset.submit);

    // Launch-setting chips. Switching needs operator scope AND a provider that
    // serves claude.setModel / claude.setPermissionMode (the desktop does; the
    // headless brain does not). Scope is known from the hello frame up front;
    // the provider gap only shows itself on the first rejection, which latches
    // the chips read-only from then on.
    const caps = capsFor(s);
    const t = stats(s);
    const live = canSwitch();
    const model = t.model || shortModel((s.settings && s.settings.model) || '') || 'default';
    const effort = (s.settings && s.settings.effort) || '';
    const mode = s.livePermissionMode || (s.settings && s.settings.permissionMode) || caps.modes[0].id;
    const chips = [`<button data-chip="model">${esc(model)}${live ? ' ▾' : ''}</button>`];
    if (caps.effort && (effort || live)) chips.push(`<button data-chip="effort">${esc(effort || 'effort')}${live ? ' ▾' : ''}</button>`);
    chips.push(`<button data-chip="perm" class="${mode === 'default' || mode === 'ask' ? 'amber' : ''}">${esc(modeLabel(caps, mode))}${live ? ' ▾' : ''}</button>`);
    chipsEl.innerHTML = chips.join('');
    for (const b of chipsEl.querySelectorAll('[data-chip]')) {
      b.disabled = !live;
      b.onclick = () => openChipSheet(b.dataset.chip, s);
    }
    sendBtn.disabled = !isLive(s);
    msgEl.placeholder = isLive(s) ? 'Message workspacer…' : 'This session has ended';
  }

  const MANAGED_MODES = [{ id: 'ask', label: 'Ask to approve' }, { id: 'yolo', label: 'Full access' }];
  const CLAUDE_MODES = [
    { id: 'default', label: 'Ask to approve' }, { id: 'acceptEdits', label: 'Accept edits' },
    { id: 'plan', label: 'Plan mode' }, { id: 'bypassPermissions', label: 'Full access' },
  ];
  const CLAUDE_EFFORT = ['low', 'medium', 'high', 'xhigh', 'max'];
  /** The provider capability slice the composer needs (lib/providerCaps.ts). */
  function capsFor(sOrProvider) {
    const p = typeof sOrProvider === 'string' ? sOrProvider : providerOf(sOrProvider);
    if (p === 'claude') return { provider: p, modes: CLAUDE_MODES, effort: CLAUDE_EFFORT, modelSource: 'claude' };
    if (p === 'codex') return { provider: p, modes: MANAGED_MODES, effort: ['low', 'medium', 'high', 'xhigh'], modelSource: 'managed' };
    return { provider: p, modes: MANAGED_MODES, effort: null, modelSource: 'managed' };
  }
  const modeLabel = (caps, id) => (caps.modes.find((m) => m.id === id) || {}).label ||
    ({ auto: 'Auto', dontAsk: "Don't ask" })[id] || id || 'Ask to approve';
  // Token scope says whether we're ALLOWED to switch; it says nothing about
  // whether anyone is serving the method. The headless brain serves neither
  // claude.setModel nor claude.setPermissionMode, so the first "no provider"
  // rejection latches the chips read-only rather than letting them keep
  // offering a menu that can only fail.
  let switchUnsupported = false;
  const canSwitch = () => isOperator() && can('claude.setModel') && !switchUnsupported;
  function noteSwitchFailure(e) {
    const m = errText(e);
    if (/no provider|unknown method|not authorized/i.test(m)) {
      switchUnsupported = true;
      if (S.screen === 'chat') render();
    }
    return m;
  }

  async function openChipSheet(which, s) {
    const caps = capsFor(s);
    if (which === 'perm') {
      showSheet('PERMISSION MODE', caps.modes.map((m) => ({
        label: m.label,
        on: (s.livePermissionMode || (s.settings && s.settings.permissionMode)) === m.id,
        run: () => setPermissionMode(s.sessionId, m.id),
      })));
      return;
    }
    if (which === 'effort') {
      showSheet('REASONING EFFORT', (caps.effort || []).map((id) => ({
        label: id.charAt(0).toUpperCase() + id.slice(1),
        on: (s.settings && s.settings.effort) === id,
        run: () => setModel(s.sessionId, null, id),
      })));
      return;
    }
    showSheet('MODEL', [{ label: 'Loading…', disabled: true }]);
    const gen = sheetGen;
    let rows = [];
    try {
      if (caps.modelSource === 'claude') {
        // Qualified: a remote session's model catalog lives on ITS hub.
        const r = await call(qualify(s.sessionId, 'claude.listModels'), {});
        const seen = (r && r.seen) || [];
        const aliases = (r && r.aliases) || [];
        const ids = [...new Set([...aliases.map((a) => a.value), ...seen])].filter(Boolean);
        rows = ids.map((id) => ({ label: shortModel(id) || id, run: () => setModel(s.sessionId, id) }));
      } else {
        const list = await call(qualify(s.sessionId, 'providers.listModels'), { provider: caps.provider, cwd: agentPath(s) });
        rows = (list || []).map((m) => ({ label: m.label || m.id, run: () => setModel(s.sessionId, m.id) }));
      }
    } catch (e) { rows = [{ label: 'Could not load models: ' + errText(e), disabled: true }]; }
    if (gen !== sheetGen) return;   // dismissed while loading
    if (!rows.length) rows = [{ label: 'No models reported', disabled: true }];
    showSheet('MODEL', rows);
  }

  function openMoreSheet() {
    const s = sessions.get(S.sessionId);
    // Notification settings are an APP setting, not an agent one, and this
    // sheet used to return early with no agent selected — so the button was a
    // dead no-op on the screen the app actually opens on, and the only route to
    // the settings ran through picking an agent first.
    const rows = [];
    if (s) {
      if (can('files.upload')) rows.push({ label: 'Attach photo', run: () => fileEl.click() });
      if (isWorking(s)) rows.push({ label: 'Interrupt this turn', run: () => interrupt(s.sessionId) });
      rows.push({ label: 'Open inspector', run: () => { S.seg = 'flows'; go('flows'); } });
      rows.push({ label: 'Insert saved prompt', run: () => openLibrarySheet() });
      rows.push({ label: 'Copy working directory', run: () => copyText(agentPath(s)) });
    }
    rows.push({ label: 'Notification settings', run: () => openNotifySheet() });
    rows.push({ label: 'Viewport diagnostics', run: () => openDiagSheet() });
    showSheet(s ? 'AGENT' : 'WORKSPACER', rows);
  }
  async function openLibrarySheet() {
    if (!can('library.list')) { toast('Prompt library needs an operator token'); return; }
    showSheet('SAVED PROMPTS', [{ label: 'Loading…', disabled: true }]);
    const gen = sheetGen;
    try {
      const s = sessions.get(S.sessionId);
      const list = await call('library.list', { cwd: s ? agentPath(s) : undefined });
      if (gen !== sheetGen) return;   // dismissed while loading
      const prompts = (list || []).filter((i) => !i.kind || i.kind === 'prompt');
      if (!prompts.length) { showSheet('SAVED PROMPTS', [{ label: 'Nothing saved yet', disabled: true }]); return; }
      showSheet('SAVED PROMPTS', prompts.slice(0, 30).map((p) => ({
        label: p.title || p.id,
        run: () => { msgEl.value = p.body || p.title || ''; autosize(); msgEl.focus(); },
      })));
    } catch (e) { if (gen === sheetGen) showSheet('SAVED PROMPTS', [{ label: errText(e), disabled: true }]); }
  }
  function copyText(t) {
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Copy failed'));
    else toast('Copy unavailable');
  }

  // ══ inspector ═════════════════════════════════════════════════════════════
  function renderInspector() {
    const s = sessions.get(S.sessionId);
    if (!s) { go('fleet'); return false; }
    let body = '';
    if (S.seg === 'flows') body = flowsSegment(s);
    else if (S.seg === 'agents') body = agentsSegment(s);
    else body = usageSegment(s);
    main.innerHTML = `<div class="body gap12">${body}</div>`;
    for (const b of main.querySelectorAll('[data-toggle]')) {
      b.onclick = () => { const k = b.dataset.toggle; S.openRuns.has(k) ? S.openRuns.delete(k) : S.openRuns.add(k); render(); };
    }
    for (const b of main.querySelectorAll('[data-watch]')) b.onclick = () => showAgentSheet(s, b.dataset.watch);
  }

  const statusMark = (st) => {
    if (st === 'running') return '<span class="ring" style="width:13px;height:13px"></span>';
    if (st === 'done' || st === 'complete') return `<span class="smark" style="color:${C.green};background:#18251d">✓</span>`;
    if (st === 'failed') return `<span class="smark" style="color:${C.red};background:#2a1917">×</span>`;
    return '<span class="smark" style="border:1.5px dashed #3a4145"></span>';
  };
  const lineColor = (st) => (st === 'failed' ? C.red : st === 'running' ? '#7fa6cc' : C.faint);

  function flowsSegment(s) {
    const runs = [...(s.workflows || [])].sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
    if (!runs.length) {
      return emptyHtml('◫', C.dim, 'No flows', 'Workflow runs this agent started show up here, phase by phase.');
    }
    return runs.map((w) => {
      const open = S.openRuns.has(w.runId);
      const agents = w.agents || [];
      const done = agents.filter((a) => a.status === 'done' || a.status === 'failed').length;
      const total = agents.length;
      const failed = w.status === 'failed' || agents.some((a) => a.status === 'failed');
      const running = w.status === 'running';
      const color = running ? C.blue : failed ? C.red : C.green;
      const pct = w.status === 'completed' ? 100 : total ? Math.round((done / total) * 100) : 0;
      const elapsed = w.durationMs ?? (w.startedAt ? Date.now() - w.startedAt : 0);
      // Phases come from the run's declared list; agents attach by phaseTitle,
      // with anything unlabelled collected at the end so nothing is dropped.
      const titles = (w.phases || []).map((p) => p.title);
      const groups = titles.map((t) => ({ title: t, agents: agents.filter((a) => a.phaseTitle === t) }));
      const loose = agents.filter((a) => !a.phaseTitle || !titles.includes(a.phaseTitle));
      if (loose.length) groups.push({ title: titles.length ? 'OTHER' : 'AGENTS', agents: loose });
      const detail = groups.filter((g) => g.agents.length).map((g) => `
        <div class="phase">${esc(String(g.title).toUpperCase())}</div>
        ${g.agents.map((a) => `
          <button class="wa" data-watch="${esc(a.id)}">
            <div class="r1">
              ${statusMark(a.status)}
              <span class="nm">${esc(a.label || a.id)}</span>
              <span class="grow"></span>
              <span class="n1">${esc(a.tokens ? fmtTokens(a.tokens) : '—')}</span>
              <span class="n2">${esc(a.durationMs ? fmtDuration(a.durationMs) : (a.startedAt && a.status === 'running' ? fmtDuration(Date.now() - a.startedAt) : '—'))}</span>
            </div>
            <div class="r2"><span class="tick">└</span><span class="line" style="color:${lineColor(a.status)}">${esc(agentLine(a))}</span></div>
          </button>`).join('')}`).join('');
      return `<div class="run" style="border-color:${running ? '#243a4d' : failed ? '#3a2422' : '#1f2427'}">
        <button class="rh" data-toggle="${esc(w.runId)}">
          <div class="r1" style="display:flex;align-items:center;gap:9px">
            ${running ? '<span class="ring" style="width:13px;height:13px"></span>' : `<span class="dot" style="${dotStyle(color)}"></span>`}
            <span class="nm">${esc(w.name || 'workflow')}</span>
            <span class="grow"></span>
            <span class="cnt">${done}/${total || '?'}</span>
            <span class="chev${open ? ' open' : ''}">›</span>
          </div>
          <div class="track"><span style="display:block;height:100%;width:${pct}%;background:${color};border-radius:3px"></span></div>
          <div class="meta"><span>${esc(fmtTokens(w.totalTokens || 0))} tok</span><span>${esc(fmtDuration(elapsed))}</span><span>${esc(w.status)}</span>${w.totalCostUSD ? `<span>${esc(fmtUSD(w.totalCostUSD))}</span>` : ''}</div>
        </button>
        ${open && detail ? `<div style="border-top:1px solid var(--line)">${detail}</div>` : ''}
      </div>`;
    }).join('');
  }
  const agentLine = (a) => {
    if (a.lastToolSummary) return `${a.lastToolName || 'tool'} ${a.lastToolSummary}`;
    if (a.lastToolName) return a.lastToolName;
    if (a.status === 'queued') return 'queued';
    if (a.resultPreview) return oneLine(a.resultPreview, 90);
    if (a.promptPreview) return oneLine(a.promptPreview, 90);
    return a.status;
  };

  function agentsSegment(s) {
    const subs = s.subagents || [];
    if (!subs.length) {
      return emptyHtml('◈', C.dim, 'No subagents', 'Agents this session spawned appear here while they run and after they finish.');
    }
    return [...subs].sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0)).map((g) => `
      <button class="subcard" data-watch="${esc(g.id)}">
        <div class="r1" style="display:flex;align-items:center;gap:9px">
          ${statusMark(g.status)}
          <span class="nm">${esc(g.type || 'agent')}</span>
          <span class="grow"></span>
          <span class="n1" style="font-family:var(--mono);font-size:11px;color:var(--faint)">${esc(g.toolCalls || 0)} tools · ${esc(fmtTokens(g.tokens || 0))}</span>
        </div>
        ${g.description ? `<div class="desc">${esc(oneLine(g.description, 120))}</div>` : ''}
        <div class="line" style="color:${lineColor(g.status === 'complete' ? 'done' : g.status)}">└ ${esc(subLine(g))}</div>
      </button>`).join('');
  }
  const subLine = (g) => {
    if (g.lastToolName) return `${g.lastToolName}${g.lastToolSummary ? ' ' + oneLine(g.lastToolSummary, 70) : ''}`;
    if (g.status === 'complete') return `done${g.completedAt && g.startedAt ? ' · ' + fmtDuration(g.completedAt - g.startedAt) : ''}`;
    return 'starting…';
  };

  function usageSegment(s) {
    const t = stats(s);
    const parts = [];
    if (t.ctxPct !== undefined) {
      parts.push(`<div class="ucard">
        <div class="ucap">CONTEXT${t.model ? ' · ' + esc(t.model) : ''}</div>
        <div class="ubig"><span class="v">${t.ctxPct}%</span>
          ${t.ctxLimit ? `<span class="s">${esc(fmtTokens(t.ctxTokens || 0))} / ${esc(fmtTokens(t.ctxLimit))}</span>` : ''}</div>
        <div class="bar" style="height:7px;border-radius:4px"><span style="width:${t.ctxPct}%;background:${ctxColor(t.ctxPct)};border-radius:4px"></span></div>
      </div>`);
    }
    if (t.rateLimitWarning) parts.push(`<div class="warn"><span>⚠</span><span>${esc(t.rateLimitWarning)}</span></div>`);
    const windows = [
      ['5-hour window', t.fiveHourPct, t.fiveHourResetsAt, 'at'],
      ['7-day window', t.sevenDayPct, t.sevenDayResetsAt, 'in'],
      ['monthly', t.monthlyPct, t.monthlyResetsAt, 'in'],
    ].filter(([, p, at]) => p !== undefined || at);
    for (const [label, pct, at, form] of windows) {
      const c = limitColor(pct || 0);
      parts.push(`<div class="limit">
        <div class="r"><span class="l">${esc(label)}</span><span class="grow"></span>
          ${pct !== undefined ? `<span class="p" style="color:${c}">${Math.round(pct)}%</span>` : ''}
          <span class="rs">${esc(form === 'at' ? (at ? 'resets ' + fmtResetAt(at) : '') : fmtResetIn(at))}</span></div>
        <div class="bar" style="height:5px;border-radius:3px"><span style="width:${clamp(pct || 0, 0, 100)}%;background:${c};border-radius:3px"></span></div>
      </div>`);
    }
    const tiles = [];
    if (t.inTok !== undefined) tiles.push(['INPUT TOK', fmtTokens(t.inTok)]);
    if (t.outTok !== undefined) tiles.push(['OUTPUT TOK', fmtTokens(t.outTok)]);
    if (t.costUSD !== undefined) tiles.push(['SESSION COST', fmtUSD(t.costUSD)]);
    tiles.push(['TOOL CALLS', String(s.totalToolCalls || 0)]);
    const d = diffSize(s);
    if (d.files) tiles.push(['FILES TOUCHED', String(d.files)], ['LINES', `+${d.added} −${d.removed}`]);
    if (tiles.length) {
      parts.push(`<div class="tiles">${tiles.map(([l, v]) =>
        `<div class="tile"><span class="l">${esc(l)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>`);
    }
    if (!parts.length) {
      return emptyHtml('◷', C.dim, 'No usage yet', 'Token and cost telemetry appears once the agent takes a turn.');
    }
    return parts.join('');
  }

  function showAgentSheet(s, id) {
    const a = (s.workflows || []).flatMap((w) => w.agents || []).find((x) => x.id === id)
      || (s.subagents || []).find((x) => x.id === id);
    if (!a) return;
    const rows = [];
    const add = (l, v) => { if (v !== undefined && v !== null && v !== '') rows.push({ label: `${l}   ${v}`, disabled: true }); };
    add('status', a.status);
    add('model', shortModel(a.model));
    add('tokens', a.tokens ? fmtTokens(a.tokens) : '');
    add('cost', a.costUSD ? fmtUSD(a.costUSD) : '');
    add('tools', a.toolCalls);
    add('elapsed', a.durationMs ? fmtDuration(a.durationMs) : (a.startedAt ? fmtDuration(Date.now() - a.startedAt) : ''));
    add('last', a.lastToolName ? `${a.lastToolName} ${oneLine(a.lastToolSummary, 60)}` : '');
    if (a.promptPreview) rows.push({ label: oneLine(a.promptPreview, 200), disabled: true });
    if (a.resultPreview) rows.push({ label: oneLine(a.resultPreview, 200), disabled: true });
    showSheet(String(a.label || a.type || a.id).toUpperCase(), rows.length ? rows : [{ label: 'No detail reported', disabled: true }]);
  }

  // ══ spawn ═════════════════════════════════════════════════════════════════
  let providerProbe = null;   // providers.checkAll result, when we may ask
  function renderSpawn() {
    const dirs = (cfg && cfg.directories) || {};
    const favs = dirs.favourites || dirs.favorites || [];
    const recent = (dirs.recent || []).filter((d) => !favs.includes(d));
    const list = [...favs, ...recent].slice(0, 8);
    if (!S.spawn.provider) S.spawn.provider = (cfg && cfg.agents && cfg.agents.defaultProvider) || 'claude';
    if (!S.spawn.cwd && list.length) S.spawn.cwd = list[0];
    const caps = capsFor(S.spawn.provider);
    if (!S.spawn.permissionMode) S.spawn.permissionMode = caps.modes[0].id;
    const allowed = can('agents.spawn');

    const dirRows = list.map((d, i) => `
      <button class="dirrow ${S.spawn.cwd === d ? 'on' : ''}" data-dir="${esc(d)}">
        <span class="p rtl">${esc(lrm(d))}</span><span class="grow"></span>
        <span class="star ${i < favs.length ? 'on' : ''}">★</span>
      </button>`).join('');

    const provRows = ['claude', 'codex', 'opencode', 'pi'].map((p) => {
      const probe = providerProbe && providerProbe.find((x) => x.provider === p);
      const tag = probe ? (probe.found ? 'installed' : 'not found') : (p === 'claude' ? 'default' : 'harness');
      return `<button class="provbtn ${S.spawn.provider === p ? 'on' : ''}" data-prov="${p}"${probe && !probe.found ? ' disabled style="opacity:.45"' : ''}>
        <span class="nm">${esc(PROVIDER_LABEL[p])}</span><span class="tag">${esc(tag)}</span>
      </button>`;
    }).join('');

    // agents.spawn deliberately refuses bypass/yolo over the bus, so offering it
    // here would be a button that silently downgrades what you asked for.
    const permRows = caps.modes.map((m) => {
      const blocked = m.id === 'bypassPermissions' || m.id === 'yolo';
      return `<button class="permbtn ${S.spawn.permissionMode === m.id ? 'on' : ''}" data-perm="${esc(m.id)}"${blocked ? ' disabled' : ''}>${esc(m.label)}</button>`;
    }).join('');

    const promptChips = (spawnPrompts || []).map((p) => `
      <button class="tagchip ${S.spawn.prompt === p.id ? 'on' : ''}" data-prompt="${esc(p.id)}">${esc(p.title)}</button>`).join('');

    main.innerHTML = `<div class="body gap18">
      <div class="group">
        <div class="cap">WORKING DIRECTORY</div>
        ${dirRows || '<div class="scopenote" style="text-align:left">No directories remembered yet.</div>'}
        <button class="dirrow" data-otherdir><span class="p" style="color:var(--muted)">Other path…</span><span class="grow"></span><span class="star">+</span></button>
      </div>
      <div class="group">
        <div class="cap">AGENT</div>
        <div class="grid2">${provRows}</div>
      </div>
      <div class="group">
        <div class="cap">PERMISSIONS</div>
        <div class="segrow">${permRows}</div>
        ${caps.modes.some((m) => m.id === 'bypassPermissions' || m.id === 'yolo')
          ? '<div class="scopenote" style="text-align:left">Full access is refused for remote spawns — the hub strips it.</div>' : ''}
      </div>
      ${promptChips ? `<div class="group">
        <div class="cap">SEND FIRST · FROM LIBRARY</div>
        <div class="tagchips">${promptChips}</div>
      </div>` : ''}
      <button class="cta" id="spawnGo"${allowed ? '' : ' disabled'}>Spawn agent<span class="s">${esc(S.spawn.provider)}</span></button>
      <div class="scopenote">${allowed
        ? `spawns as <b>${esc(modeLabel(caps, S.spawn.permissionMode))}</b> in stream mode — chat, no terminal`
        : `this device holds a <b>${esc(scope.name || 'scoped')}</b> token — spawning needs operator scope`}</div>
    </div>`;

    for (const b of main.querySelectorAll('[data-dir]')) b.onclick = () => { S.spawn.cwd = b.dataset.dir; render(); };
    for (const b of main.querySelectorAll('[data-prov]')) b.onclick = () => { S.spawn.provider = b.dataset.prov; S.spawn.permissionMode = ''; render(); };
    for (const b of main.querySelectorAll('[data-perm]')) b.onclick = () => { S.spawn.permissionMode = b.dataset.perm; render(); };
    for (const b of main.querySelectorAll('[data-prompt]')) {
      b.onclick = () => { S.spawn.prompt = S.spawn.prompt === b.dataset.prompt ? '' : b.dataset.prompt; render(); };
    }
    const od = main.querySelector('[data-otherdir]');
    if (od) od.onclick = () => {
      const v = prompt('Working directory', S.spawn.cwd || '');
      if (v && v.trim()) { S.spawn.cwd = v.trim(); render(); }
