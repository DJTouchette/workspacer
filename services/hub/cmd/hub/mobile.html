<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d0e" />
<meta name="format-detection" content="telephone=no" />
<title>Workspacer Mobile</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Workspacer" />
<!-- Design fonts. Loaded non-blocking on purpose: the phone usually reaches the
     hub over a tailnet that may have no route to fonts.googleapis.com, and a
     render-blocking stylesheet there would stall the whole shell behind a DNS
     timeout. The stack falls back to system-ui, which is what the cached
     offline shell renders with. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
  /* ══ Workspacer Mobile ══════════════════════════════════════════════════════
     Mission control on your phone. Every screen is a projection of the session
     snapshots the hub bus streams us (conversation, pending state, workflows,
     subagents, usage) — so this works identically for stream-mode and PTY
     agents, with no terminal anywhere. Self-contained: no bundler, no build.

     Palette is deliberately narrow: blue = running, amber = wants you, green =
     finished/ok, red = failed. Neutrals carry everything else.
     ═════════════════════════════════════════════════════════════════════════ */
  :root {
    --bg:#0b0d0e; --card:#14171a; --raised:#15181a; --inner:#101315; --btn:#17191b;
    --active:#1d2124; --active-soft:#181c1f;
    --line:#1c2023; --line2:#1f2427; --line3:#22272a; --line4:#262b2e;
    --line5:#2a3033; --line-btn:#33393c;
    --text:#e6e9ea; --text2:#dfe3e4; --text3:#b6bdc0;
    --muted:#8a9296; --faint:#6b7377; --dim:#5c6468; --disabled:#4c5457; --ghost:#2f3538;

    --blue:#57a5ff; --blue-text:#8ec2ff; --blue-bg:#16232f; --blue-line:#2c5a86;
    --blue-edge:#243a4d; --blue-active:#1b2c3b; --blue-deep:#10161d; --blue-soft:#7fa6cc;
    --green:#7cc98a; --green-text:#8fdca2; --green-bg:#18251d; --green-line:#2f6b41;
    --green-edge:#22392b; --green-strong:#1e3a26; --green-active:#25482e;
    --amber:#e8b463; --amber-text:#ecdfc4; --amber-body:#dcd3bd; --amber-mono:#a2946f;
    --amber-bg:#231f16; --amber-line:#4a4028; --amber-edge:#413720;
    --amber-dock:#17150f; --amber-opt:#1b1813; --amber-opt-line:#3a3222;
    --amber-strip:#191712; --amber-strip-line:#2f2a1d; --amber-code:#12100c; --amber-code-line:#2a2519;
    --red:#e07a6f; --red-bg:#2a1917; --red-line:#4a2a26; --red-edge:#3a2422;

    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
    --sans:'IBM Plex Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* When the standalone viewport is known-stale, the corrected #app already
     stops at the paint boundary ABOVE the home indicator — a safe-area inset
     on top of that is padding against a zone the shell never enters. */
  body.stale-vp { --safe-b:0px; }
  html,body { margin:0; padding:0; height:100%; background:var(--bg); }
  /* position:fixed makes the DOCUMENT unscrollable, period. Without it iOS
     standalone let the page itself pan (rubber-band or keyboard reveal),
     dragging the whole shell up and exposing the void below #app — the
     "scroll the content and the gap appears" bug. */
  body { position:fixed; inset:0; overflow:hidden; width:100%;
    color:var(--text); font:15px/1.5 var(--sans); overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; }
  a { color:var(--blue); text-decoration:none; }
  ::-webkit-scrollbar { width:0; height:0; }
  @keyframes wksPulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  @keyframes wksSpin { to { transform:rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }

  /* --vh is the MEASURED VISUAL viewport height (JS, visualViewport.height):
     the area actually visible — excluding browser chrome that standalone
     mode's stale 100dvh still reserved, and excluding the software keyboard.
     When iOS scrolls the window to reveal a focused input, applyViewport
     translates #app down by the same offset so the shell tracks the visible
     area instead of leaving a void. dvh stays only as the pre-script fallback. */
  #app { height:var(--vh, 100dvh); display:flex; flex-direction:column; overflow:hidden; }

  /* ── header ───────────────────────────────────────────────────────────── */
  header { flex:none; padding:calc(10px + var(--safe-t)) 18px 12px; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:12px; }
  /* Chat mode slims the chrome: the transcript is the point. The cwd line is
     recoverable (project pill, "Copy working directory" in the + sheet). */
  header.chat { padding-bottom:8px; }
  header.chat h1 { font-size:18px; }
  header.chat .sub { display:none; }
  .hrow { display:flex; align-items:center; gap:10px; }
  .back { width:30px; height:30px; margin-left:-6px; flex:none; display:none; align-items:center;
    justify-content:center; border-radius:8px; color:var(--muted); font-size:19px; }
  .back:active { background:var(--active); }
  header.has-back .back { display:flex; }
  .titles { display:flex; flex-direction:column; gap:1px; min-width:0; flex:1; }
  .tline { display:flex; align-items:baseline; gap:7px; min-width:0; }
  .tline h1 { font-size:21px; font-weight:700; letter-spacing:-.02em; margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tmeta { font-family:var(--mono); font-size:11px; color:var(--disabled); flex:none; }
  .sub { font-family:var(--mono); font-size:11.5px; color:var(--faint); }
  .sub:empty { display:none; }

  /* Paths ellipsise at the START (the tail is what identifies a project). */
  .rtl { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:rtl; text-align:left; }

  /* ── project mark ─────────────────────────────────────────────────────────
     Which repo a row belongs to, at a glance — a fleet spanning several
     projects is otherwise a wall of identical rows. Initials on a plate tinted
     by the project's own colour, or its configured emoji (which carries its own
     colour and gets no plate). Always flex:none: on a phone the mark must never
     be the thing that shrinks when a row runs out of width — see
     projectMarkHtml. */
  .pmark { flex:none; width:19px; height:19px; border-radius:6px; display:inline-flex;
    align-items:center; justify-content:center; font-size:9px; font-weight:700;
    letter-spacing:-.02em; line-height:1; }
  .pmark.emoji { background:none; font-size:14px; }
  .pmark.sm { width:16px; height:16px; border-radius:5px; font-size:8px; }
  .pmark.sm.emoji { font-size:12px; }

  #statusPill { flex:none; display:flex; align-items:center; gap:7px; padding:6px 11px 6px 9px;
    border-radius:999px; border:1px solid var(--line5); background:var(--raised); }
  #statusPill:active { background:var(--active); }
  /* App-level settings. In the header because the header is the only chrome on
     EVERY screen — the composer's + button only exists once you have opened an
     agent's chat, which is no place to keep a setting about the app. */
  .gear { width:30px; height:30px; margin-right:-4px; flex:none; display:flex; align-items:center;
    justify-content:center; border-radius:8px; color:var(--muted); font-size:16px; }
  .gear:active { background:var(--active); }
  #statusPill .lbl { font-size:12.5px; font-weight:600; letter-spacing:-.01em; }

  .dot { width:9px; height:9px; border-radius:999px; flex:none; display:block; }
  .dot.pulse { animation:wksPulse 1.6s infinite; }

  /* ── filter chips / segmented control ─────────────────────────────────── */
  /* An author `display:flex` on an id beats the UA stylesheet's [hidden] rule,
     so hiding these needs to be said explicitly. */
  #filters[hidden], #segments[hidden] { display:none; }
  #filters { display:flex; gap:7px; overflow-x:auto; }
  #filters button { flex:none; padding:6px 12px; border-radius:999px; font-size:12.5px;
    font-weight:600; letter-spacing:-.01em; border:1px solid var(--line3);
    background:#131618; color:var(--muted); }
  #filters button.on { border-color:var(--blue-line); background:var(--blue-bg); color:var(--blue-text); }
  #filters .n { opacity:.5; margin-left:5px; font-family:var(--mono); }

  #segments { display:flex; gap:4px; padding:3px; background:var(--raised);
    border:1px solid var(--line3); border-radius:10px; }
  #segments button { flex:1; padding:8px 0; border-radius:8px; font-size:12.5px; font-weight:600;
    color:var(--muted); }
  #segments button.on { background:var(--line3); color:var(--text2); }
  #segments .n { font-family:var(--mono); font-size:10.5px; opacity:.6; margin-left:5px; }

  /* ── scroll body ──────────────────────────────────────────────────────── */
  main { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch; }
  .body { display:flex; flex-direction:column; gap:10px; padding:14px 14px 24px; }
  .body.gap12 { gap:12px; }
  .body.gap14 { gap:14px; }
  .body.gap18 { gap:18px; }

  /* ── agent card (fleet) ───────────────────────────────────────────────── */
  .agent { border:1px solid var(--line2); background:var(--card); border-radius:14px; overflow:hidden; }
  .agent .top { padding:13px 14px; display:flex; flex-direction:column; gap:9px; text-align:left; width:100%; }
  .agent .top:active { background:var(--active-soft); }
  .agent .hd { display:flex; align-items:center; gap:9px; }
  .agent .nm { font-size:16.5px; font-weight:600; letter-spacing:-.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prov { font-family:var(--mono); font-size:10px; color:var(--dim); border:1px solid var(--line4);
    border-radius:4px; padding:1px 4px; flex:none; }
  /* Which PEER HUB a federated session lives on. Same plate as .prov, tinted
     blue so "remote" reads at a glance; .off is the tombstone form. */
  .hub { font-family:var(--mono); font-size:10px; color:var(--blue-soft); border:1px solid var(--blue-edge);
    border-radius:4px; padding:1px 4px; flex:none; }
  .hub.off { color:var(--dim); border-color:var(--line4); }
  .grow { flex:1; }
  .pill { flex:none; font-size:11.5px; font-weight:600; letter-spacing:-.01em; padding:3px 9px;
    border-radius:999px; }
  .agent .path { font-family:var(--mono); font-size:11.5px; color:var(--faint); }
  .doing { display:flex; align-items:baseline; gap:7px; font-size:13px; color:var(--text3); line-height:1.35; }
  .doing .txt { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Optical alignment must NOT ride `transform`: wksSpin animates transform,
     and a translateY base makes the UA matrix-interpolate translate→rotate(360°)
     (≡ identity), so the ring jiggled 2px instead of spinning. */
  .spin { width:10px; height:10px; border-radius:999px; border:1.5px solid var(--blue);
    border-top-color:transparent; animation:wksSpin .9s linear infinite; flex:none; display:block;
    position:relative; top:2px; }
  .mark { width:10px; height:10px; border-radius:999px; flex:none; display:block; transform:translateY(1px); }
  .tele { display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11.5px;
    color:var(--muted); }
  .tele .m { color:var(--text3); }
  .bar { border-radius:2px; background:var(--line4); overflow:hidden; display:block; }
  .bar > span { display:block; height:100%; border-radius:2px; }

  /* Inline "needs you" strip riding on the card. */
  .strip { border-top:1px solid var(--amber-strip-line); background:var(--amber-strip);
    padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  .strip .ask { font-size:13px; color:var(--amber-body); line-height:1.4; }
  .strip .code { font-family:var(--mono); font-size:11.5px; color:var(--amber-mono);
    background:var(--amber-code); border:1px solid var(--amber-code-line); border-radius:8px;
    padding:8px 10px; white-space:pre-wrap; word-break:break-all; max-height:120px; overflow:auto; }
  .strip .acts { display:flex; gap:8px; }
  .allow, .deny, .neutral {
    height:46px; border-radius:11px; font-size:14.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:7px; }
  .allow { flex:1; background:var(--green-strong); border:1px solid var(--green-line); color:var(--green-text); }
  .allow:active { background:var(--green-active); }
  .deny { flex:1; background:var(--btn); border:1px solid var(--line-btn); color:var(--text3); }
  .deny:active { background:var(--active); }
  .neutral { width:46px; flex:none; background:var(--btn); border:1px solid var(--line-btn); color:var(--muted); }
  .neutral:active { background:var(--active); }
  .key { font-family:var(--mono); font-size:11px; opacity:.55; }

  /* Numbered option rows (questions), in neutral and amber flavours. */
  .opts { display:flex; flex-direction:column; gap:7px; }
  .opt { min-height:48px; padding:11px 13px; border-radius:11px; background:var(--btn);
    border:1px solid var(--line-btn); display:flex; align-items:center; gap:11px; text-align:left; width:100%; }
  .opt:active { background:var(--active); }
  .opt .n { font-family:var(--mono); font-size:11px; color:var(--blue); width:18px; height:18px;
    border-radius:5px; background:#16233199; display:flex; align-items:center; justify-content:center; flex:none; }
  .opt .l { font-size:14px; color:var(--text2); line-height:1.35; }
  .opt .d { display:block; font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.4; }
  .opt.on { border-color:var(--blue-line); background:var(--blue-bg); }
  .opt.amber { background:var(--amber-opt); border-color:var(--amber-opt-line); }
  .opt.amber:active { background:#231f16; }
  .opt.amber .n { color:var(--amber); background:#2a2418; }
  .opt.amber .l { color:var(--amber-text); }
  .opt.amber.on { border-color:var(--amber); }

  /* Section rule: ── RECENT · RESUMABLE ── */
  .rule { display:flex; align-items:center; gap:10px; padding:6px 4px 0; }
  .rule span.l { flex:1; height:1px; background:var(--line); }
  .rule span.t { font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; color:var(--disabled); }
  .recent { display:flex; align-items:center; gap:10px; padding:11px 13px; border:1px solid var(--line);
    border-radius:12px; width:100%; text-align:left; }
  .recent:active { background:var(--card); }
  .recent .t { font-size:14px; color:var(--text3); min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .recent .ago { font-family:var(--mono); font-size:11px; color:var(--dim); flex:none; }

  /* ── inbox ────────────────────────────────────────────────────────────── */
  .item { border:1px solid var(--line2); background:var(--card); border-radius:14px; overflow:hidden; }
  .item .ihd { padding:12px 14px; display:flex; align-items:center; gap:9px; border-bottom:1px solid var(--line); }
  .glyph { width:22px; height:22px; border-radius:7px; flex:none; display:flex; align-items:center;
    justify-content:center; font-family:var(--mono); font-size:12px; }
  .item .who { font-size:15px; font-weight:600; }
  .item .ago { font-family:var(--mono); font-size:11px; color:var(--dim); }
  .item .ibd { padding:13px 14px; display:flex; flex-direction:column; gap:11px; }
  .item .txt { font-size:14.5px; line-height:1.45; color:var(--text2); }
  .item .code { font-family:var(--mono); font-size:11.5px; color:var(--muted); background:var(--inner);
    border:1px solid var(--line2); border-radius:9px; padding:9px 11px; white-space:pre-wrap;
    word-break:break-all; line-height:1.5; max-height:150px; overflow:auto; }
  .item .acts { display:flex; gap:8px; }
  .item .acts .allow, .item .acts .deny { height:50px; border-radius:12px; font-size:15px; }
  .review { flex:1; height:50px; border-radius:12px; background:var(--blue-bg); border:1px solid var(--blue-line);
    color:var(--blue-text); font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; }
  .review:active { background:var(--blue-active); }
  .sq { width:50px; height:50px; flex:none; border-radius:12px; background:var(--btn);
    border:1px solid var(--line-btn); color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .sq:active { background:var(--active); }
  .foot { font-family:var(--mono); font-size:10.5px; color:var(--disabled); text-align:center;
    padding:8px 20px 0; line-height:1.6; }

  .empty { padding:64px 20px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
  .empty .ic { width:34px; height:34px; border-radius:999px; display:flex; align-items:center;
    justify-content:center; font-size:16px; }
  .empty .big { font-size:17px; font-weight:600; }
  .empty .small { font-size:13.5px; color:var(--faint); max-width:250px; line-height:1.45; }

  /* Push-enable banner (Needs You) — the tab that promises the notification. */
  .pushrow { display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:12px;
    border:1px solid var(--line3); background:var(--raised); }
  .pushrow .t { flex:1; font-size:13px; color:var(--text3); line-height:1.4; }
  .pushrow button { flex:none; padding:8px 13px; border-radius:9px; font-size:12.5px; font-weight:600;
    background:var(--blue-bg); border:1px solid var(--blue-line); color:var(--blue-text); }

  /* ── chat ─────────────────────────────────────────────────────────────── */
  .pills { display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; }
  .pills button { flex:none; display:flex; align-items:center; gap:6px; padding:7px 11px;
    border-radius:999px; background:var(--card); border:1px solid var(--line4);
    font-size:12.5px; color:var(--text3); white-space:nowrap; }
  .pills button:active { background:var(--active); }
  /* The project chip rides the same scrolling rail as the pills, but it is a
     label rather than a control — no press state, no tap target. */
  .pills .proj { flex:none; display:flex; align-items:center; gap:7px; padding:6px 12px 6px 7px;
    border-radius:999px; background:var(--card); border:1px solid var(--line4);
    font-size:12.5px; color:var(--text3); white-space:nowrap; }
  .pills .live { width:6px; height:6px; border-radius:999px; background:var(--blue);
    animation:wksPulse 1.6s infinite; }

  .msg.user { display:flex; justify-content:flex-end; }
  .msg.user .b { max-width:84%; background:#1b2a3a; border:1px solid #2b4055;
    border-radius:14px 14px 4px 14px; padding:11px 13px; font-size:14.5px; line-height:1.45;
    color:#e6eef7; white-space:pre-wrap; word-break:break-word; }
  .say { font-size:14.5px; line-height:1.55; color:var(--text2); padding:0 2px; word-break:break-word; }
  .say > :first-child { margin-top:0; } .say > :last-child { margin-bottom:0; }
  .say p { margin:8px 0; }
  .say h1,.say h2,.say h3,.say h4 { margin:14px 0 6px; font-weight:700; line-height:1.3; letter-spacing:-.01em; }
  .say h1 { font-size:1.16em; } .say h2 { font-size:1.08em; } .say h3 { font-size:1em; } .say h4 { font-size:.92em; }
  .say h1,.say h2 { border-bottom:1px solid var(--line); padding-bottom:4px; }
  .say ul,.say ol { margin:8px 0; padding-left:22px; } .say li { margin:3px 0; }
  .say blockquote { margin:8px 0; padding:3px 0 3px 12px; border-left:3px solid var(--line3);
    color:var(--text3); font-style:italic; }
  .say hr { border:none; border-top:1px solid var(--line3); margin:14px 0; }
  .say pre { background:var(--inner); border:1px solid var(--line2); border-radius:10px;
    padding:10px 12px; overflow:auto; font-family:var(--mono); font-size:12px; margin:8px 0; }
  .say code { font-family:var(--mono); font-size:12.5px; background:rgba(255,255,255,.06);
    padding:1px 5px; border-radius:5px; color:#b6cdf9; }
  .say pre code { background:none; padding:0; border-radius:0; color:inherit; }
  .say strong { color:#fff; font-weight:650; }
  .say a { text-decoration:underline; }

  .work { border:1px solid var(--line3); background:var(--inner); border-radius:12px; overflow:hidden; }
  .work .wh { padding:11px 13px; display:flex; align-items:center; gap:9px; width:100%; text-align:left; }
  .work .wh:active { background:var(--card); }
  .chev { font-family:var(--mono); font-size:13px; color:var(--dim); flex:none; display:block;
    transition:transform .15s; }
  .chev.open { transform:rotate(90deg); }
  .work .n { font-family:var(--mono); font-size:12px; color:var(--text3); }
  .plus { font-family:var(--mono); font-size:11.5px; color:var(--green); }
  .minus { font-family:var(--mono); font-size:11.5px; color:var(--red); }
  .steps { border-top:1px solid var(--line); padding:4px 0; }
  .step { display:flex; align-items:baseline; gap:9px; padding:8px 13px; }
  .step .t { font-family:var(--mono); font-size:10.5px; color:var(--blue); flex:none; width:46px; }
  .step .a { font-family:var(--mono); font-size:11.5px; color:var(--muted); min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .step .a.fail { color:var(--red); }

  .flowcard { border:1px solid var(--blue-line); background:var(--blue-deep); border-radius:12px;
    padding:12px 13px; display:flex; flex-direction:column; gap:10px; width:100%; text-align:left; }
  .flowcard:active { background:#141c25; }
  .flowcard .fh { display:flex; align-items:center; gap:9px; }
  .flowcard .nm { font-size:14px; font-weight:600; color:#cfe4fb; }
  .flowcard .pr { font-family:var(--mono); font-size:11.5px; color:var(--blue-soft); }
  .flowcard .track { height:4px; border-radius:2px; background:#1b2a3a; overflow:hidden; }
  .flowcard .meta { font-family:var(--mono); font-size:11px; color:#6b8299; display:flex; gap:12px; }
  .ring { width:12px; height:12px; border-radius:999px; border:1.5px solid var(--blue);
    border-top-color:transparent; animation:wksSpin .9s linear infinite; flex:none; }

  .files { border:1px solid var(--line3); border-radius:12px; overflow:hidden; }
  .files .fh { padding:10px 13px; font-family:var(--mono); font-size:10.5px; letter-spacing:.07em;

  .files .f { display:flex; align-items:center; gap:9px; padding:9px 13px; border-top:1px solid var(--line); }
  .files .k { width:16px; height:16px; border-radius:4px; flex:none; display:flex; align-items:center;
    justify-content:center; font-family:var(--mono); font-size:10px; }
  .files .p { font-family:var(--mono); font-size:11.5px; color:var(--text3); }

  .streaming { display:flex; align-items:center; gap:9px; padding:2px 2px 0; }
  .streaming .lbl { font-family:var(--mono); font-size:11.5px; color:var(--faint);
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .streaming button { font-size:12.5px; color:var(--red); border:1px solid var(--red-line);
    border-radius:8px; padding:5px 10px; flex:none; }

  /* Persistent trace of a decision you already made. */
  .trace { border:1px solid var(--line2); border-left:2px solid var(--blue); background:rgba(255,255,255,.02);
    border-radius:11px; padding:11px 13px; display:flex; flex-direction:column; gap:7px; }
  .trace.no { border-left-color:var(--red); }
  .trace .h { font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; color:var(--blue-text); }
  .trace.no .h { color:var(--red); }
  .trace .q { font-size:13px; color:var(--muted); line-height:1.4; }
  .trace .a { font-size:13.5px; color:var(--text2); font-weight:600; line-height:1.4; }

  /* ── inspector ────────────────────────────────────────────────────────── */
  .run { border:1px solid var(--line2); background:var(--card); border-radius:14px; overflow:hidden; }
  .run .rh { padding:13px 14px; display:flex; flex-direction:column; gap:10px; width:100%; text-align:left; }
  .run .rh:active { background:var(--active-soft); }
  .run .nm { font-size:15.5px; font-weight:600; letter-spacing:-.01em; }
  .run .cnt { font-family:var(--mono); font-size:11.5px; color:var(--muted); }
  .run .track { height:5px; border-radius:3px; background:var(--line2); overflow:hidden; }
  .run .meta { display:flex; gap:12px; font-family:var(--mono); font-size:11px; color:var(--faint); }
  .phase { padding:9px 14px; font-family:var(--mono); font-size:10.5px; letter-spacing:.07em;
    color:var(--dim); background:var(--inner); }
  .wa { padding:11px 14px; border-top:1px solid var(--line); display:flex; flex-direction:column;
    gap:5px; width:100%; text-align:left; }
  .wa:active { background:var(--active-soft); }
  .wa .r1 { display:flex; align-items:center; gap:9px; }
  .wa .nm { font-size:14px; color:var(--text2); font-weight:400; min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .wa .n1 { font-family:var(--mono); font-size:11px; color:var(--faint); flex:none; }
  .wa .n2 { font-family:var(--mono); font-size:11px; color:var(--dim); flex:none; }
  .wa .r2 { display:flex; align-items:baseline; gap:7px; padding-left:21px; }
  .wa .tick { font-family:var(--mono); font-size:11px; color:var(--disabled); }
  .wa .line { font-family:var(--mono); font-size:11px; min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .smark { width:13px; height:13px; border-radius:999px; flex:none; display:flex;
    align-items:center; justify-content:center; font-size:9px; }

  .subcard { border:1px solid var(--line2); background:var(--card); border-radius:13px; padding:12px 14px;
    display:flex; flex-direction:column; gap:7px; width:100%; text-align:left; }
  .subcard:active { background:var(--active-soft); }
  .subcard .nm { font-size:14.5px; font-weight:600; }
  .subcard .desc { font-size:13px; color:var(--muted); line-height:1.4; }
  .subcard .line { font-family:var(--mono); font-size:11px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }

  .ucard { border:1px solid var(--line2); background:var(--card); border-radius:14px; padding:14px;
    display:flex; flex-direction:column; gap:13px; }
  .ucap { font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; color:var(--dim); }
  .ubig { display:flex; align-items:baseline; gap:8px; }
  .ubig .v { font-size:30px; font-weight:700; letter-spacing:-.03em; }
  .ubig .s { font-family:var(--mono); font-size:12px; color:var(--faint); }
  .limit { border:1px solid var(--line2); background:var(--card); border-radius:13px; padding:12px 14px;
    display:flex; flex-direction:column; gap:9px; }
  .limit .r { display:flex; align-items:baseline; gap:8px; }
  .limit .l { font-size:14px; font-weight:600; }
  .limit .p { font-family:var(--mono); font-size:12px; }
  .limit .rs { font-family:var(--mono); font-size:11px; color:var(--dim); }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile { border:1px solid var(--line2); background:var(--card); border-radius:13px; padding:13px 14px;
    display:flex; flex-direction:column; gap:5px; }
  .tile .l { font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--dim); }
  .tile .v { font-size:19px; font-weight:600; letter-spacing:-.02em; }
  .warn { display:flex; gap:8px; align-items:flex-start; font-size:13px; line-height:1.45;
    color:var(--amber-body); background:var(--amber-bg); border:1px solid var(--amber-line);
    border-radius:11px; padding:11px 13px; }

  /* ── spawn ────────────────────────────────────────────────────────────── */
  .cap { font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; color:var(--dim); }
  .group { display:flex; flex-direction:column; gap:9px; }
  .dirrow { display:flex; align-items:center; gap:9px; padding:12px 13px; border-radius:11px;
    border:1px solid var(--line2); background:var(--card); width:100%; text-align:left; }
  .dirrow.on { border-color:var(--blue-line); background:#131b23; }
  .dirrow .p { font-family:var(--mono); font-size:12px; color:var(--text2); min-width:0; }
  .dirrow .star { font-size:12px; flex:none; color:var(--ghost); }
  .dirrow .star.on { color:var(--amber); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .provbtn { display:flex; flex-direction:column; gap:3px; padding:12px 13px; border-radius:11px;
    border:1px solid var(--line2); background:var(--card); text-align:left; }
  .provbtn.on { border-color:var(--blue-line); background:#131b23; }
  .provbtn .nm { font-size:14.5px; font-weight:600; }
  .provbtn .tag { font-family:var(--mono); font-size:10.5px; color:var(--faint); }
  .segrow { display:flex; gap:8px; flex-wrap:wrap; }
  .permbtn { flex:1 1 30%; min-height:46px; display:flex; align-items:center; justify-content:center;
    border-radius:11px; font-size:13.5px; font-weight:600; border:1px solid var(--line2);
    background:var(--card); color:var(--muted); padding:8px 6px; text-align:center; }
  .permbtn.on { border-color:var(--green-line); background:var(--green-bg); color:var(--green); }
  .permbtn[disabled] { opacity:.45; }
  .tagchips { display:flex; gap:7px; flex-wrap:wrap; }
  .tagchip { padding:8px 12px; border-radius:999px; font-size:13px; border:1px solid var(--line3);
    background:#131618; color:var(--muted); }
  .tagchip.on { border-color:var(--blue-line); background:var(--blue-bg); color:var(--blue-text); }
  .cta { height:54px; border-radius:13px; background:var(--blue-bg); border:1px solid var(--blue-line);
    color:var(--blue-text); font-size:16px; font-weight:600; display:flex; align-items:center;
    justify-content:center; gap:9px; width:100%; }
  .cta:active { background:var(--blue-active); }
  .cta[disabled] { opacity:.5; }
  .cta .s { font-family:var(--mono); font-size:12px; opacity:.6; }
  .scopenote { font-family:var(--mono); font-size:10.5px; color:var(--disabled); text-align:center;
    line-height:1.6; }
  .scopenote b { color:var(--amber); font-weight:400; }

  /* ── composer ─────────────────────────────────────────────────────────── */
  #composer { flex:none; border-top:1px solid var(--line); background:#0e1113; display:none; }
  #composer.show { display:block; }
  #askDock { border-bottom:1px solid var(--amber-strip-line); background:var(--amber-dock);
    padding:13px 14px; display:flex; flex-direction:column; gap:10px; }
  #askDock:empty { display:none; }
  #askDock .hd { display:flex; align-items:center; gap:8px; }
  #askDock .g { font-family:var(--mono); font-size:11px; color:var(--amber); }
  #askDock .cap { color:var(--amber-mono); }
  #askDock .q { font-size:14.5px; line-height:1.45; color:var(--amber-text); }
  #chips { display:flex; gap:7px; padding:10px 14px 0; overflow-x:auto; }
  /* While the software keyboard is up, every vertical pixel is transcript:
     drop the chips rail and the safe-area padding the keyboard now covers. */
  body.kb #chips { display:none; }
  body.kb .crow { padding-bottom:10px; }
  #attach { display:flex; gap:7px; padding:10px 14px 0; overflow-x:auto; }
  #attach:empty { display:none; }
  #attach .att { flex:none; display:flex; align-items:center; gap:7px; padding:4px 9px 4px 4px;
    border-radius:8px; background:var(--blue-bg); border:1px solid var(--blue-line);
    color:var(--blue-text); font-family:var(--mono); font-size:11px; max-width:170px; }
  #attach .att img { width:22px; height:22px; border-radius:5px; object-fit:cover; flex:none; display:block; }
  #attach .att .nm { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #attach .att.up { opacity:.55; }
  #attach .att .x { flex:none; font-size:14px; line-height:1; padding:2px; color:inherit; opacity:.75; }
  #chips button { flex:none; padding:5px 10px; border-radius:8px; background:var(--raised);
    border:1px solid var(--line4); font-family:var(--mono); font-size:11px; color:var(--text3);
    white-space:nowrap; }
  #chips button.amber { background:var(--amber-opt); border-color:var(--amber-opt-line); color:var(--amber); }
  #chips button[disabled] { opacity:.6; }
  .crow { display:flex; align-items:flex-end; gap:9px; padding:10px 14px calc(10px + var(--safe-b)); }
  .cbtn { width:42px; height:42px; flex:none; border-radius:11px; border:1px solid var(--line4);
    background:var(--raised); color:var(--muted); font-size:19px; display:flex; align-items:center;
    justify-content:center; }
  .cbtn:active { background:var(--active); }
  #msg { flex:1; min-width:0; min-height:42px; max-height:120px; resize:none; border-radius:11px;
    border:1px solid var(--line4); background:var(--raised); color:var(--text); font-family:var(--sans);
    font-size:16px; line-height:1.4; padding:11px 13px; outline:none; }
  #msg::placeholder { color:var(--faint); }
  #msg:focus { border-color:var(--blue-line); }
  #send { width:42px; height:42px; flex:none; border-radius:11px; background:var(--blue-bg);
    border:1px solid var(--blue-line); color:var(--blue-text); font-size:17px; display:flex;
    align-items:center; justify-content:center; }
  #send:active { background:var(--blue-active); }
  #send[disabled] { opacity:.45; }

  /* ── tab bar ──────────────────────────────────────────────────────────── */
  nav { flex:none; display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line);
    background:#0e1113; padding:6px 6px calc(10px + var(--safe-b)); }
  /* Hidden in chat (the header's back button is the way out): the transcript
     gets the ~70-100px back, and the composer's own safe-area padding stops
     being a double payment. Author display:grid beats the UA [hidden] rule. */
  nav[hidden] { display:none; }
  /* Tab icons are the workspacer pack glyphs (wksIcons.tsx geometry), inlined
     as single-tone SVGs: currentColor carries the active/inactive tint. */
  nav button { display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 0;
    position:relative; color:var(--dim); }
  nav button.on { color:var(--blue); }
  nav .ic { width:19px; height:19px; display:block; }
  nav .l { font-size:11px; font-weight:600; letter-spacing:-.01em; color:inherit; }
  nav .badge { position:absolute; top:2px; right:50%; margin-right:-22px; min-width:17px; height:17px;
    border-radius:999px; background:var(--amber); color:var(--amber-dock); font-family:var(--mono);
    font-size:10.5px; font-weight:700; display:none; align-items:center; justify-content:center; padding:0 4px; }
  nav .badge.show { display:flex; }

  /* ── gate / sheet / toast ─────────────────────────────────────────────── */
  .gate { max-width:400px; margin:40px auto 0; padding:26px 22px; text-align:center;
    background:var(--card); border:1px solid var(--line2); border-radius:18px; }
  .gate h2 { font-size:22px; margin:0 0 8px; letter-spacing:-.02em; }
  .gate p { color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.5; }
  .gate input { width:100%; border:1px solid var(--line4); background:var(--inner); color:var(--text);
    border-radius:12px; padding:14px; font-size:16px; margin-bottom:12px; font-family:var(--mono); outline:none; }
  .gate input:focus { border-color:var(--blue-line); }
  .gate button { width:100%; min-height:50px; border-radius:13px; background:var(--blue-bg);
    border:1px solid var(--blue-line); color:var(--blue-text); font-size:16px; font-weight:600; }

  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30; display:none; }
  #scrim.show { display:block; }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:31; background:var(--card);
    border-top:1px solid var(--line4); border-radius:16px 16px 0 0;
    padding:8px 14px calc(16px + var(--safe-b)); max-height:72vh; overflow-y:auto; display:none; }
  #sheet.show { display:block; }
  #sheet .grip { width:36px; height:4px; border-radius:2px; background:var(--line5); margin:6px auto 12px; }
  #sheet .st { font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; color:var(--dim);
    margin-bottom:10px; }
  #sheet .rows { display:flex; flex-direction:column; gap:7px; }

  #toast { position:fixed; left:50%; bottom:calc(96px + var(--safe-b)); transform:translateX(-50%) translateY(10px);
    background:var(--btn); border:1px solid var(--line-btn); color:var(--text); font-size:13.5px;
    padding:11px 18px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
    z-index:40; max-width:84vw; text-align:center; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="hrow">
      <button class="back" id="backBtn" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="titles">
        <div class="tline"><h1 id="title">Fleet</h1><span class="tmeta" id="titleMeta"></span></div>
        <div class="sub rtl" id="sub"></div>
      </div>
      <button id="statusPill"><span class="dot" id="statusDot"></span><span class="lbl" id="statusLabel">—</span></button>
      <button class="gear" id="gearBtn" aria-label="Notification settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="15" cy="7" r="2.1" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="2.1" fill="currentColor" stroke="none"/><circle cx="13" cy="17" r="2.1" fill="currentColor" stroke="none"/></svg></button>
    </div>
    <div id="filters" hidden></div>
    <div id="segments" hidden></div>
  </header>

  <main id="main"></main>

  <div id="composer">
    <div id="askDock"></div>
    <div id="attach"></div>
    <div id="chips"></div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div class="crow">
      <button class="cbtn" id="moreBtn" aria-label="More"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <textarea id="msg" rows="1" placeholder="Message workspacer…" autocomplete="off"></textarea>
      <button id="send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>

  <nav id="nav">
    <button data-tab="fleet" class="on">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6" fill="currentColor" stroke="none"/></svg>
      <span class="l">Fleet</span></button>
    <button data-tab="inbox">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <span class="l">Needs You</span><span class="badge" id="tabBadge">0</span></button>
    <button data-tab="flows">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 20 7.5V16.5L12 21 4 16.5V7.5z"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>
      <span class="l">Flows</span></button>
    <button data-tab="new">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span class="l">New</span></button>
  </nav>
</div>
<div id="scrim"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
(() => {
  'use strict';

  // ══ dom handles ═══════════════════════════════════════════════════════════
  const $ = (id) => document.getElementById(id);
  const hdr = $('hdr'), titleEl = $('title'), titleMetaEl = $('titleMeta'), subEl = $('sub');
  const statusPill = $('statusPill'), statusDot = $('statusDot'), statusLabel = $('statusLabel');
  const gearBtn = $('gearBtn');
  const filtersEl = $('filters'), segmentsEl = $('segments'), main = $('main');
  const composer = $('composer'), askDock = $('askDock'), chipsEl = $('chips');
  const attachEl = $('attach'), fileEl = $('file');
  const msgEl = $('msg'), sendBtn = $('send'), moreBtn = $('moreBtn'), backBtn = $('backBtn');
  const nav = $('nav'), tabBadge = $('tabBadge'), scrim = $('scrim'), sheet = $('sheet'), toastEl = $('toast');

  // ══ tiny helpers ══════════════════════════════════════════════════════════
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // A left-to-right mark, so a path rendered with `direction:rtl` (to ellipsise
  // its head rather than its tail) still reads left-to-right.
  const lrm = (p) => '‎' + String(p ?? '');
  const basename = (p) => { p = String(p || '').replace(/[/\\]+$/, ''); const i = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\')); return i >= 0 ? p.slice(i + 1) : p; };
  const oneLine = (s, n) => String(s ?? '').split('\n')[0].slice(0, n || 80);
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

  function toast(m) {
    toastEl.textContent = m; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  // Formatters, matching the desktop's (lib/sessionStats.ts).
  function fmtTokens(n) {
    n = Number(n) || 0;
    if (n < 1000) return String(Math.round(n));
    const k = Math.round(n / 1000);

  function fmtUSD(n) { n = Number(n) || 0; return n >= 0.01 ? '$' + n.toFixed(2) : n > 0 ? '<$0.01' : '$0.00'; }

    ms = Number(ms) || 0;

  function fmtResetAt(epochSec) {

  const ctxColor = (pct) => (pct >= 90 ? C.red : pct >= 70 ? C.amber : C.green);
  const limitColor = (pct) => (pct >= 80 ? C.red : pct >= 50 ? C.amber : C.green);
  const dotStyle = (color, pulse) => `background:${color};box-shadow:0 0 0 3px ${color}1f`;
  const barHtml = (pct, color, w, h) =>
    `<span class="bar" style="width:${w}px;height:${h || 4}px"><span style="width:${clamp(pct, 0, 100)}%;background:${color}"></span></span>`;

  // ══ state ═════════════════════════════════════════════════════════════════
  const qs = new URLSearchParams(location.search);
  let token = qs.get('token') || localStorage.getItem('hubToken') || '';
  if (token) localStorage.setItem('hubToken', token);
  let pendingAgent = qs.get('agent') || '';

  /** Live snapshots keyed by sessionId — the one source every screen renders from. */
  const sessions = new Map();
  // ── federation ────────────────────────────────────────────────────────────
  // Linked hubs republish their agents' events here with the peer's name on the
  // EVENT ENVELOPE (payloads untouched; absent = local), and qualified calls
  // `hub:<peer>/<method>` route back over the link. Which hub a session lives
  // on is learned from stamped envelopes and peer-fleet seeds; a hub whose link
  // is down keeps its cards on screen as read-only tombstones.
  const sessionHub = new Map();    // sessionId -> peer hub name (absent = local)
  const offlineHubs = new Map();   // peer hub name -> last-seen ts (link down)
  const hubOf = (s) => (s && s.hub) || '';
  const hubDown = (s) => { const h = hubOf(s); return !!h && offlineHubs.has(h); };
  const hubGone = (id) => { const h = sessionHub.get(id); return !!h && offlineHubs.has(h); };

   *  The bus applies the tier check to the BARE method either way, so a token
   *  may reach hub:work/sessions.conversation exactly when it may reach
   *  sessions.conversation. */

  let scope = { name: '', methods: [] };

  let recents = [];            // sessions.recent (resumable history)
  let connected = false;

  const S = {
    screen: 'fleet',          // fleet | inbox | chat | flows | new
    filter: 'all',            // fleet filter
    seg: 'flows',             // inspector segment
    sessionId: '',            // chat / inspector subject
    openWork: new Set(),      // expanded work cards (by key)
    openRuns: new Set(),      // expanded workflow runs (by runId)
    picks: new Map(),         // sessionId:questionSetHash:index -> 1-based option
    spawn: { cwd: '', provider: '', permissionMode: '', prompt: '' },
    attach: [],               // pending image attachments: {id, name, path, thumb, uploading}

  const prevAmbient = new Map();   // sessionId -> last ambientState
  const doneAt = new Map();        // sessionId -> ts of the working→idle edge
  const dismissed = new Set();     // attention signature
  const snoozed = new Map();       // signature -> until ts

  const BIGDIFF_LINES = 80, STUCK_MS = 5 * 60 * 1000, ERROR_RECENT_MS = 5 * 60 * 1000;

  /** Decisions you already made, kept client-side and anchored by conversation

  const resolvedQs = new Map();

  const can = (method) =>
    !scope.methods.length || scope.methods.some((p) => p === '*' || p === method ||
      (p.endsWith('.*') && method.startsWith(p.slice(0, -1))));
  const isOperator = () => !scope.name || scope.name === 'operator';

  // ══ project identity ══════════════════════════════════════════════════════
  // Every row on this phone belongs to a directory, and until now they all
  // looked the same — a fleet spanning several repos was a wall of identical
  // cards and the only way to tell them apart was to read the path. This
  // resolves a directory to a small mark so that stops being true.
  //
  // Ported from the desktop's lib/projectIdentity.ts + lib/projectKey.ts. The
  // palette, the FNV-1a hash and the initials rules are byte-identical on
  // purpose: the same directory must get the SAME mark on the desktop and on
  // the phone, or the two views of one fleet stop agreeing with each other.
  //
  // It works with NO configuration, which is the point — an unconfigured
  // project still gets stable initials and a stable colour from its own path,
  // so this needs `config.projects` to be an improvement, never a prerequisite.
  // (`config.get` is in the bus's VIEW tier — internal/authtoken/authtoken.go —
  // so a view-scoped phone token can read it; if a future tier drops it, cfg
  // stays null and every mark falls back to the derived form.)
  //
  // Two deliberate divergences from the desktop, both forced by the browser:
  //  · a downloaded icon is served as `workspacer-icon://<file>`, a protocol
  //    that exists only inside the Electron app, and a configured `favicon` is
  //    a third-party URL a phone reaching the hub over a tailnet often has no
  //    route to. Neither is drawn here: the emoji, else the initials.
  //  · the case-insensitive key fallback keys off the PATH's shape rather than
  //    navigator, because navigator describes the PHONE and the directory
  //    belongs to whichever host the agents run on.
  const PROJECT_PALETTE = ['#6b8afd', '#c084fc', '#f472b6', '#fb923c', '#2dd4bf', '#38bdf8', '#a3a3f5', '#e879a6'];
  /** FNV-1a, 32-bit. Same path → same colour, on every client and across
   *  restarts, which is the whole reason the colour is derived at all. */
  function projHash(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }
  /** The config key for a directory — normalized the way `scripts`, `widgets`
   *  and `projects` are all keyed, so one repo can't land under two spellings. */
  const projectKey = (cwd) => String(cwd || '').replace(/\\/g, '/').replace(/\/+$/, '');
  /** One or two characters for a name. Word initials rather than the first two
   *  letters, so sibling repos sharing a prefix stay distinct: `api-gateway` and
   *  `api-worker` read AG and AW, not both AP. */
  function initialsOf(name) {
    const words = String(name || '').split(/[\s._-]+/).filter(Boolean);
    if (!words.length) return '?';
    if (words.length === 1) {

      const camel = words[0].match(/^([a-z]+)([A-Z][a-z]*)/);
      return camel ? (camel[1][0] + camel[2][0]).toUpperCase() : words[0].slice(0, 2).toUpperCase();

  /** The `config.projects` entry for a key, honouring one that differs only by
   *  case. Windows spells a single directory several ways (`c:/users/me/repo`
   *  vs `C:/Users/me/repo`) and its filesystem treats them as one; POSIX paths
   *  that differ by case really are different directories, so the fallback is
   *  limited to drive-lettered paths. */
  function projectEntry(key) {

    if (!map || typeof map !== 'object') return {};
    if (Object.prototype.hasOwnProperty.call(map, key)) return map[key] || {};

   *  here they are interpolated into one, so anything that could carry a quote

   *  colour rather than being pasted in. */

      initials: initialsOf(label),

    // a letter mark does. "Not ASCII" is what an emoji is, here.

  // ══ transport ═════════════════════════════════════════════════════════════
  let ws = null, callSeq = 0, backoff = 500, reconnectTimer = null, reconcileTimer = null;

  function call(method, params, timeoutMs) {
    return new Promise((resolve, reject) => {

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return `${proto}//${location.host}/bus?token=${encodeURIComponent(token)}`;
  }

  // ══ snapshot plumbing ═════════════════════════════════════════════════════
  // Two providers serve snapshots: the desktop app (rich, with conversation) and
  // the headless brain (state-only, sparse:true). A sparse row must never
  // clobber a rich one we're rendering — merge it over what we hold.
  function fold(snap) {
    const prev = sessions.get(snap.sessionId);

      // show. A hub whose LINK is down answered nothing at all: its sessions
      // are tombstones to keep on screen, not rows to drop.
      for (const id of [...sessions.keys()]) {
        if (seen.has(id)) continue;
        const h = sessionHub.get(id);
        if (h && offlineHubs.has(h)) continue;
        sessions.delete(id); sessionHub.delete(id);

    } catch { /* the status pill shows offline */ }

  /** Merge every connected peer's fleet onto the local seed, hub-stamped. An
   *  older hub without federation.peers errors the first call — that reads as
   *  "no peers"; an unreachable peer costs its fleet, never the boot. */
  async function seedPeers(seen) {
    let peers = [];
    try { peers = (await call('federation.peers', {})) || []; } catch { return; }
    const names = new Set();
    for (const p of peers) {
      if (!p || !p.name) continue;
      names.add(p.name);
      if (p.connected) offlineHubs.delete(p.name);
      else if (!offlineHubs.has(p.name)) offlineHubs.set(p.name, p.lastSeen || 0);
    }
    // A hub UNLINKED (gone from the peer list) is not offline, it is gone —
    // its tombstones must not outlive the link.
    for (const h of [...offlineHubs.keys()]) if (!names.has(h)) offlineHubs.delete(h);
    await Promise.all(peers.filter((p) => p && p.name && p.connected).map(async (p) => {
      try {
        const rows = (await call(`hub:${p.name}/sessions.snapshots`, {})) || [];
        for (const row of rows) {
          if (!row || !row.sessionId) continue;
          row.hub = p.name;
          seen.add(row.sessionId);
          sessionHub.set(row.sessionId, p.name);
          fold(row);
        }

        // A blip on a nominally-connected link must not wipe the peer's cards
        // — keep what we hold; the disconnect event (or the next reconcile)
        // settles which way it goes.
        for (const [id, h] of sessionHub) if (h === p.name) seen.add(id);
      }

  /** A peer's link came back: replace its fleet wholesale — reseed, then drop

  async function reseedPeer(name) {
    try {
      const rows = (await call(`hub:${name}/sessions.snapshots`, {})) || [];
      const seen = new Set();
      for (const row of rows) {
        if (!row || !row.sessionId) continue;
        row.hub = name;
        seen.add(row.sessionId);
        sessionHub.set(row.sessionId, name);
        fold(row);
      }
      for (const [id, h] of [...sessionHub]) {
        if (h === name && !seen.has(id)) { sessions.delete(id); sessionHub.delete(id); }
      }

  }
  // Everything we key by session id, dropped when that session leaves the
  // fleet. This client can stay open for days on a phone, so the per-session
  // bookkeeping (dismissed signatures especially, one per resolved item) would
  // otherwise only ever grow.
  function pruneSessionState(live) {
    for (const m of [prevAmbient, doneAt, resolvedQs]) {
      for (const id of [...m.keys()]) if (!live.has(id)) m.delete(id);
    }
    const sidOf = (sig) => String(sig).split(':')[0];
    for (const sig of [...dismissed]) if (!live.has(sidOf(sig))) dismissed.delete(sig);
    const now = Date.now();
    for (const [sig, until] of [...snoozed]) if (until <= now || !live.has(sidOf(sig))) snoozed.delete(sig);
    for (const set of [S.openWork, S.openRuns]) {
      for (const k of [...set]) if (k.includes(':') && !live.has(k.split(':')[0])) set.delete(k);
    }
    for (const k of [...S.picks.keys()]) if (!live.has(String(k).split(':')[0])) S.picks.delete(k);
  }

  function upsert(snap) {
    if (!snap || !snap.sessionId) return;
    fold(snap);
    afterData(snap.sessionId);
  }
  function afterData(changedId) {
    pruneConv();
    // A notification tap names an agent whose snapshot may not have arrived
    // yet, so retry the deep-link on every data tick, not just after the seed.
    maybeOpenPending();
    renderChrome();
    if (S.screen === 'chat' || S.screen === 'flows') {
      if (!changedId || changedId === S.sessionId) render();
    } else render();
  }
  function maybeOpenPending() {
    if (pendingAgent && sessions.get(pendingAgent)) { const id = pendingAgent; pendingAgent = ''; openChat(id); }
  }

  const isLive = (s) => !!s && s.status !== 'ended';
  const isBlocked = (s) => !!(s && (s.pendingApproval || (s.pendingQuestions && s.pendingQuestions.length)));
  const isWorking = (s) => {
    // A down hub's snapshots are frozen at the moment the link dropped — a
    // spinner there would be claiming live progress nobody can see.
    if (hubDown(s)) return false;
    const a = s && s.ambientState;
    return isLive(s) && !isBlocked(s) && (a === 'streaming' || a === 'thinking' || a === 'background');
  };
  const agentName = (s) => s.label || basename(s.liveCwd || s.cwd) || String(s.sessionId || '').slice(0, 8) || 'agent';
  const agentPath = (s) => s.liveCwd || s.cwd || '';
  const providerOf = (s) => (s && s.provider) || 'claude';

  const PROVIDER_LABEL = { claude: 'Claude', codex: 'Codex', opencode: 'OpenCode', pi: 'Pi' };

  /** The small chip a federated session's cards carry — which hub it lives on. */
  const hubChipHtml = (s) => hubOf(s)
    ? `<span class="hub${hubDown(s) ? ' off' : ''}">${esc(hubOf(s))}</span>` : '';

  function hubOfflineLine(s) {

    return 'hub offline' + (ago ? ' — last seen ' + ago : '');
  }

  /** shortModelLabel, ported verbatim from lib/modelLabel.ts (its tests pin
   *  `sonnet[1m]` unchanged, so the `[1m]` marker must survive). */
  function shortModel(m) {
    if (!m || typeof m !== 'string') return '';
    return m.replace(/^[\w.-]+\//, '').replace(/^claude-/, '').replace(/-\d{6,}$/, '');
  }

  /** deriveSessionStats — statusLine wins over transcript-derived usage. */
  function stats(s) {
    const sl = s.statusLine || {}, u = s.usage || {};
    const model = sl.modelDisplay || shortModel(u.model || (s.settings && s.settings.model) || '');

    if (typeof sl.contextUsedPct === 'number') ctxPct = sl.contextUsedPct;
    else if (u.contextLimit) ctxPct = (u.contextTokens / u.contextLimit) * 100;
    // A missing contextTokens against a present limit yields NaN, which every
    // `!== undefined` guard downstream would wave through — rendering "NaN%" on
    // a NaN-width bar, coloured green as if the window were healthy.
    if (!Number.isFinite(ctxPct)) ctxPct = undefined;
    const inTok = sl.totalInputTokens ?? u.totalInputTokens;
    const outTok = sl.totalOutputTokens ?? u.totalOutputTokens;
    return {
      model,
      ctxPct: ctxPct === undefined ? undefined : clamp(Math.round(ctxPct), 0, 100),
      ctxTokens: u.contextTokens, ctxLimit: sl.contextWindowSize || u.contextLimit,
      inTok, outTok,
      costUSD: sl.costUSD ?? u.costUSD,
      fiveHourPct: sl.fiveHourPct, fiveHourResetsAt: sl.fiveHourResetsAt,
      sevenDayPct: sl.sevenDayPct, sevenDayResetsAt: sl.sevenDayResetsAt,
      monthlyPct: sl.monthlyPct, monthlyResetsAt: sl.monthlyResetsAt,
      rateLimitWarning: sl.rateLimitWarning,

  }

  // ══ tool summaries ════════════════════════════════════════════════════════
  // Ported from the renderer's formatToolSummary (components/claude-shared.tsx)
  // so a tool line reads the same on the phone as on the desktop.
  const fp = (p) => String(p || '').split(/[/\\]/).pop() || '';

    let added = 0, removed = 0;
    const lines = String(diff || '').split('\n');
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (l.startsWith('***') || l.startsWith('@@')) continue;
      if (l.startsWith('--- ') && lines[i + 1] && lines[i + 1].startsWith('+++ ')) { i++; continue; }
      if (l.startsWith('+')) added++;
      else if (l.startsWith('-')) removed++;
    }
    return { added, removed };
  }

    if (!input || typeof input !== 'object') return typeof input === 'string' ? input : '';
    for (const v of Object.values(input)) if (typeof v === 'string' && v) return v;
    return '';
  }
  function toolSummary(tc) {
    const name = tc.name || 'tool', i = tc.input || {};
    switch (name) {
      case 'Read': return { verb: 'read', arg: fp(i.file_path) };
      case 'Edit': case 'MultiEdit': return { verb: 'edit', arg: fp(i.file_path) };
      case 'Write': return { verb: 'write', arg: fp(i.file_path) };
      case 'NotebookEdit': return { verb: 'edit', arg: fp(i.notebook_path || i.file_path) };
      case 'apply_patch': case 'patch': return { verb: 'edit', arg: fp(i.file_path || i.path) || 'patch' };
      case 'Bash': case 'shell': case 'exec_command': {
        const raw = i.command ?? i.cmd;
        const cmd = Array.isArray(raw) ? raw.join(' ') : String(raw ?? '');
        return { verb: name === 'Bash' ? 'bash' : 'shell', arg: oneLine(cmd, 60) };
      }
      case 'Grep': case 'Glob': return { verb: 'grep', arg: String(i.pattern ?? '') };
      case 'WebSearch': case 'web_search': return { verb: 'search', arg: String(i.query ?? '') };
      case 'WebFetch': return { verb: 'fetch', arg: String(i.url ?? '') };
      case 'Agent': case 'Task': return { verb: 'agent', arg: String(i.description ?? 'subagent') };
      case 'Workflow': {
        let n = i.name;
        if (!n && typeof i.script === 'string') { const m = /name:\s*['"`]([^'"`]+)/.exec(i.script); if (m) n = m[1]; }
        return { verb: 'flow', arg: String(n ?? 'workflow') };
      }
      case 'TodoWrite': return { verb: 'plan', arg: 'checklist' };
      default: return { verb: String(name).toLowerCase().slice(0, 8), arg: oneLine(firstStringValue(i), 40) };
