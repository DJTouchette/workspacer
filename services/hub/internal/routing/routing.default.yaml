# ~/.config/workspacer-hub/routing.yaml — THE SHIPPED DEFAULT ROUTING MATRIX.
#
# Written here once, on first run, from the copy compiled into the hub binary.
# It will NOT be rewritten while it exists: edit it freely. If you delete it on
# purpose it stays deleted — the compiled-in copy is still the base of every
# answer, so nothing breaks; you only lose this documentation.
#
# ---------------------------------------------------------------------------
# HOW THIS FILE IS READ
#
#   * Your file is DEEP-MERGED OVER the defaults compiled into the binary, key
#     by key. No block is wholesale. Anything you omit still resolves, and a
#     release that adds a role, a capability or a profile works against a file
#     written before it existed.
#
#   * A merge CANNOT DELETE, and for a routing matrix that is the correct
#     failure mode: an unresolvable role falls back to the shipped default,
#     never to nothing. To turn something off, SAY SO — `enabled: false` — never
#     by removing it.
#
#   * Save it and the next tick picks it up. No restart, no watcher. A file that
#     cannot be read, or that does not parse, leaves the running matrix EXACTLY
#     as it was and logs: a half-typed edit, or an editor unlinking the file
#     during its own atomic save, must not silently disarm routing.
#
#   * Every key taken from this file is logged at load, and so is every key that
#     matches nothing in the shipped defaults (usually a typo). A matrix that
#     only half-applied is worse than one that refused.
#
#   * Model ids are validated at load against the LIVE provider catalogs
#     (`GET /providers/:provider/models` and `claude.listModels`). An id your
#     installed CLI no longer serves is reported at load, not discovered at
#     spawn time. A provider that cannot be reached is skipped, not condemned.
#
# ---------------------------------------------------------------------------
# THE IDEA, in one line
#
# Workflow logic names a CAPABILITY, never a model. A profile resolves the
# capability to a real (provider, model, effort). Limit state then moves the
# router above or below that default, instead of there being three separate
# piles of model-selection logic. Model vendors rename things; this file is the
# only place that has to know.
#
# ---------------------------------------------------------------------------
# WHY IT LIVES HERE, and not in config.yaml
#
# 0600, in the hub's own state directory, beside jobs.json. There is NO routing
# write RPC over the bus and there never will be one; `config.save` cannot
# address another file at all; `library.save` is confined to the library; and
# `fs.write` refuses this whole directory. That is what makes the `ceilings:`
# block at the bottom mean something rather than merely say something.
#
# PROVIDER IDS ARE WORKSPACER'S, NOT THE VENDORS'. The design spec writes
# "openai" and "anthropic"; the ids the spawn wire actually takes are `codex`
# and `claude` (plus `copilot`, `opencode`, `pi`). `openai` and `anthropic` are
# accepted here as aliases and normalized at load with a log line, so a matrix
# pasted out of the spec still works.

version: 1

# Which profile resolves capabilities right now. One of the keys under
# `profiles:` below. `mixed` is the recommended default when both subscriptions
# are available: it distributes consumption across two providers AND buys
# model-family diversity on review, which is the point of section 23.
active_profile: mixed

# ---------------------------------------------------------------------------
# CAPABILITIES — the vocabulary workflow logic is allowed to use.
#
#   cheap          High-volume work where the design decisions are already made:
#                  repo searching, reference tracing, repetitive edits,
#                  boilerplate, mechanical fixes.
#   balanced       Strong general coding without spending the most valuable
#                  allowance: scouting, bug investigation, routine review,
#                  straightforward fixes, browser validation.
#   frontier       The primary serious engineering tier: feature implementation,
#                  difficult debugging, consequential business logic.
#   frontier_max   The top of the ordinary ladder — same model, more reasoning —
#                  for difficult work inside the frontier tier.
#   reviewer       Routine independent review. NOT the same thing as `balanced`:
#                  independence is part of the requirement, not a coincidence.
#   deep_reviewer  Architecture and logic review where the reviewer must be able
#                  to disagree with a frontier implementer.
#   frontier_plus  RESERVED. Repeated frontier failure, serious model
#                  disagreement, P0 findings, critical adjudication. An
#                  escalation target, not a default execution tier.
#
# Adding a name here does nothing on its own — every profile has to resolve it.
capabilities:
  - cheap
  - balanced
  - frontier
  - frontier_max
  - reviewer
  - deep_reviewer
  - frontier_plus

# ---------------------------------------------------------------------------
# CAPABILITY RANKS — how STRONG each capability is, which is the one question
# the list above cannot answer.
#
# `capabilities:` is a vocabulary, and its order is documentation. It is NOT a
# ladder: `reviewer` is listed after `frontier` and resolves to Sonnet High,
# which is cheaper than frontier's Sol High. Read list position as strength and a
# `max_capability: frontier` ceiling would refuse every reviewer spawn — a clamp
# firing on the cheaper side of the thing it is protecting.
#
# Ties are real and allowed: deep_reviewer (Opus High) and frontier (Sol High)
# are the same strength on two different model families, which is exactly what
# section 23's independent review is buying.
#
# Only the `ceilings:` block reads these. A capability with no rank here CANNOT
# be compared, so a ceiling clamps it rather than waving it through — the load
# log names any capability you add without ranking it.
capability_ranks:
  cheap: 1
  balanced: 2
  reviewer: 2
  frontier: 3
  deep_reviewer: 3
  frontier_max: 4
  frontier_plus: 5

# ---------------------------------------------------------------------------
# ROLES — what each kind of worker needs, as a capability. This is the clean
# part: the profiles below merely resolve the aliases.
roles:
  # NOT CONSULTED YET. The Fleet Manager's own model is chosen before there is a
  # manager to ask, and it is a user-facing setting: Settings -> Fleet Manager
  # (`agents.managerProvider` / `managerModels` / `managerEfforts`). This row is
  # here so the vocabulary is complete and so the two can be reconciled later —
  # two mechanisms that both claim to pick the supervisor's model, with neither
  # naming the other, is a bug this project has already had once.
  supervisor: frontier
  scout: balanced
  mechanical: cheap
  implementer: frontier
  reviewer: reviewer
  deep_reviewer: deep_reviewer
  fixer: balanced
  complex_fixer: frontier
  validator: balanced
  diagnostician: frontier
  judge: frontier_plus

# ---------------------------------------------------------------------------
# PROFILES — capability -> (provider, model, effort).
#
#   provider  a workspacer provider id: claude | codex | copilot | opencode | pi
#   model     an id that provider's CLI actually serves (validated at load)
#   effort    reasoning effort. The ladders differ per provider and are NOT
#             interchangeable: claude is low|medium|high|xhigh|max, codex is
#             minimal|low|medium|high|xhigh. The spec's "Sol Max" is codex's
#             `xhigh` — codex has no level named `max`.
#   fresh     the worker must NOT inherit the previous agent's conversation.
#             Set on every same-family reviewer, because a Sol reviewer that
#             inherits the Sol implementer's reasoning is not a reviewer.
#   enabled   set to false to take an entry out of service. Omitting it is not
#             the same thing — a deep merge cannot delete, by design.
profiles:
  # Codex builds and diagnoses; Anthropic reviews and adjudicates. Two
  # subscriptions drawn down in parallel, and an implementer never reviewed by
  # its own model family.
  mixed:
    cheap: { provider: codex, model: gpt-5.6-luna }
    balanced: { provider: codex, model: gpt-5.6-terra, effort: high }
    frontier: { provider: codex, model: gpt-5.6-sol, effort: high }
    frontier_max: { provider: codex, model: gpt-5.6-sol, effort: xhigh }
    # These are cross-family here, so they are already independent of a codex
    # implementer by construction. `fresh` is set anyway: it is a property of
    # the ROLE, not of whether a profile happens to pair two families. Leave it
    # unset and freshness holds only by accident of the model pairing, and it
    # stops holding the moment someone edits this profile so implementer and
    # reviewer land on the same family.
    reviewer: { provider: claude, model: sonnet, effort: high, fresh: true }
    deep_reviewer: { provider: claude, model: opus, effort: high, fresh: true }
    frontier_plus: { provider: claude, model: fable, fresh: true }

  # One subscription. The critical detail is FRESH REVIEW CONTEXT: the reviewer
  # gets the ticket, the acceptance criteria, the architecture rules, the diff,
  # the relevant source and the test results — and not the implementer's
  # reasoning history.
  codex_only:
    cheap: { provider: codex, model: gpt-5.6-luna }
    balanced: { provider: codex, model: gpt-5.6-terra, effort: high }
    frontier: { provider: codex, model: gpt-5.6-sol, effort: high }
    frontier_max: { provider: codex, model: gpt-5.6-sol, effort: xhigh }
    reviewer: { provider: codex, model: gpt-5.6-terra, effort: high, fresh: true }
    deep_reviewer: { provider: codex, model: gpt-5.6-sol, effort: high, fresh: true }
    frontier_plus: { provider: codex, model: gpt-5.6-sol, effort: xhigh, fresh: true }

  # Sonnet is used considerably more aggressively than the traditional Claude
  # hierarchy would imply — that is deliberate, and it is the user's call from
  # what they have been seeing.
  anthropic_only:
    cheap: { provider: claude, model: sonnet }
    balanced: { provider: claude, model: sonnet, effort: high }
    frontier: { provider: claude, model: opus, effort: high }
    frontier_max: { provider: claude, model: opus, effort: max }
    reviewer: { provider: claude, model: sonnet, effort: high, fresh: true }
    deep_reviewer: { provider: claude, model: opus, effort: high, fresh: true }
    frontier_plus: { provider: claude, model: fable, fresh: true }

# ---------------------------------------------------------------------------
# PROVIDERS — what is known about each one's capacity, not what it can do.
#
#   metered       this provider exposes a subscription allowance worth routing
#                 around. Only claude and codex report usage windows.
#   when_unknown  the health to assume when there is NO trustworthy limit
#                 information: `yellow` is the conservative default for a
#                 metered provider (do not pretend to know), `unmetered` means
#                 the question does not apply and the provider stays eligible.
providers:
  codex: { metered: true, when_unknown: yellow }
  claude: { metered: true, when_unknown: yellow }
  copilot: { metered: false, when_unknown: unmetered } # no readable quota, ever
  opencode: { metered: false, when_unknown: unmetered } # BYO key
  pi: { metered: false, when_unknown: unmetered } # BYO key

# ---------------------------------------------------------------------------
# THRESHOLDS — the rules that pick a routing mode. Configuration, deliberately,
# rather than constants buried in Go.
thresholds:
  # SPEND_DOWN: unused subscription capacity has no value after the reset, so
  # near a reset with capacity left and little demand coming, spend it on
  # confidence — a second independent reviewer, a stronger scout — never on
  # arbitrary extra tokens.
  spend_down:
    time_to_reset_minutes: 90
    min_remaining_pct: 50
    max_forecast_pct_of_remaining: 30
  # Health from the worst applicable limit bucket. A provider is not GREEN just
  # because its short window is healthy while the weekly one is not.
  health:
    yellow_at_used_pct: 70
    red_at_used_pct: 90

# ---------------------------------------------------------------------------
# FORECAST WEIGHTS — how much premium demand a ticket in each phase implies.
# Static on purpose; historical usage replaces these later, not machine
# learning.
forecast_weights:
  scouting: 1
  implementation: 4
  review: 2
  fixing: 2
  validation: 1

# ---------------------------------------------------------------------------
# MODE SHIFTS — what a routing mode DOES, keyed by mode then by role.
#
# The `roles:` table above is the NORMAL answer, so `normal` has no block here:
# restating it would be two places to keep in agreement. A role with no entry
# under a mode keeps its usual capability.
#
# Keyed by ROLE rather than by capability on purpose. Sections 12 and 13 of the
# design are per-role and disagree per role about the same capability — CONSERVE
# moves the scout down off `balanced` while the fixer stays on it — so a
# capability -> capability map would move both and be wrong about one.
#
# Every value must be a name from `capabilities:` above; anything else is
# reported at load and ignored.
mode_shifts:
  # "scouting -> cheaper tier; mechanical work -> cheap; routine fixes ->
  # balanced; browser validation -> balanced/cheap; frontier for implementation
  # and hard diagnosis only; frontier_plus strict escalation only."
  #
  # `fixer` HAS NO ENTRY HERE ON PURPOSE, and its absence is the point of
  # keying these by role: section 12 says routine fixes STAY on the balanced
  # tier under conserve, which is what `roles.fixer: balanced` above already
  # says, so restating it would be a second place to keep in agreement. The
  # scout drops off `balanced` and the fixer does not — a capability ->
  # capability map would have moved both and been wrong about one. Demoting the
  # role that repairs broken work is also the demotion most likely to cost more
  # than it saves.
  conserve:
    scout: cheap
    validator: cheap
    judge: deep_reviewer
  # "balanced scout -> frontier scout; balanced reviewer -> frontier reviewer;
  # frontier high -> frontier max on difficult work." Unused subscription
  # capacity has no value after the reset, so near one it buys assurance.
  #
  # `fixer` IS PROMOTED HERE, and that is a reading of section 13's worked
  # example rather than of its prose rules. The example turns a normal ticket
  # from "Terra scout / Sol implementation / Sonnet review / Terra fixer" into
  # "Sol scout / Sol implementation / Sonnet review / Opus second review / Sol
  # fixer" — and the fixer promotion is the only one of those lines a role ->
  # capability map could produce that was previously missing. It is also the
  # mirror of the deliberate omission under `conserve:` above: the fixer is the
  # role that repairs broken work, so demoting it is the demotion most likely to
  # cost more than it saves, and promoting it on capacity that expires anyway is
  # the same judgement pointing the other way.
  #
  # WHAT IS STILL NOT HERE, on purpose: "single reviewer -> two independent
  # reviewers". That is a change to how many agents a ticket runs, not to which
  # capability one agent gets, and this table cannot express it. It belongs to
  # whatever dispatches the review, not to the matrix.
  spend_down:
    scout: frontier
    reviewer: deep_reviewer
    implementer: frontier_max
    fixer: frontier
    complex_fixer: frontier_max
    diagnostician: frontier_max

# ---------------------------------------------------------------------------
# MODES — the manual override. `auto` lets the thresholds above decide.
#   auto | conserve | normal | spend_down
#
# A per-provider entry wins over the global one for that provider — EXCEPT
# `auto`, which is a deferral rather than a verdict and falls through to the
# global. That exception is load-bearing rather than pedantic: the two entries
# below ship in this file to document the shape, a deep merge cannot delete
# them, and without it `global: conserve` on its own would be overruled for
# codex and claude — the only two providers with a readable allowance — by two
# lines the hub itself wrote into your file.
#
# To hold one provider out of a global conserve, say `normal`. That is a verdict
# and it wins.
modes:
  global: auto
  providers:
    codex: auto
    claude: auto

# ---------------------------------------------------------------------------
# CEILINGS — the most a spawn started in a given project directory may be given,
# keyed by project directory, whatever the caller asks for.
#
#   max_capability  the highest capability a spawn there may resolve to.
#   max_tool_scope  the highest authority tier a worker there may be handed:
#                   view | triage | operator. ("tier" already means AUTHORITY in
#                   this codebase, which is why the model axis is called
#                   `capability` everywhere above.)
#
# The `default` key applies to any directory with no entry of its own; the
# longest matching ancestor directory wins over it.
#
# This is a CEILING, not an assignment: it can only lower what was asked for.
# It is enforceable rather than merely stated because of where this file lives —
# no agent can write to it, and there is no routing write RPC.
#
# WHERE IT IS ENFORCED, and on what. Every agents.spawn that arrives over the
# bus — the remote clients, the MCP facade, a hub job, a federated peer — passes
# one Go function in the hub router, and that is where the two limits above are
# applied. A spawn asking for more is not refused outright: the excess is
# CLAMPED and the caller is told what was taken, in the spawn's own answer, so a
# manager learns its dispatch was narrowed instead of quietly getting less.
#
# `routing.select` APPLIES THE SAME CEILING BEFORE IT ANSWERS. It looks up the
# ceiling for the directory you name and caps its answer to it, so it can never
# advise a model the spawn gate will then take away. The gate still clamps
# independently — it is the security boundary, and it must refuse a caller that
# ignored routing entirely — but under normal use the two agree because they run
# the same code against the same canonical path.
#
# `max_capability` binds three things, and the last two are what stop the first
# from being a label:
#
#   * the spawn's declared `capability` (what a dispatch acting on a routing
#     decision copies from that decision);
#   * the capability the MODEL it names resolves to in the `profiles:` above,
#     read at its STRONGEST. `opus` with no `effort` could be frontier,
#     deep_reviewer OR frontier_max, so under a `frontier` ceiling it is refused
#     — a caller must not get the cheapest interpretation of an ask the provider
#     is free to run at its strongest. Naming `effort: high` narrows the reading
#     and it is admitted. A model this file never mentions is not judged at all;
#   * the MODEL THE CLAMP LEAVES BEHIND. When it lowers a capability it also
#     names what the permitted one resolves to and writes that onto the spawn,
#     because an OMITTED model is not a weak model — it is the provider's own
#     configured default, chosen below anything this file can see.
#
# A CEILING VALUE THIS FILE CANNOT READ REFUSES THE SPAWN. A `max_capability`
# that `capability_ranks:` does not rank, or a `max_tool_scope` that is not
# view/triage/operator, used to be reported at load and then ignored — so one
# typo silently deleted the protection for that whole tree and looked exactly
# like a directory nobody had capped. Such a row now denies, quoting the value
# to fix. An OMITTED key is different and still means "this row does not cap
# that axis".
#
# The LOCAL desktop spawn dialog is deliberately NOT clamped. That is a human at
# the machine clicking Spawn, not an agent granting itself capability.
#
# AND THE LIMIT, stated plainly: this ceiling is enforced exactly as strongly as
# the Fleet Manager's own permission mode. It closes every capability door — the
# bus, fs.write, config.save. With approvals on, an edit to this file raises a
# prompt you see. With full access on, it does not. A ceiling is not a sandbox.
#
# ---------------------------------------------------------------------------
# WHAT THE SHIPPED `default` DOES AND DOES NOT CAP. Read this before assuming
# you are protected, and before assuming you are not.
#
# IT DOES cap the model axis at `frontier` for every directory you have not
# given an entry of its own. In practice:
#
#   * `frontier_plus` — the RESERVED escalation tier, Fable under `mixed` and
#     `anthropic_only` — is refused everywhere by default. The `judge` role sits
#     at frontier_plus, so a judge dispatch resolves to `frontier` instead:
#     under `mixed` that is codex gpt-5.6-sol at high effort. routing.select
#     says so in its reason list rather than answering Fable and having the
#     answer taken away.
#   * `frontier_max` (Sol xhigh / Opus max) is refused too, which matters most
#     under SPEND_DOWN: that mode promotes implementer, complex_fixer and
#     diagnostician to frontier_max, and under this default those promotions
#     land back on `frontier`. If spending expiring capacity on the top tier is
#     the point of your setup, raise the default or cap per directory instead.
#   * everything at or below `frontier` — cheap, balanced, reviewer,
#     deep_reviewer, frontier — is untouched. Ordinary implementation and review
#     work is not affected.
#
# IT DOES NOT CAP AUTHORITY AT ALL by default: `max_tool_scope: operator` is the
# top tier, so a spawn may still be handed the full workspacer tool set. Lower
# it here, or per directory, if a worker in a given tree should never be able to
# approve, spawn or write.
#
# IT DOES NOT CAP a model this file never mentions. `opus[1m]` is not `opus` as
# far as the matrix is concerned, and a provider's own configured default is
# reached below this layer except on the clamp path described above.
#
# IT DOES NOT CAP the local desktop spawn dialog, a human running the CLI
# directly, or anything that does not come over the bus.
#
# ONE LINE CAPS A PROJECT. That is the act this block is really for — the
# default is a floor, not a policy:
#
#   /home/you/Work/some-client-repo: { max_capability: balanced, max_tool_scope: triage }
#
ceilings:
  default: { max_capability: frontier, max_tool_scope: operator }
  # Per-project overrides look like this — an absolute directory as the key. The
  # longest matching ancestor wins, so one entry covers a whole tree:
  #
  # /home/you/Work/some-client-repo: { max_capability: balanced, max_tool_scope: triage }
