[package]
name = "wks-native"
version = "0.1.0"
edition = "2024"
description = "Experimental GPUI client for Workspacer's hub bus"
license = "MIT"
default-run = "wks-native"

[features]
default = ["ui", "embedded"]
ui = ["dep:gpui", "dep:gpui-component", "dep:gpui-component-assets"]
ui-tests = ["ui", "gpui/test-support"]

embedded = ["dep:claudemon", "dep:serde_yaml"]

[dependencies]
claudemon = { path = "../../services/claudemon", optional = true }
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify-rust = "4"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff", "jpeg", "gif", "webp"] }
async-channel = "2"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
env_logger = { version = "0.11", default-features = false }
futures-util = "0.3"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
gpui = { version = "=0.2.2", optional = true }
gpui-component-assets = { version = "=0.5.1", optional = true }
gpui-component = { version = "=0.5.1", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { version = "0.9.34", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
url = "2"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }

[[bin]]
name = "wks-native"
path = "src/main.rs"
required-features = ["ui"]

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
