[package]
name = "wks-native"
version = "0.1.0"
edition = "2024"
description = "Experimental GPUI client for Workspacer's hub bus"
license = "MIT"
default-run = "wks-native"

[features]
default = ["ui"]
ui = ["dep:gpui", "dep:gpui-component"]
ui-tests = ["ui", "gpui/test-support"]

[dependencies]
anyhow = "1"
async-channel = "2"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
env_logger = { version = "0.11", default-features = false }
futures-util = "0.3"
gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.1", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
url = "2"

[[bin]]
name = "wks-native"
path = "src/main.rs"
required-features = ["ui"]

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
