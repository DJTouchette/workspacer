[package]
name = "wks-native"
version = "0.1.0"
edition = "2024"
description = "Experimental GPUI client for Workspacer's hub bus"
license = "MIT"
default-run = "wks-native"

[features]
default = ["ui", "rust-hub"]
ui = ["dep:gpui", "dep:gpui-component", "dep:gpui-component-assets"]
ui-tests = ["ui", "gpui/test-support"]

# Compatibility feature name: embedded ownership now always uses the Rust hub.
embedded = ["rust-hub"]
rust-hub = ["dep:claudemon", "dep:workspacer-hub"]

[dependencies]
claudemon = { path = "../../services/claudemon", optional = true }
workspacer-hub = { path = "../../services/hub-rs", optional = true }
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify-rust = "4"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff", "jpeg", "gif", "webp", "ico"] }
chrono = "0.4"
async-channel = "2"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
env_logger = { version = "0.11", default-features = false }
futures-util = "0.3"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
gpui = { version = "=0.2.2", optional = true }
gpui-component-assets = { version = "=0.5.1", optional = true }
gpui-component = { version = "=0.5.1", optional = true, default-features = false, features = ["tree-sitter-languages"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
url = "2"
unicode-general-category = "1.1"
qrcodegen = "1"
# Per-agent terminal emulation (src/terminal.rs); already in the tree via claudemon.
vt100 = "0.15"

# Watching a popped-out window for X11 DestroyNotify (src/ui/window_destroy.rs);
# already in the tree through GPUI.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }

[[bin]]
name = "wks-native"
path = "src/main.rs"
required-features = ["ui"]

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
gpui = { path = "../../vendor/gpui" }
gpui-component = { path = "../../vendor/gpui-component" }
portable-pty = { path = "../../vendor/portable-pty" }

[[test]]
name = "background_process"
path = "tests/background_process.rs"
required-features = ["rust-hub"]

# Copies of this executable play the app, installer and a busy process, so it
# owns its main (Windows only; other platforms report a skip).
[[test]]
name = "windows_update_handoff"
path = "tests/windows_update_handoff.rs"
harness = false
