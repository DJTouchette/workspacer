appId: com.workspacer.app
productName: Workspacer
asar: true

# Windows Task Manager (and Explorer) label processes with the exe's
# FileDescription, which electron-builder fills from package.json
# "description" — so every Electron subprocess repeated the full marketing
# sentence. Override the packaged metadata so processes read simply
# "Workspacer"; package.json keeps the long description for npm/docs.
extraMetadata:
  description: Workspacer

# electron-updater reads the latest PUBLISHED GitHub Release for this repo. This
# provider block is what makes electron-builder generate the update metadata
# (latest.yml / latest-linux.yml / latest-mac.yml + .blockmap files) alongside
# the installers. CI builds with `--publish never`, so nothing is uploaded from
# the build itself — the release workflow attaches the installers AND the
# metadata files to the drafted GitHub Release, which is the feed clients read.
publish:
  provider: github
  owner: DJTouchette
  repo: workspacer

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - node_modules/**/*
  - package.json
  - '!node_modules/**/*.{md,map,ts}'
  - '!node_modules/**/{test,tests,__tests__,docs,.github}/**'
  - '!**/*.d.ts'

asarUnpack:
  - node_modules/better-sqlite3/**
  # ripgrep binary must live outside the asar so it can be executed.
  - node_modules/@vscode/ripgrep/**
  - node_modules/@vscode/ripgrep-*/**

electronLanguages:
  - en-US

# Electron retains its owned claudemon and provides UI capabilities to the Rust
# control plane. The standalone Rust executable also embeds its own engine when
# started with `serve`; no Go executables or private Node companion are packaged.
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
  extraResources:
    - from: ../../services/claudemon/target/release/claudemon
      to: claudemon/claudemon
    - from: ../../services/hub-rs/target/release/workspacer-rust
      to: hub/workspacer-rust
    - from: ../../plugins/examples
      to: hub/examples
    - from: dist/web
      to: web

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  extraResources:
    - from: ../../services/claudemon/target/release/claudemon.exe
      to: claudemon/claudemon.exe
    - from: ../../services/hub-rs/target/release/workspacer-rust.exe
      to: hub/workspacer-rust.exe
    - from: ../../plugins/examples
      to: hub/examples
    - from: dist/web
      to: web

mac:
  icon: build/icon.png
  target:
    - dmg
  category: public.app-category.developer-tools
  extraResources:
    - from: ../../services/claudemon/target/release/claudemon
      to: claudemon/claudemon
    - from: ../../services/hub-rs/target/release/workspacer-rust
      to: hub/workspacer-rust
    - from: ../../plugins/examples
      to: hub/examples
    - from: dist/web
      to: web

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
