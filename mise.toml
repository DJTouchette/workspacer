[tools]
# Optional historical oracle tooling only; shipping backends build with Rust.
# Pinned Go checkout commands: scripts/reference/README.md (no current-tree fallback).
go = "1.25"
# Node: Electron app + renderer (README requires Node 18+; pin to current LTS)
node = "22"

[env]
# Ensure the desktop app's node_modules binaries resolve in tasks
_.path = ["./apps/desktop/node_modules/.bin"]
